<!DOCTYPE html>
<!-- Auth smoke test — Phase 0.4. ลบไฟล์นี้ทิ้งหลังทดสอบเสร็จ
     ไม่แตะ Firestore ไม่แตะ index.html — ทดสอบ Google Sign-In อย่างเดียว
     Built: 31 Jul 2026 · 14:00 (ICT) -->
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Catwalk — Auth Test</title>
<link rel="manifest" href="authtest-manifest.json"/>
<style>
  body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:#faf9f7;margin:0;padding:24px;color:#1c1c1e}
  .wrap{max-width:380px;margin:0 auto}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:12px;color:#8e8e93;margin-bottom:20px}
  .card{background:#fff;border:1px solid #ebebeb;border-radius:14px;padding:16px;margin-bottom:12px}
  button{width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
  .p{background:#ff6b9d;color:#fff}
  .g{background:none;color:#636366;border:1px solid #ebebeb}
  .row{font-size:12px;line-height:1.9;word-break:break-all}
  .k{color:#8e8e93}
  .ok{color:#0a7d32;font-weight:700}
  .bad{color:#c62828;font-weight:700}
  pre{background:#1c1c1e;color:#4fffb0;font-size:10px;padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 Auth Smoke Test</h1>
  <div class="sub">ทดสอบ Google Sign-In — ไม่แตะข้อมูลจริง</div>

  <div class="card">
    <div class="row">
      <span class="k">โหมด:</span> <b id="mode">—</b><br/>
      <span class="k">Origin:</span> <span id="origin">—</span><br/>
      <span class="k">authDomain:</span> <span id="adom">—</span>
    </div>
  </div>

  <button class="p" id="btnPopup">เข้าสู่ระบบ (Popup)</button>
  <button class="g" id="btnRedirect">เข้าสู่ระบบ (Redirect)</button>
  <button class="g" id="btnOut">ออกจากระบบ</button>

  <div class="card">
    <div id="status" class="row">รอทดสอบ...</div>
    <pre id="log"></pre>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyDyJDGHrC2GFW-sly--8YI7jf3CJPtN0QU",
  authDomain:"catwalk-cat-hotel.firebaseapp.com",
  projectId:"catwalk-cat-hotel",
  storageBucket:"catwalk-cat-hotel.firebasestorage.app",
  messagingSenderId:"931868206069",
  appId:"1:931868206069:web:d32a90874acf679992b6bc"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.useDeviceLanguage();

const $=id=>document.getElementById(id);
const lines=[];
const log=m=>{ lines.push(new Date().toLocaleTimeString("th-TH")+"  "+m); $("log").textContent=lines.join("\n"); };

const standalone = window.navigator.standalone===true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

$("mode").textContent = standalone ? "PWA (เปิดจากไอคอน) ← โหมดที่ต้องทดสอบ" : "เบราว์เซอร์ปกติ";
$("origin").textContent = location.origin + location.pathname;
$("adom").textContent = firebaseConfig.authDomain;

const REDIRECT_FLAG="cw_authtest_redirect";

// ตรวจว่า redirect กลับมาแล้วได้ credential ไหม — จับกรณี "พังแบบเงียบ"
let pending=false;
try{ pending=!!sessionStorage.getItem(REDIRECT_FLAG); }catch(e){}
auth.getRedirectResult().then(res=>{
  if(pending){
    try{ sessionStorage.removeItem(REDIRECT_FLAG); }catch(e){}
    if(res.user) log("✅ redirect สำเร็จ");
    else if(!auth.currentUser){
      log("❌ redirect กลับมาแต่ไม่ได้ credential");
      log("   → เบราว์เซอร์บล็อก cross-site storage");
      log("   → ต้องย้าย hosting (ดูแผน Phase 1.7)");
      $("status").innerHTML='<span class="bad">❌ REDIRECT ถูกบล็อก</span>';
    }
  }
}).catch(e=>{
  try{ sessionStorage.removeItem(REDIRECT_FLAG); }catch(e2){}
  log("❌ getRedirectResult: "+(e.code||e.message));
});

auth.onAuthStateChanged(u=>{
  if(u){
    $("status").innerHTML='<span class="ok">✅ ล็อกอินสำเร็จ</span><br/>'+
      '<span class="k">email:</span> <b>'+(u.email||"—")+'</b><br/>'+
      '<span class="k">verified:</span> '+u.emailVerified+'<br/>'+
      '<span class="k">uid:</span> '+u.uid;
    log("signed in: "+u.email);
  }else{
    if(!/REDIRECT/.test($("status").textContent)) $("status").textContent="ยังไม่ได้ล็อกอิน";
    log("signed out");
  }
});

function provider(){
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  return p;
}

$("btnPopup").onclick=async()=>{
  log("→ signInWithPopup ...");
  try{ await auth.signInWithPopup(provider()); }
  catch(e){
    log("❌ popup: "+(e.code||e.message));
    $("status").innerHTML='<span class="bad">❌ POPUP ล้มเหลว: '+(e.code||"")+'</span>';
    if(standalone) log("   → PWA mode + popup พัง = ต้องใช้ redirect");
  }
};

$("btnRedirect").onclick=()=>{
  log("→ signInWithRedirect ...");
  try{ sessionStorage.setItem(REDIRECT_FLAG,"1"); }catch(e){}
  auth.signInWithRedirect(provider());
};

$("btnOut").onclick=async()=>{
  try{ sessionStorage.removeItem(REDIRECT_FLAG); }catch(e){}
  await auth.signOut();
  $("status").textContent="ออกจากระบบแล้ว";
};
</script>
</body>
</html>
