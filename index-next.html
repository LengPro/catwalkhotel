function importCombinedCSV(rows, existingCustomers, existingBookings){
  const newCustomers=[];
  const updatedCustomers=[];
  const newBookings=[];
  const errors=[];
  const custMap={};
  const updatedSet=new Set();
  existingCustomers.forEach(c=>{ custMap[c.nickname.toLowerCase()]=c; });

  rows.forEach((r,i)=>{
    const rowNum=i+2;
    // ── Customer fields (flexible column names) ──
    const name=(r["customer nickname"]||r["nickname"]||r["name"]||r["ชื่อ"]||r["ชื่อเล่น"]||r["owner"]||"").trim();
    const fullname=(r["full name"]||r["fullname"]||r["ชื่อเต็ม"]||"").trim();
    const phone=(r["phone"]||r["tel"]||r["mobile"]||r["เบอร์โทร"]||"").trim();
    const lineId=(r["other contacts"]||r["line id"]||r["line"]||r["line_id"]||r["contact"]||"").trim();
    const address=(r["address"]||r["ที่อยู่"]||"").trim();
    const custNotes=(r["customer notes"]||r["owner notes"]||"").trim();
    // ── Cat fields ──
    const cat1Name=(r["cat1 name"]||r["cat name"]||r["cat"]||r["ชื่อแมว"]||"").trim();
    const cat1Breed=(r["cat1 breed"]||r["breed"]||r["สายพันธุ์"]||"").trim();
    const cat2Name=(r["cat2 name"]||r["cat 2"]||"").trim();
    const cat2Breed=(r["cat2 breed"]||"").trim();
    const cat3Name=(r["cat3 name"]||r["cat 3"]||"").trim();
    const cat3Breed=(r["cat3 breed"]||"").trim();
    // ── Booking fields ──
    const checkin=(r["check-in"]||r["checkin"]||r["check in"]||r["check-in (yyyy-mm-dd)"]||r["วันเข้า"]||"").trim();
    const checkout=(r["check-out"]||r["checkout"]||r["check out"]||r["check-out (yyyy-mm-dd)"]||r["วันออก"]||"").trim();
    const roomId=(r["room id"]||r["room"]||r["ห้อง"]||r["roomid"]||"").trim().toUpperCase();
    const roomIdsStr=(r["room ids"]||r["room ids (multi)"]||"").trim();
    const rawSize=(r["room size"]||r["size (s/m/l)"]||r["size (s/m)"]||r["size"]||r["type"]||"S").trim().toUpperCase()||"S";
    const size=["S","M","L","H"].includes(rawSize)?rawSize:"S";
    const discount=parseFloat(r["discount %"]||r["discount"]||r["ส่วนลด"]||"0")||0;
    const deposit=parseFloat(r["deposit"]||r["มัดจำ"]||"0")||0;
    const payMethod=(r["payment method"]||r["payment"]||r["การชำระ"]||"Transfer").trim()||"Transfer";
    const paid=(r["fully paid"]||r["paid (yes/no)"]||r["paid"]||r["ชำระแล้ว"]||"").toLowerCase()==="yes";
    const litter=(r["cat litter"]||r["cat litter (yes/no)"]||r["litter"]||r["ทราย"]||"").toLowerCase()==="yes";
    const petTaxi=parseFloat(r["pet taxi"]||"0")||0;
    const extraFee=parseFloat(r["extra fee"]||r["extrafee"]||r["extra_fee"]||"0")||0;
    const extraFeeNote=(r["extra fee note"]||r["extrafeenote"]||r["extra_fee_note"]||"").trim();
    const notes=(r["booking notes"]||r["notes"]||r["หมายเหตุ"]||"").trim();

    if(!name){ errors.push(`Row ${rowNum}: ไม่มีชื่อลูกค้า`); return; }

    // ── Create or find customer ──
    const nameKey=name.toLowerCase();
    if(!custMap[nameKey]){
      const cats=[];
      if(cat1Name) cats.push({id:uid(),name:cat1Name,breed:cat1Breed,notes:"",photo:"",vaccinePassport:[]});
      if(cat2Name) cats.push({id:uid(),name:cat2Name,breed:cat2Breed,notes:"",photo:"",vaccinePassport:[]});
      if(cat3Name) cats.push({id:uid(),name:cat3Name,breed:cat3Breed,notes:"",photo:"",vaccinePassport:[]});
      const newCust={
        id:uid(),nickname:name,fullname,phone,line:lineId,address,notes:custNotes,idCard:"",
        cats:cats.length>0?cats:[{id:uid(),name:cat1Name||"",breed:cat1Breed,notes:"",photo:"",vaccinePassport:[]}],
        createdAt:new Date().toISOString(),
      };
      newCustomers.push(newCust);
      custMap[nameKey]=newCust;
    } else {
      // Update existing customer's missing fields if we have data
      const existing=custMap[nameKey];
      let changed=false;
      if(!existing.fullname&&fullname){existing.fullname=fullname;changed=true;}
      if(!existing.phone&&phone){existing.phone=phone;changed=true;}
      if(!existing.line&&lineId){existing.line=lineId;changed=true;}
      if(!existing.address&&address){existing.address=address;changed=true;}
      if(!existing.notes&&custNotes){existing.notes=custNotes;changed=true;}
      // Merge new cats not already present
      const existingCatNames=(existing.cats||[]).map(c=>c.name.toLowerCase());
      [cat1Name,cat2Name,cat3Name].forEach((cn,ci)=>{
        const breeds=[cat1Breed,cat2Breed,cat3Breed];
        if(cn&&!existingCatNames.includes(cn.toLowerCase())){
          existing.cats=existing.cats||[];
          existing.cats.push({id:uid(),name:cn,breed:breeds[ci],notes:"",photo:"",vaccinePassport:[]});
          existingCatNames.push(cn.toLowerCase());
          changed=true;
        }
      });
      if(changed&&!updatedSet.has(existing.id)){
        updatedSet.add(existing.id);
        updatedCustomers.push(existing);
      }
    }

    // ── Create booking if dates present ──
    if(checkin&&checkout){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(checkin)||!/^\d{4}-\d{2}-\d{2}$/.test(checkout)){
        errors.push(`Row ${rowNum}: วันที่ format ผิด (YYYY-MM-DD) → "${checkin}" / "${checkout}"`); return;
      }
      const cust=custMap[nameKey];
      const cats=cust.cats||[];
      const selectedCatIds=cats.filter(c=>c.name).map(c=>c.id);
      const numCats=Math.max(selectedCatIds.length,1);
      // Parse multi-room IDs if provided
      const roomIds=roomIdsStr?roomIdsStr.split("|").map(x=>x.trim().toUpperCase()).filter(x=>ROOMS.find(rm=>rm.id===x))
        :roomId&&ROOMS.find(rm=>rm.id===roomId)?[roomId]:[];
      const roomSize=roomIds.length>0?(ROOMS.find(rm=>rm.id===roomIds[0])?.type||size):size;
      const n=nights(checkin,checkout);
      const {base,discAmt,net,litterAmt,litterWeeks,pricePerNight}=n>0
        ? calcPrice(n,roomSize,numCats,discount,litter,checkin)
        : {base:0,discAmt:0,net:0,litterAmt:0,litterWeeks:0,pricePerNight:0};
      const remaining=parseFloat(Math.max(0,net-deposit).toFixed(2));
      const dupBook=existingBookings.find(b=>b.customerId===cust.id&&b.checkin===checkin&&b.checkout===checkout);
      if(dupBook){ errors.push(`Row ${rowNum}: booking ซ้ำ (${name} ${checkin})`); return; }
      newBookings.push({
        id:uid(),customerId:cust.id,
        roomId:roomIds[0]||"",roomIds,
        size:roomSize,checkin,checkout,
        selectedCatIds,numCats,
        discount:String(discount),base,discAmt,net,pricePerNight,
        litter,litterAmt,litterWeeks,petTaxiAmt:petTaxi,
        extraFeeAmt:extraFee,extraFeeNote,
        depositAmt:deposit,remaining,paid,
        payMethod,notes,
        createdAt:new Date().toISOString(),
      });
    }
  });
  return{newCustomers,updatedCustomers,newBookings,errors,totalRows:rows.length};
}

function SettingsPage({customers,bookings,onImportCustomers,onImportBookings,setToast,pricingDoc,onSavePricing,icalUrl,onSaveIcalUrl}){
  const me=window.__cwUser||null;
  const [backupBusy,setBackupBusy]=useState(false);
  const [showTok,setShowTok]=useState(false);
  const [editIcal,setEditIcal]=useState(false);
  const [icalDraft,setIcalDraft]=useState("");
  // Auto-hide the revealed token — stops it sitting on screen for a shoulder
  // surfer or an accidental screenshot.
  useEffect(()=>{ if(!showTok) return; const t=setTimeout(()=>setShowTok(false),15000); return()=>clearTimeout(t); },[showTok]);
  const maskedIcal=icalUrl?icalUrl.replace(/token=[^&]+/,"token=••••••••••••"):"";
  const [step,setStep]=useState("idle");
  const [preview,setPreview]=useState(null);
  const [dragOver,setDragOver]=useState(false);
  const fileRef=useRef();

  const parseImportFile=async(file)=>{
    const lowerName=(file.name||"").toLowerCase();
    const isExcel=lowerName.endsWith(".xlsx")||lowerName.endsWith(".xls");
    if(isExcel){
      await loadXLSX();
      const buffer=await file.arrayBuffer();
      const wb=XLSX.read(buffer,{type:"array"});
      const firstSheet=wb.SheetNames[0];
      if(!firstSheet) return [];
      return XLSX.utils.sheet_to_json(wb.Sheets[firstSheet],{defval:""})
        .map(row=>{
          const normalized={};
          Object.keys(row).forEach(k=>{
            normalized[String(k).trim()]=String(row[k]??"").trim();
          });
          return normalized;
        })
        .filter(r=>Object.values(r).some(v=>String(v).trim()));
    }
    const text=await file.text();
    return parseCSV(text);
  };

  const processFile=async(file)=>{
    if(!file) return;
    setStep("importing");
    const rows=await parseImportFile(file);
    if(rows.length===0){setStep("idle");setToast("❌ ไม่พบข้อมูลในไฟล์");return;}

    const headers=Object.keys(rows[0]).map(h=>h.toLowerCase());
    const hasBookingCols=headers.some(h=>h.includes("check")||h.includes("room"));
    const hasCustomerCols=headers.some(h=>h.includes("name")||h.includes("nickname"));

    if(hasCustomerCols&&hasBookingCols){
      // Combined format
      const result=importCombinedCSV(rows,customers,bookings);
      setPreview({type:"combined",...result});
    } else if(hasBookingCols){

    } else if(hasCustomerCols){

        <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.borderLight}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><div style={{fontSize:13,fontWeight:700}}>Export Customers</div><div style={{fontSize:11,color:C.text3}}>{customers.length} customers · ข้อมูลลูกค้าและแมว</div></div>
          <button style={{...S.btnG,fontSize:12}} onClick={()=>{exportCustomersCSV(customers,bookings);setToast("✅ Customers exported!");}}>⬇ CSV</button>
        </div>
        <div style={{padding:"14px 16px",background:"#fff8f0",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700}}>🛡 Full Backup (JSON)</div>
            <div style={{fontSize:11,color:C.text3,lineHeight:1.6}}>
              สำรองครบทุกอย่าง <b>รวมรูปภาพ</b> — บัตรประชาชน รูปแมว สมุดวัคซีน
              <br/>ไฟล์ CSV/XLSX ไม่มีรูปภาพ กู้คืนไม่ได้
            </div>
          </div>
          <button disabled={backupBusy} style={{...S.btnB,fontSize:12,padding:"8px 14px",flexShrink:0,opacity:backupBusy?0.5:1}} onClick={async()=>{
            setBackupBusy(true);
            try{
              const sz=await exportFullBackupJSON(customers,bookings,(i,n)=>setToast(`⏳ กำลังรวบรวมรูป ${i}/${n}...`));
              setToast(`✅ Backup ${(sz/1048576).toFixed(1)} MB — เก็บไว้นอกเครื่องด้วย`);
            }catch(e){ setToast("❌ Backup ไม่สำเร็จ"); }
            setBackupBusy(false);
          }}>{backupBusy?"⏳ กำลังสำรอง...":"⬇ Backup"}</button>
        </div>
      </div>

      {/* ── Calendar Subscribe ── */}
      <div style={S.slabel}>📅 Calendar Sync</div>
      <div style={{...S.card,overflow:'hidden',marginBottom:16}}>
        <div style={{padding:'14px 16px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div>
              <div style={{fontSize:13,fontWeight:700}}>Subscribe Calendar (Live Sync)</div>
              <div style={{fontSize:11,color:C.text3}}>Calendar app จะ sync อัตโนมัติ — แจ้งเตือน 1 วันก่อน check-in</div>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button
                disabled={!icalUrl}
                style={{...S.btnB,fontSize:12,padding:'8px 14px',opacity:icalUrl?1:0.4,cursor:icalUrl?'pointer':'default'}}
                onClick={()=>{
                  if(!icalUrl) return;
                  navigator.clipboard.writeText(icalUrl)
                    .then(()=>setToast('✅ Copy URL แล้ว! นำไป Subscribe ใน Calendar'))
                    .catch(()=>setToast('❌ Copy ไม่ได้ — กด "แสดง" แล้ว copy เอง'));
                }}
              >📋 Copy URL</button>
              <button style={{...S.btnG,fontSize:12,padding:'8px 14px'}} onClick={()=>{setIcalDraft(icalUrl||"");setEditIcal(v=>!v);}}>
                {editIcal?'ยกเลิก':'⚙️ ตั้งค่า'}
              </button>
            </div>
          </div>

          {icalUrl?(
            <div style={{background:C.bg,borderRadius:8,padding:'8px 12px',fontSize:10,color:C.text3,fontFamily:'monospace',wordBreak:'break-all',lineHeight:1.5,display:'flex',alignItems:'center',gap:8}}>
              <span style={{flex:1}}>{showTok?icalUrl:maskedIcal}</span>
              <button style={{...S.btnG,fontSize:10,padding:'4px 8px',flexShrink:0,fontFamily:'inherit'}} onClick={()=>setShowTok(s=>!s)}>
                {showTok?'ซ่อน':'แสดง'}
              </button>
            </div>
          ):(
            <div style={{background:"#fff8f0",border:`1px solid ${C.orange}30`,borderRadius:8,padding:'10px 12px',fontSize:11,color:C.text2,lineHeight:1.7}}>
              <b style={{color:C.warnAmber}}>ยังไม่ได้ตั้งค่า URL ปฏิทิน</b><br/>
              กด <b>⚙️ ตั้งค่า</b> แล้ววาง URL ที่ได้จาก Cloudflare Worker
            </div>
          )}

          {editIcal&&(
            <div style={{marginTop:10,padding:'12px',background:C.bg,borderRadius:10,border:`1px solid ${C.border}`}}>
              <div style={S.lbl}>Calendar Feed URL</div>
              <input style={{...S.inp,fontFamily:'monospace',fontSize:11}} placeholder="https://....workers.dev/?token=..." value={icalDraft} onChange={e=>setIcalDraft(e.target.value)}/>
              <div style={{fontSize:10,color:C.text3,lineHeight:1.7,margin:'8px 0'}}>
                เก็บใน Firestore ไม่ได้อยู่ในไฟล์เว็บ — หมุน token ใหม่แล้ววางตรงนี้ได้เลย ไม่ต้องแก้โค้ด
              </div>
              <div style={{display:'flex',gap:6}}>
                <button style={{...S.btnP,flex:1,fontSize:12,padding:'10px'}} onClick={async()=>{
                  const v=icalDraft.trim();
                  if(v&&!/^https:\/\//.test(v)){ setToast('❌ ต้องขึ้นต้นด้วย https://'); return; }
                  try{ await onSaveIcalUrl(v); setEditIcal(false); setShowTok(false); setToast('✅ บันทึกแล้ว'); }
                  catch(e){ setToast('❌ บันทึกไม่สำเร็จ'); }
                }}>บันทึก</button>
                {icalUrl&&<button style={{...S.btnD,fontSize:12,padding:'10px 14px'}} onClick={async()=>{
                  if(!window.confirm('ลบ URL ปฏิทิน? ปุ่ม Copy จะใช้ไม่ได้จนกว่าจะตั้งใหม่')) return;
                  try{ await onSaveIcalUrl(""); setEditIcal(false); setToast('ลบแล้ว'); }catch(e){ setToast('❌ ลบไม่สำเร็จ'); }
                }}>ลบ</button>}
              </div>
            </div>
          )}

          <div style={{marginTop:10,fontSize:11,color:C.text3,lineHeight:1.7}}>
            <div style={{fontWeight:700,color:C.text2,marginBottom:4}}>วิธี Subscribe:</div>
            <div>🍎 Apple Calendar (iPhone/iPad): Settings → Calendar → Accounts → Add Account → Other → Add Subscribed Calendar → วาง URL</div>
            <div>🖥 Apple Calendar (Mac): File → New Calendar Subscription → วาง URL</div>
            <div>📆 Google Calendar: คลิก + ข้าง Other calendars → From URL → วาง URL</div>
          </div>
        </div>
      </div>


      {/* ── Pricing Periods ── */}
      <PricingPeriodsPanel pricingDoc={pricingDoc} onSavePricing={onSavePricing} setToast={setToast}/>

      {/* ── About ── */}
      <div style={S.slabel}>ℹ️ About</div>
      <div style={{...S.cardPad,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:800,color:C.accent,marginBottom:6}}>🐱 CATWALK Cat Hotel</div>
        <div style={{fontSize:12,color:C.text2,fontWeight:700,marginBottom:6}}>v 05 Aug 2026 · 11:15 (ICT)</div>
        <div style={{fontSize:11,color:C.orange,fontWeight:700,marginBottom:6}}>⚠️ STAGING — ทดสอบย้ายรูป ไม่ใช่แอปจริง</div>
        <div style={{fontSize:11,color:C.text3,marginBottom:8}}>16 rooms · Firebase Realtime Sync · Allow Past Dates · Room Change</div>
      </div>
    </div>
  </div>);
}

// ════════════════════════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════════════════════════
function App(){
  const getHashPage=()=>{const h=window.location.hash.replace("#","");return["rooms","bookings","customers","dashboard","settings"].includes(h)?h:"rooms";};
  const [page,setPage]=useState(getHashPage);
  const navTo=p=>{setPage(p);window.location.hash=p;};
  useEffect(()=>{
    const onHash=()=>setPage(getHashPage());
    window.addEventListener("hashchange",onHash);
    return()=>window.removeEventListener("hashchange",onHash);
  },[]);
  const [customers,setCustomers]=useState([]);
  const [bookings,setBookings]=useState([]);
  const [loading,setLoading]=useState(true);
  const [dbError,setDbError]=useState(null);
  const [pricingDoc,setPricingDoc]=useState(null);
  const [icalUrl,setIcalUrl]=useState("");
  const [toast,setToast]=useState("");
  const [sync,setSync]=useState("");
  const [receiptBooking,setReceiptBooking]=useState(null);
  const [receiptMode,setReceiptMode]=useState("receipt"); // "receipt" | "quote"
  const [receiptCounter,setReceiptCounter]=useState(()=>parseInt(localStorage.getItem("cw_receipt_counter")||"1"));
  const bumpReceipt=()=>{ const n=receiptCounter+1; setReceiptCounter(n); try{localStorage.setItem("cw_receipt_counter",String(n));}catch(e){} };

  // ── Auth gate ──────────────────────────────────────────────────────
  // "checking" | "signedout" | "checking_staff" | "authorized" | "denied" | "autherror"
  const [authState,setAuthState]=useState("checking");
  const [user,setUser]=useState(null);
  const [authErr,setAuthErr]=useState("");
  const [redirectBlocked,setRedirectBlocked]=useState(false);

  // Resolve a pending redirect first. If the sentinel survived the round trip
  // but no credential came back, the browser blocked the cross-site handoff —
  // that failure is otherwise completely silent.
  useEffect(()=>{
    let pending=false;
    try{ pending=!!sessionStorage.getItem(REDIRECT_FLAG); }catch(e){}
    auth.getRedirectResult()
      .then(res=>{
        if(pending&&!res.user&&!auth.currentUser) setRedirectBlocked(true);
        try{ sessionStorage.removeItem(REDIRECT_FLAG); }catch(e){}
      })
      .catch(e=>{
        setAuthErr(e.code||"auth/unknown");
        try{ sessionStorage.removeItem(REDIRECT_FLAG); }catch(e2){}
      });
  },[]);

  useEffect(()=>{
    return auth.onAuthStateChanged(async u=>{
      if(!u){ setUser(null); window.__cwUser=null; setAuthState("signedout"); return; }
      setUser(u);
      setAuthState("checking_staff");
      const em=(u.email||"").trim().toLowerCase();
      if(!em){ setAuthState("denied"); return; }
      window.__cwUser={email:em,name:u.displayName||"",uid:u.uid,photoURL:u.photoURL||""};
      try{
        const snap=await db.collection("staff").doc(em).get();
        // Rules currently permissive; once published, a non-staff read throws
        // permission-denied, which means the same thing as "no doc".
        setAuthState(snap.exists&&snap.data().active!==false?"authorized":"denied");
      }catch(e){
        if(e.code==="permission-denied"){ setAuthState("denied"); }
        else{ setAuthErr(e.code||"unknown"); setAuthState("autherror"); }
      }
    });
  },[]);

  // Load + realtime listeners — only after auth clears, otherwise every
  // listener fires against a signed-out session and trips permission-denied.
  useEffect(()=>{
    if(authState!=="authorized") return;
    setLoading(true); setDbError(null);
    // Timer starts here, not at mount: it must measure "Firestore responded
    // after I was authorized", not the sign-in handshake.
    // 30s, not 15s: the customers collection carries ~7.5MB of base64 images,
    // which on mobile data legitimately takes longer than 15s. The old value
    // was reporting a connection failure that had not actually happened.
    let loadTimeout=setTimeout(()=>{
      setLoading(false);
      setDbError("connection_timeout");
    },30000);

    const onErr=(label,err)=>{
      console.error(`Firestore ${label} error:`,err);
      // Signing out tears listeners down; don't flash an error on the way out.
      if(err.code==="permission-denied"&&!auth.currentUser) return true;
      if(err.code==="permission-denied"){ setAuthState("denied"); return true; }
      return false;
    };

    const unsubC=db.collection("customers").orderBy("createdAt","asc").onSnapshot(
      snap=>{
        clearTimeout(loadTimeout);
        setCustomers(snap.docs.map(d=>({id:d.id,...d.data()})));
        setLoading(false);
        setDbError(null);
      },
      err=>{
        clearTimeout(loadTimeout);
        setLoading(false);
        if(onErr("customers",err)) return;
        setDbError(err.code||"unknown");
      }
    );
    const unsubB=db.collection("bookings").orderBy("createdAt","asc").onSnapshot(
      snap=>{ setBookings(snap.docs.map(d=>({id:d.id,...d.data()}))); },
      err=>{ if(onErr("bookings",err)) return; setDbError(err.code||"unknown"); }
    );
    const unsubP=db.collection("settings").doc("pricing").onSnapshot(
      snap=>{ if(snap.exists){ const d=snap.data(); onPricingLoaded(d); setPricingDoc(d); } },
      err=>{ console.error("Firestore pricing error:",err); }
    );
    // Calendar feed URL lives in Firestore, not in this file — the token in it
    // must never be baked into a publicly served HTML file again.
    const unsubI=db.collection("settings").doc("ical").onSnapshot(
      snap=>{ setIcalUrl(snap.exists?(snap.data().url||""):""); },
      err=>{ console.error("Firestore ical error:",err); }
    );
    return()=>{ clearTimeout(loadTimeout); unsubC(); unsubB(); unsubP(); unsubI(); };
  },[authState]);

  const saving=async fn=>{setSync("saving");try{await fn();setSync("saved");setTimeout(()=>setSync(""),2000);}catch(e){setSync("error");setToast("❌ Save failed");setTimeout(()=>setSync(""),3000);}};

  const onImportCustomers=useCallback(async(newItems,silent)=>{
    await saving(async()=>{
      const batch=db.batch();
      newItems.forEach(item=>{ const{id,...rest}=item; batch.set(db.collection("customers").doc(id),rest); });
      await batch.commit();
      // ไม่ต้อง setCustomers เอง — onSnapshot จะอัพเดทให้อัตโนมัติ
      if(!silent) setToast(`✅ Import ${newItems.length} ลูกค้าสำเร็จ!`);
    });
  },[]);

  const onImportBookings=useCallback(async(newItems)=>{
    await saving(async()=>{
      const batch=db.batch();
      newItems.forEach(item=>{ const{id,...rest}=item; batch.set(db.collection("bookings").doc(id),rest); });
      await batch.commit();
      // ไม่ต้อง setBookings เอง — onSnapshot จะอัพเดทให้อัตโนมัติ
      setToast(`✅ Import ${newItems.length} booking สำเร็จ!`);
    });
  },[]);
  // Splits images into customers/{id}/media so the parent doc stays small.
  const onSaveCustomer=useCallback(async d=>saving(async()=>{await saveCustomerSplit(d);setToast("Saved ☁️");}),[]);
const onDeleteCustomer=useCallback(async id=>{
    const item=customers.find(c=>c.id===id);
    if(!item) return;
    if(!window.confirm(`ลบลูกค้า "${item.nickname||""}" ใช่ไหม?`)) return;
    await saving(async()=>fbDelete("customers",id));
    setToast("ลบแล้ว ✓");
  },[customers]);
  const onSaveBooking=useCallback(async d=>saving(async()=>{await fbSave("bookings",d.id,d);setToast("Saved ☁️");}),[]);
  const onDeleteBooking=useCallback(async id=>{
    const item=bookings.find(b=>b.id===id);
    if(!item) return;
    const cust=customers.find(c=>c.id===item.customerId);
    const label=cust?.nickname?`"${cust.nickname}" ${item.checkin}→${item.checkout}`:`booking ${item.checkin}`;
    if(!window.confirm(`ลบ ${label} ใช่ไหม?`)) return;
    await saving(async()=>fbDelete("bookings",id));
    setToast("ลบแล้ว ✓");
  },[bookings,customers]);

  if(authState==="checking"||authState==="checking_staff") return <SplashScreen sub="กำลังตรวจสอบสิทธิ์..."/>;
  if(authState==="signedout") return <LoginScreen redirectBlocked={redirectBlocked}/>;
  if(authState==="denied")    return <NotAuthorizedScreen user={user}/>;
  if(authState==="autherror") return <DbErrorScreen code={authErr} user={user}/>;

  if(loading)return <SplashScreen sub="กำลังโหลดข้อมูล..."/>;

  if(dbError)return <DbErrorScreen code={dbError} user={user}/>;

  const todayActive=bookings.filter(b=>b.checkin<=today()&&b.checkout>=today()).length;
  // Count occupied rooms today (a booking with 2 rooms counts as 2)
  const occupiedRoomsToday=bookings.filter(b=>b.checkin<=today()&&b.checkout>=today())
    .reduce((acc,b)=>{
      const rooms=(b.roomIds&&b.roomIds.length>0)?b.roomIds:[b.roomId].filter(Boolean);
      rooms.forEach(r=>acc.add(r));
      return acc;
    }, new Set()).size;

  return(<div style={S.app}>
    {sync&&<div style={{position:"fixed",top:0,left:0,right:0,height:3,zIndex:999,background:sync==="saving"?C.orange:sync==="saved"?C.green:C.red,transition:"background 0.3s"}}/>}

    {/* ── Main Content ── */}
    {page==="rooms"    &&<RoomsPage     bookings={bookings} customers={customers} setToast={setToast} onSaveBooking={onSaveBooking} onDeleteBooking={onDeleteBooking} onShowReceipt={(b,m)=>{setReceiptBooking(b);setReceiptMode(m);}}/>}
    {page==="bookings" &&<BookingsPage  bookings={bookings} customers={customers} onSaveBooking={onSaveBooking} onDeleteBooking={onDeleteBooking} onImportBookings={onImportBookings} onShowReceipt={(b,m)=>{setReceiptBooking(b);setReceiptMode(m);}}/>}
    {receiptBooking&&<ReceiptModal booking={receiptBooking} customers={customers} mode={receiptMode} receiptNum={receiptCounter} onClose={()=>{bumpReceipt();setReceiptBooking(null);}}/>}
    {page==="customers"&&<CustomersPage customers={customers} bookings={bookings} onSaveCustomer={onSaveCustomer} onDeleteCustomer={onDeleteCustomer} onSaveBooking={onSaveBooking} onImportCustomers={onImportCustomers} setToast={setToast}/>}
    {page==="dashboard"&&<DashboardPage bookings={bookings} customers={customers} onExportBookings={()=>{exportBookingsCSV(bookings,customers);setToast("CSV downloaded!");}}/>}
    {page==="settings" &&<SettingsPage  customers={customers} bookings={bookings} onImportCustomers={onImportCustomers} onImportBookings={onImportBookings} setToast={setToast} pricingDoc={pricingDoc} onSavePricing={async(doc)=>{await db.collection("settings").doc("pricing").set(doc);onPricingLoaded(doc);setPricingDoc(doc);}} icalUrl={icalUrl} onSaveIcalUrl={async(url)=>{await db.collection("settings").doc("ical").set({url,updatedAt:new Date().toISOString(),updatedBy:(window.__cwUser?.email||"")});}}/>}

    {/* ── Bottom Nav ── */}
    <div style={S.nav}>
      {[
        {id:"rooms",    icon:NAV_ICONS.rooms,     label:"Rooms",    badge:occupiedRoomsToday, badgeColor:C.accent},
        {id:"bookings", icon:NAV_ICONS.bookings,  label:"Bookings", badge:todayActive,         badgeColor:C.accent},
        {id:"customers",icon:NAV_ICONS.customers, label:"Customers",badge:0},
        {id:"dashboard",icon:NAV_ICONS.dashboard, label:"Dashboard",badge:0},
        {id:"settings", icon:NAV_ICONS.settings,  label:"Settings", badge:0},
      ].map(n=>(
        <a key={n.id} href={`#${n.id}`} onClick={e=>{e.preventDefault();navTo(n.id);}} style={{...S.navBtn(page===n.id),textDecoration:"none"}}>
          {page===n.id&&<div style={{position:"absolute",bottom:0,left:"20%",right:"20%",height:3,background:C.accent,borderRadius:"4px 4px 0 0"}}/>}
          <div style={{position:"relative",lineHeight:1}}>
            <img src={n.icon} style={{width:26,height:26,objectFit:"contain",opacity:page===n.id?1:0.4}} alt={n.label}/>
            {n.badge>0&&<span style={{position:"absolute",top:-4,right:-8,background:n.badgeColor||C.accent,color:"#fff",fontSize:9,fontWeight:800,width:17,height:17,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{n.badge}</span>}
          </div>
          <div style={{fontSize:12,fontWeight:page===n.id?800:600,letterSpacing:"0.01em",color:page===n.id?C.text:C.text3}}>{n.label}</div>
        </a>
      ))}
    </div>

    <Toast msg={toast} onHide={()=>setToast("")}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  // Relative path — the app is served from a subpath on GitHub Pages
  // (/catwalkhotel/), so "/sw.js" would resolve to the domain root and 404.
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW:",e)); });
}
</script>
