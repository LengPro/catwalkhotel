              const n2=getExtraNights(er);
              const erBase=calcExtraRoomBase(er);
              const erExtraInfo=(er.roomIds||[]).map(rid=>{const rc=getExtraCatsForRoom(er,rid);const ec=Math.max(0,rc-1);return ec>0?` +${ec}แมว(+฿${ec*EXTRA_CAT_FEE}/คืน)`:""}).join("");
              return (er.roomIds||[]).length>0&&n2>0?(
                <div key={er.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div>
                    <span style={{fontSize:11,color:C.purple,fontWeight:700,marginRight:6}}>🔄</span>
                    <span style={{fontSize:13,fontWeight:700,color:C.purple}}>{er.roomIds.join(", ")}</span>
                    <span style={{fontSize:11,color:C.text3,marginLeft:6}}>{n2}คืน · {fmt(er.checkin)}–{fmt(er.checkout)}{erExtraInfo}</span>
                  </div>
                  <span style={{fontSize:13,fontWeight:700,color:C.purple}}>฿{fmt2(erBase)}</span>
                </div>
              ):null;
            })}

            {/* ทรายแมว */}
            {form.litter&&totalLitterAmt>0&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:13,color:C.text2}}>🪣 ทรายแมว ({getLitterLabel(n,selectedRooms.length>0?selectedRooms.reduce((s,rid)=>s+getCatsForRoom(rid),0):numCats,pricingDate)})</span>
                <span style={{fontSize:13,fontWeight:600,color:C.blue}}>+฿{fmt2(totalLitterAmt)}</span>
              </div>
            )}

            {/* Pet Taxi */}
            {petTaxiAmt>0&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:13,color:C.text2}}>🚕 Pet Taxi{(form.petTaxiDay||"checkin")==="checkin"?" (วันรับ)":(form.petTaxiDay)==="checkout"?" (วันส่ง)":" (รับ+ส่ง)"}</span>
                <span style={{fontSize:13,fontWeight:600,color:C.text}}>+฿{fmt2(petTaxiAmt)}</span>
              </div>
            )}

            {/* ค่าใช้จ่ายอื่นๆ */}
            {extraFeeAmt>0&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:13,color:"#2e7d32"}}>➕ {form.extraFeeNote||"ค่าใช้จ่ายอื่นๆ"}</span>
                <span style={{fontSize:13,fontWeight:600,color:"#2e7d32"}}>+฿{fmt2(extraFeeAmt)}</span>
              </div>
            )}

            {/* ส่วนลด */}
            {discAmt>0&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:13,color:C.red}}>🏷 ส่วนลด {form.discount}% ({(form.discountItems||["rooms"]).map(k=>k==="rooms"?"ห้อง":k==="litter"?"ทราย":k==="taxi"?"Taxi":"อื่นๆ").join("+")})</span>
                <span style={{fontSize:13,fontWeight:600,color:C.red}}>-฿{fmt2(discAmt)}</span>
              </div>
            )}

            {/* ── ยอดรวม ── */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:`2px solid ${C.text}`,paddingTop:8,marginTop:4,marginBottom:depositAmt>0?8:0}}>
              <span style={{fontSize:15,fontWeight:800}}>ยอดรวมทั้งหมด</span>
              <span style={{fontSize:18,fontWeight:800,color:C.accent}}>฿{fmt2(net)}</span>
            </div>

            {/* มัดจำ */}
            {depositAmt>0&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 12px",background:"#fffbf0",borderRadius:8,border:"1px solid #ffd70040",marginBottom:6}}>
                <span style={{fontSize:15,color:C.orange,fontWeight:600}}>💰 มัดจำชำระแล้ว</span>
                <span style={{fontSize:15,fontWeight:700,color:C.orange}}>-฿{fmt2(depositAmt)}</span>
              </div>
            )}

            {/* ยังต้องชำระ / ครบแล้ว */}
            {remaining>0?(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#fff5f5",borderRadius:8,border:"1px solid #ff3b3020",marginBottom:isCreditCard?0:0}}>
                <span style={{fontSize:14,fontWeight:800,color:C.red}}>ยังต้องชำระ</span>
                <span style={{fontSize:16,fontWeight:800,color:C.red}}>฿{fmt2(remaining)}</span>
              </div>
            ):(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:C.greenBg,borderRadius:8,border:`1px solid ${C.green}40`}}>
                <span style={{fontSize:14,fontWeight:800,color:C.green}}>✅ ชำระครบแล้ว</span>
                <span style={{fontSize:16,fontWeight:800,color:C.green}}>✓</span>
              </div>
            )}

            {/* ── CC fee + Pet Taxi section (internal) ── */}
            {(depositCcFee>0||ccFeeAmt>0||petTaxiAmt>0)&&(
              <div style={{marginTop:10,padding:"10px 12px",background:"#fff8f0",borderRadius:8,border:"1px solid #ff950030"}}>
                <div style={{fontSize:12,fontWeight:700,color:C.text3,letterSpacing:"0.05em",marginBottom:8}}>รายได้ที่ร้านได้รับจริง (ภายใน)</div>
                {depositCcFee>0&&(
                  <div style={{marginBottom:ccFeeAmt>0?8:0,paddingBottom:ccFeeAmt>0?8:0,borderBottom:ccFeeAmt>0?`1px dashed ${C.border}`:"none"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{fontSize:12,color:C.text2}}>มัดจำ (Credit)</span>
                      <span style={{fontSize:12,fontWeight:600}}>฿{fmt2(depositAmt)}</span>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{fontSize:12,color:C.orange}}>หัก CC fee {CREDIT_CARD_FEE_PCT}%</span>
                      <span style={{fontSize:12,fontWeight:600,color:C.orange}}>-฿{fmt2(depositCcFee)}</span>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <span style={{fontSize:12,color:C.text2}}>รับจริงจากมัดจำ</span>
                      <span style={{fontSize:12,fontWeight:700,color:C.green}}>฿{fmt2(depositAmt-depositCcFee)}</span>
                    </div>
                  </div>
                )}
                {ccFeeAmt>0&&(
                  <div style={{marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{fontSize:12,color:C.text2}}>ยอดที่จ่ายบัตร</span>
                      <span style={{fontSize:12,fontWeight:600}}>฿{fmt2(remaining)}</span>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{fontSize:12,color:C.orange}}>หัก CC fee {CREDIT_CARD_FEE_PCT}%</span>
                      <span style={{fontSize:12,fontWeight:600,color:C.orange}}>-฿{fmt2(ccFeeAmt)}</span>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <span style={{fontSize:12,color:C.text2}}>รับจริงจากส่วนที่เหลือ</span>
                      <span style={{fontSize:12,fontWeight:700,color:C.green}}>฿{fmt2(remaining-ccFeeAmt)}</span>
                    </div>
                  </div>
                )}
                {petTaxiAmt>0&&(
                  <div style={{marginBottom:8,paddingBottom:8,borderBottom:`1px dashed ${C.border}`}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <span style={{fontSize:12,color:"#2563eb"}}>🚗 หัก Pet Taxi (ไม่รวมรายได้ร้าน)</span>
                      <span style={{fontSize:12,fontWeight:600,color:"#2563eb"}}>-฿{fmt2(petTaxiAmt)}</span>
                    </div>
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"space-between",paddingTop:6,borderTop:`2px solid ${C.border}`}}>
                  <span style={{fontSize:13,fontWeight:800}}>ร้านได้รับสุทธิ</span>
                  <span style={{fontSize:15,fontWeight:800,color:C.green}}>฿{fmt2(net-depositCcFee-ccFeeAmt-petTaxiAmt)}</span>
                </div>
              </div>
            )}
          </div>
        )}
        <button style={{...S.btnP,width:"100%",opacity:valid?1:0.4}} onClick={()=>valid&&onSave((()=>{
          const persistedRoomIds=selectedRooms.filter(rid=>rid!=="@LEGACY-L");
          return{
            ...form,
            id:booking?.id||uid(),
            createdAt:booking?.createdAt||new Date().toISOString(),
            updatedAt:new Date().toISOString(),
            net,base,discAmt,numCats,litterAmt,litterWeeks,petTaxiAmt,
            petTaxiDay:petTaxiAmt>0?(form.petTaxiDay||"checkin"):"",
            extraFeeAmt,extraFeeNote:form.extraFeeNote||"",depositAmt,depositPayMethod:form.depositPayMethod||"Transfer",depositCcFee,remaining,ccFeeAmt,
            roomId:persistedRoomIds[0]||"",
            roomIds:persistedRoomIds,
            extraRooms:(extraRooms||[]).map(er=>({...er,roomIds:(er.roomIds||[]).filter(Boolean)})).filter(er=>(er.roomIds||[]).length>0&&er.checkin&&er.checkout),
            // Extend checkout to cover all extraRoom periods
            checkout:(()=>{
              const validExtra=(extraRooms||[]).filter(er=>(er.roomIds||[]).length>0&&er.checkout);
              if(validExtra.length===0) return form.checkout;
              const allDates=[form.checkout,...validExtra.map(er=>er.checkout)];
              return allDates.reduce((latest,d)=>d>latest?d:latest, form.checkout);
            })(),
            homePriceTotal:form.size==="H"?homePriceLump:0,
            pricePerNight:form.size==="H"?0:getPriceForSize(form.size),
          };
        })())}>          {booking?"Save Changes":"Add Booking"}
        </button>
      </div>
    </div>
  </div>);
}

// CUSTOMER FORM
// ════════════════════════════════════════════════════════════════
function CustomerSheet({customer,onSave,onClose}){
  const [form,setForm]=useState(customer||{nickname:"",phone:"",line:"",address:"",idCard:"",notes:"",cats:[newCat()]});
  // Images live in a subcollection. They must be pulled into the form before
  // the user can save, otherwise saveCustomerSplit would read an absent image
  // as "the user deleted it" and wipe the media docs.
  const [mediaReady,setMediaReady]=useState(!customer);
  useEffect(()=>{
    if(!customer) return;
    let alive=true;
    loadCustomerMedia(customer.id).then(m=>{
      if(!alive) return;
      setForm(f=>({
        ...f,
        idCard:getIdCard(f,m),
        cats:(f.cats||[]).map(cat=>({
          ...cat,
          photo:getCatPhoto(cat,m),
          vaccinePassport:getVaccine(cat,m),
        })),
      }));
      setMediaReady(true);
    }).catch(()=>{ if(alive) setMediaReady(true); }); // fall back to inline fields
    return()=>{alive=false;};
  },[customer?.id]);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setCat=(i,u)=>setForm(f=>{const cats=[...f.cats];cats[i]=u;return{...f,cats};});
  const valid=mediaReady&&form.nickname.trim()&&form.cats.some(c=>c.name.trim());
  return(<div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={S.sheet}>
      <div style={S.sheetHandle}/>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div style={S.sheetTitle}>{customer?"Edit Customer":"New Customer"}</div>
        <button style={S.btnG} onClick={onClose}>Cancel</button>
      </div>
      {!mediaReady&&<div style={{padding:"0 16px 12px",fontSize:12,color:C.text3}}>⏳ กำลังโหลดรูปภาพ...</div>}
      <div style={{padding:"0 16px"}}>
        <div style={{background:C.blueBg,borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,fontWeight:700,color:C.blue}}>👤 OWNER INFORMATION</div>
        <div style={S.fg}><div style={S.lbl}>Name *</div><input style={S.inp} placeholder="e.g. Khun Nong" value={form.nickname} onChange={e=>set("nickname",e.target.value)}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={S.fg}><div style={S.lbl}>Phone</div><input style={S.inp} type="tel" inputMode="numeric" pattern="[0-9]*" placeholder="0812345678" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
          <div style={S.fg}><div style={S.lbl}>Other Contacts</div><input style={S.inp} placeholder="Line, IG, Facebook, etc." value={form.line} onChange={e=>set("line",e.target.value)}/></div>
        </div>
        <div style={S.fg}><div style={S.lbl}>Address</div><textarea style={S.ta} rows={2} value={form.address} onChange={e=>set("address",e.target.value)} placeholder="Address..."/></div>
        <div style={S.fg}><div style={S.lbl}>Owner ID Card</div><FileUpload value={form.idCard} onChange={v=>set("idCard",v)} label="ID Card" icon="🪪"/></div>
        <div style={S.fg}><div style={S.lbl}>Customer Notes</div><textarea style={S.ta} rows={2} value={form.notes||""} onChange={e=>set("notes",e.target.value)} placeholder="เช่น แพ้อาหาร, วิธีดูแลพิเศษ, เบอร์ติดต่อฉุกเฉิน..."/></div>
        <div style={{background:C.accentBg,borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,fontWeight:700,color:C.accent}}>
          🐱 CATS — {form.cats.length} cat{form.cats.length>1?"s":""}{form.cats.length>1?` · +฿${(form.cats.length-1)*EXTRA_CAT_FEE}/night extra`:""}
        </div>
        {form.cats.map((cat,i)=><CatEditor key={cat.id} cat={cat} index={i} total={form.cats.length} onChange={v=>setCat(i,v)} onRemove={()=>setForm(f=>({...f,cats:f.cats.filter((_,idx)=>idx!==i)}))}/>)}
        <button style={{...S.btnG,width:"100%",marginBottom:16,borderStyle:"dashed"}} onClick={()=>setForm(f=>({...f,cats:[...f.cats,newCat()]}))}>+ Add Another Cat (+฿{EXTRA_CAT_FEE}/night per extra)</button>
        <button style={{...S.btnP,width:"100%",marginBottom:8,opacity:valid?1:0.4}} onClick={()=>valid&&onSave({...form,id:customer?.id||uid(),createdAt:customer?.createdAt||new Date().toISOString()})}>
          {customer?"Save Changes":"Add Customer"}
        </button>
      </div>
    </div>
  </div>);
}

// ════════════════════════════════════════════════════════════════
// CUSTOMER DETAIL
// ════════════════════════════════════════════════════════════════
function CustomerDetail({customer,bookings,onEdit,onDelete,onClose,onNewBooking}){
  const [viewer,setViewer]=useState(null);
  const [media,setMedia]=useState(null);
  // Full-resolution images are fetched only when a customer is actually
  // opened — that is the whole point of the subcollection.
  useEffect(()=>{
    let alive=true;
    setMedia(null);
    loadCustomerMedia(customer.id).then(m=>{ if(alive) setMedia(m); }).catch(()=>{});
    return()=>{alive=false;};
  },[customer.id]);
  const [bFilter,setBFilter]=useState("upcoming");
  const todayDate=today();
  const allCb=bookings.filter(b=>b.customerId===customer.id);
  const totalSpent=allCb.reduce((a,b)=>a+(b.net||0),0);
  const cats=customer.cats||[];

  // Apply filter
  let cb=[...allCb];
  if(bFilter==="upcoming"){
    cb=cb.filter(b=>b.checkout>=todayDate).sort((a,b)=>a.checkin.localeCompare(b.checkin));
  } else if(bFilter==="high"){
    cb=cb.sort((a,b)=>(b.net||0)-(a.net||0));
  } else if(bFilter==="low"){
    cb=cb.sort((a,b)=>(a.net||0)-(b.net||0));
  } else if(bFilter&&bFilter.startsWith("year-")){
    const yr=bFilter.replace("year-","");
    cb=cb.filter(b=>b.checkin.startsWith(yr)).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  } else if(bFilter&&bFilter.startsWith("month-")){
    const mo=bFilter.replace("month-","");
    cb=cb.filter(b=>b.checkin.slice(0,7)===mo).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  } else if(bFilter==="cat1"){
    cb=cb.filter(b=>(b.selectedCatIds||[]).length===1).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  } else if(bFilter==="cat2"){
    cb=cb.filter(b=>(b.selectedCatIds||[]).length===2).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  } else if(bFilter==="cat3"){
    cb=cb.filter(b=>(b.selectedCatIds||[]).length===3).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  } else if(bFilter==="cat4"){
    cb=cb.filter(b=>(b.selectedCatIds||[]).length>=4).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  } else {
    cb=cb.sort((a,b)=>b.checkin.localeCompare(a.checkin));
  }

  // Build year/month options from allCb
  const years=[...new Set(allCb.map(b=>b.checkin.slice(0,4)))].sort((a,b)=>b-a);
  const months=[...new Set(allCb.map(b=>b.checkin.slice(0,7)))].sort((a,b)=>b.localeCompare(a));

  return(<div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={S.sheet}>
      <div style={S.sheetHandle}/>
      <div style={{padding:"16px 20px 0"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
          <div>
            <div style={{fontSize:20,fontWeight:800,letterSpacing:"-0.01em"}}>
              {customer.nickname} <span style={{fontSize:16,fontWeight:600,color:C.text2}}>({(customer.cats||[]).map(c=>c.name).filter(Boolean).join(", ")||"—"})</span>
            </div>
          </div>
          <button style={S.btnG} onClick={onClose}>✕</button>
        </div>
        <div style={{background:C.bg,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
          {customer.phone&&<div style={{fontSize:13,color:C.text2,marginBottom:3}}>📞 {customer.phone}</div>}
          {customer.line&&<div style={{fontSize:13,color:C.text2,marginBottom:3}}>📱 {customer.line}</div>}
          {customer.address&&<div style={{fontSize:13,color:C.text2,marginBottom:3}}>📍 {customer.address}</div>}
          {customer.notes&&<div style={{fontSize:13,color:C.text2,fontStyle:"italic"}}>📝 <NotesText text={customer.notes}/></div>}
        </div>
        {hasIdCard(customer)&&(()=>{
          const src=getIdCard(customer,media);
          return(<div style={{marginBottom:12}}><div style={S.slabel}>ID Card</div>
            <div style={{border:`1px solid ${C.green}40`,background:C.greenBg,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,cursor:src?"pointer":"default",opacity:src?1:0.6}}
              onClick={()=>src&&setViewer({src,title:"Owner ID Card"})}>
              <span style={{fontSize:20}}>🪪</span>
              <div style={{flex:1,fontSize:13,fontWeight:600,color:C.green}}>ID Card on file</div>
              <span style={{fontSize:11,color:C.text3}}>{src?"Tap to view":"กำลังโหลด..."}</span>
            </div></div>);
        })()}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          <div style={S.statCard}><div style={{...S.statVal,fontSize:22,color:C.accent}}>{cb.length}</div><div style={S.statLbl}>Bookings</div></div>
          <div style={S.statCard}><div style={{...S.statVal,fontSize:22,color:C.blue}}>฿{totalSpent.toLocaleString()}</div><div style={S.statLbl}>Total Spent</div></div>
        </div>
        <div style={S.slabel}>Cats ({cats.length})</div>
        {cats.map((cat,i)=>(<div key={cat.id} style={{...S.cardPad,marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
            <div style={{width:52,height:52,borderRadius:12,overflow:"hidden",flexShrink:0,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>
              {(getCatPhoto(cat,media)||getCatThumb(cat))?<img src={getCatPhoto(cat,media)||getCatThumb(cat)} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
            </div>
            <div style={{flex:1}}><div style={{fontSize:15,fontWeight:800}}>{cat.name}</div><div style={{fontSize:12,color:C.text3}}>{cat.breed||"Cat"}</div>{cat.notes&&<div style={{fontSize:12,color:C.text2,marginTop:2,fontStyle:"italic"}}>{cat.notes}</div>}</div>
            {i>0&&<span style={S.chip(C.orange)}>+฿{EXTRA_CAT_FEE}/night</span>}
          </div>
          <VaccinePassportList cat={cat} media={media} onView={(src,title)=>setViewer({src,title})}/>
        </div>))}
        <div style={{display:"flex",gap:8,marginTop:8,marginBottom:14}}>
          <button style={{...S.btnP,flex:1}} onClick={onNewBooking}>+ New Booking</button>
          <button style={S.btnG} onClick={onEdit}>Edit</button>
          <button style={S.btnD} onClick={onDelete}>Delete</button>
        </div>
        {allCb.length>0&&(<>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <div style={S.slabel}>Booking History ({cb.length}/{allCb.length})</div>
          </div>
          {/* Filter bar */}
          <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:4,WebkitOverflowScrolling:"touch"}}>
            {[
              {key:"upcoming",label:"📅 Upcoming"},
              {key:"all",label:"All"},
              {key:"high",label:"฿ High→Low"},
              {key:"low",label:"฿ Low→High"},
              ...years.map(y=>({key:"year-"+y,label:y})),
              ...months.map(m=>({key:"month-"+m,label:m.slice(0,7)})),
              {key:"cat1",label:"1 🐱"},
              {key:"cat2",label:"2 🐱"},
              {key:"cat3",label:"3 🐱"},
              {key:"cat4",label:"4+ 🐱"},
            ].map(f=>(
              <button key={f.key} onClick={()=>setBFilter(f.key)} style={{flexShrink:0,padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,border:"none",cursor:"pointer",background:bFilter===f.key?C.accent:C.bg,color:bFilter===f.key?"#fff":C.text2,whiteSpace:"nowrap"}}>
                {f.label}
              </button>
            ))}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return[];
  const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim().toLowerCase());
  return lines.slice(1).map(line=>{
    // handle quoted fields with commas inside
    const fields=[]; let cur=""; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ inQ=!inQ; }
      else if(ch===","&&!inQ){ fields.push(cur.trim()); cur=""; }
      else{ cur+=ch; }
    }
    fields.push(cur.trim());
    const row={};
    headers.forEach((h,i)=>{ row[h]=(fields[i]||"").replace(/^"|"$/g,"").trim(); });
    return row;
  }).filter(r=>Object.values(r).some(v=>v));
}

function importCustomersFromCSV(rows, existingCustomers){
  const results={imported:0, skipped:0, errors:[]};
  const newCustomers=[];
  rows.forEach((r,i)=>{
    const nickname=(r["name"]||r["nickname"]||r["ชื่อ"]||r["ชื่อเล่น"]||"").trim();
    const phone=(r["phone"]||r["เบอร์โทร"]||r["tel"]||r["mobile"]||"").trim();
    if(!nickname){ results.errors.push(`Row ${i+2}: No name`); results.skipped++; return; }
    // Check duplicate
    const dup=existingCustomers.find(c=>c.nickname.toLowerCase()===nickname.toLowerCase()&&(!phone||c.phone===phone));
    if(dup){ results.skipped++; return; }
    // Parse cats — Cat1 Name, Cat1 Breed ... Cat3
    const cats=[];
    for(let ci=1;ci<=5;ci++){
      const catName=(r[`cat${ci} name`]||r[`cat${ci}name`]||r[`cat${ci}_name`]||r[`cat ${ci} name`]||"").trim();
      const catBreed=(r[`cat${ci} breed`]||r[`cat${ci}breed`]||r[`cat${ci}_breed`]||r[`cat ${ci} breed`]||"").trim();
      const catNotes=(r[`cat${ci} notes`]||r[`cat${ci}notes`]||"").trim();
      if(catName) cats.push({id:uid(),name:catName,breed:catBreed,notes:catNotes,photo:"",vaccinePassport:[]});
    }
    // Also handle single "cat name" column
    if(cats.length===0){
      const singleCat=(r["cat name"]||r["cat"]||r["ชื่อแมว"]||"").trim();
      const singleBreed=(r["breed"]||r["สายพันธุ์"]||"").trim();
      if(singleCat) cats.push({id:uid(),name:singleCat,breed:singleBreed,notes:"",photo:"",vaccinePassport:[]});
    }
    newCustomers.push({
      id:uid(),
      nickname,
      phone,
      line:(r["other contacts"]||r["line id"]||r["line"]||r["line_id"]||r["contact"]||"").trim(),
      address:(r["address"]||r["ที่อยู่"]||"").trim(),
      notes:(r["notes"]||r["หมายเหตุ"]||"").trim(),
      cats:cats.length>0?cats:[{id:uid(),name:"",breed:"",notes:"",photo:"",vaccinePassport:[]}],
      idCard:"",
      createdAt:new Date().toISOString(),
    });
    results.imported++;
  });
  return{newCustomers,results};
}

function importBookingsFromCSV(rows, customers){
  const results={imported:0,skipped:0,errors:[]};
  const newBookings=[];
  rows.forEach((r,i)=>{
    const nick=(r["customer nickname"]||r["nickname"]||r["customer"]||"").trim();
    const checkin=(r["check-in (yyyy-mm-dd)"]||r["check-in"]||r["checkin"]||r["check in"]||"").trim();
    const checkout=(r["check-out (yyyy-mm-dd)"]||r["check-out"]||r["checkout"]||r["check out"]||"").trim();
    const roomId=(r["room id"]||r["room"]||r["roomid"]||"").trim().toUpperCase();
    if(!nick||!checkin||!checkout){ results.errors.push(`Row ${i+2}: Missing nickname/dates`); results.skipped++; return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(checkin)||!/^\d{4}-\d{2}-\d{2}$/.test(checkout)){ results.errors.push(`Row ${i+2}: Date format must be YYYY-MM-DD`); results.skipped++; return; }
    const cust=customers.find(c=>c.nickname.toLowerCase()===nick.toLowerCase());
    if(!cust){ results.errors.push(`Row ${i+2}: Customer "${nick}" not found — add them first`); results.skipped++; return; }
    const rawSize=(r["room size (s/m/l)"]||r["room size (s/m)"]||r["size"]||r["room size"]||"S").trim().toUpperCase();
    const size=["S","M","L","H"].includes(rawSize)?rawSize:"S";
    const validRoom=ROOMS.find(rm=>rm.id===roomId);
    const discount=parseFloat(r["discount %"]||r["discount"]||"0")||0;
    const depositAmt=parseFloat(r["deposit"]||"0")||0;
    const payMethod=r["payment method"]||r["payment"]||"Cash";
    const paid=(r["paid (yes/no)"]||r["paid"]||"").toLowerCase()==="yes";
    const litter=(r["cat litter (yes/no)"]||r["cat litter"]||r["litter"]||"").toLowerCase()==="yes";
    const extraFeeAmt=parseFloat(r["extra fee"]||r["extrafee"]||"0")||0;
    const extraFeeNote=(r["extra fee note"]||r["extrafeenote"]||"").trim();
    const notes=(r["notes"]||r["หมายเหตุ"]||"").trim();
    const n=nights(checkin,checkout);
    const selectedCatIds=(cust.cats||[]).filter(c=>c.name).map(c=>c.id);
    // Parse specific cat names if provided
    const catNamesStr=(r["cat names (comma separated)"]||r["cat names"]||"").trim();
    let selCatIds=selectedCatIds;
    if(catNamesStr){
      const catNames=catNamesStr.split(",").map(x=>x.trim().toLowerCase());
      const matched=(cust.cats||[]).filter(c=>catNames.includes(c.name.toLowerCase())).map(c=>c.id);
      if(matched.length>0) selCatIds=matched;
    }
    const numCats=selCatIds.length||1;
    const{base,discAmt,net,litterAmt,litterWeeks,pricePerNight}=calcPrice(n,size,numCats,discount,litter,checkin);
    const remaining=Math.max(0,net-depositAmt);
    newBookings.push({
      id:uid(), customerId:cust.id, selectedCatIds:selCatIds,
      checkin, checkout, size, roomId:validRoom?roomId:"",
      discount:String(discount), payMethod, paid, litter, notes,
      base, discAmt, net, litterAmt, litterWeeks,
      pricePerNight, extraFeeAmt, extraFeeNote,
      depositAmt, remaining,
      numCats, createdAt:new Date().toISOString(),
    });
    results.imported++;
  });
  return{newBookings,results};
}

function ImportSheet({mode, customers, onImportCustomers, onImportBookings, onClose}){
  const [step,setStep]=useState("upload"); // upload | preview | done
  const [rows,setRows]=useState([]);
  const [preview,setPreview]=useState(null); // {newItems, results}
  const [error,setError]=useState("");
  const fileRef=useRef();

  const handleFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=parseCSV(ev.target.result);
        if(!parsed.length){setError("ไม่พบข้อมูลในไฟล์ หรือ format ไม่ถูกต้อง"); return;}
        setRows(parsed); setError("");
        if(mode==="customers"){
          const{newCustomers,results}=importCustomersFromCSV(parsed,customers);
          setPreview({items:newCustomers,results});
        } else {
          const{newBookings,results}=importBookingsFromCSV(parsed,customers);
          setPreview({items:newBookings,results});
        }
        setStep("preview");
      }catch(err){setError("ไม่สามารถอ่านไฟล์ได้: "+err.message);}
    };
    reader.readAsText(f,"UTF-8");
  };

  const handleConfirm=async()=>{
    if(!preview) return;
    if(mode==="customers") await onImportCustomers(preview.items);
    else await onImportBookings(preview.items);
    setStep("done");
  };

  const isCustomer=mode==="customers";

  return(<div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={S.sheet}>
      <div style={S.sheetHandle}/>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div style={S.sheetTitle}>📥 Import {isCustomer?"Customers":"Bookings"}</div>

            const steps=["upload","preview","done"];
            const curIdx=steps.indexOf(step);
            return(
              <div key={s} style={{display:"flex",flex:i<2?"1 1 auto":"0 0 auto",alignItems:"center",gap:4}}>
                <div style={{width:24,height:24,borderRadius:"50%",background:step===s?C.accent:curIdx>i?C.green:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:curIdx>=i?"#fff":C.text3,flexShrink:0}}>

              <div style={{maxHeight:280,overflowY:"auto",marginBottom:16}}>
                {preview.items.slice(0,20).map((item,i)=>(
                  <div key={i} style={{...S.card,padding:"11px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:28,height:28,borderRadius:8,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>
                      {isCustomer?"🐱":"📋"}
                    </div>
                    {isCustomer?(
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700}}>{item.nickname}</div>
                        <div style={{fontSize:11,color:C.text2}}>{item.phone||"—"} · {(item.cats||[]).map(c=>c.name).filter(Boolean).join(", ")||"No cat"}</div>
                      </div>
                    ):(
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700}}>{customers.find(c=>c.id===item.customerId)?.nickname||"?"} → {item.roomId||item.size}</div>
                        <div style={{fontSize:11,color:C.text2}}>{item.checkin} → {item.checkout} · ฿{(item.net||0).toLocaleString()}</div>
                      </div>
                    )}
                    <span style={S.chip(C.green)}>New</span>
                  </div>
                ))}
                {preview.items.length>20&&<div style={{textAlign:"center",fontSize:12,color:C.text3,padding:"8px"}}>...และอีก {preview.items.length-20} รายการ</div>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button style={{...S.btnG,flex:1}} onClick={()=>setStep("upload")}>← กลับ</button>
                <button style={{...S.btnP,flex:2}} onClick={handleConfirm}>
                  ✅ Import {preview.items.length} รายการ
                </button>
              </div>
            </>
          ):(
            <div style={{textAlign:"center",padding:"20px",color:C.text3}}>
              <div style={{fontSize:28,marginBottom:8}}>😕</div>
              <div style={{fontSize:13}}>ไม่มีข้อมูลใหม่ที่จะ import</div>
              <button style={{...S.btnG,marginTop:12}} onClick={()=>setStep("upload")}>← ลองใหม่</button>
            </div>
          )}
        </>)}

        {/* STEP 3: Done */}
        {step==="done"&&(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:52,marginBottom:12}}>🎉</div>
            <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Import สำเร็จ!</div>
            <div style={{fontSize:14,color:C.text2,marginBottom:20}}>
              เพิ่ม {preview?.items.length||0} {isCustomer?"ลูกค้า":"booking"} เข้าระบบแล้ว
            </div>
            <button style={{...S.btnP,width:"100%"}} onClick={onClose}>เสร็จสิ้น ✓</button>
          </div>
        )}
      </div>
    </div>
  </div>);
}

// CUSTOMERS PAGE
// ════════════════════════════════════════════════════════════════
function CustomersPage({customers,bookings,onSaveCustomer,onDeleteCustomer,onSaveBooking,onImportCustomers,setToast}){
  const [search,setSearch]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [editCust,setEditCust]=useState(null);
  const [detailCust,setDetailCust]=useState(null);
  const [bookingFor,setBookingFor]=useState(null);
  const [filter,setFilter]=useState("upcoming");
  const [selectMode,setSelectMode]=useState(false);
  const [selected,setSelected]=useState([]);
  const now=today();
  const customerNights=useMemo(()=>{
    const m=new Map();
    for(const b of bookings) m.set(b.customerId,(m.get(b.customerId)||0)+nights(b.checkin,b.checkout));
    return m;
  },[bookings]);
  const byFilter=customers.filter(c=>{
    const cb=bookings.filter(b=>b.customerId===c.id);
    const catCount=(c.cats||[]).length;
    if(filter==="upcoming") return true;
    if(filter==="1cat") return catCount===1;
    if(filter==="2cat") return catCount===2;
    if(filter==="3cat") return catCount===3;
    if(filter==="4cat") return catCount>=4;
    return true; // "all" / high-to-low handled in sort
  });
  const filtered=byFilter.filter(c=>c.nickname.toLowerCase().includes(search.toLowerCase())||(c.cats||[]).some(cat=>cat.name.toLowerCase().includes(search.toLowerCase()))||(c.phone||"").includes(search))
    .sort((a,b)=>{
      if(filter==="highlow") return (customerNights.get(b.id)||0)-(customerNights.get(a.id)||0);
      return 0;
    });

  const toggleSelect=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const toggleSelectAll=()=>setSelected(s=>s.length===filtered.length?[]:filtered.map(c=>c.id));
  const exitSelect=()=>{setSelectMode(false);setSelected([]);};
  const bulkDelete=async()=>{
    
    for(const id of selected) await onDeleteCustomer(id);
    exitSelect();
  };

  return(<div>
    <div style={S.header}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={S.htitle}>Customers</div><div style={S.hSub}>{customers.length} registered · {customers.reduce((a,c)=>a+(c.cats||[]).length,0)} cats</div></div>
        <div style={{display:"flex",gap:6}}>
          {!selectMode?(
            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={()=>setSelectMode(true)}>☑ Select</button>
              <button style={S.btnP} onClick={()=>setShowForm(true)}>+ Add</button>
            </>
          ):(
            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={toggleSelectAll}>
                {selected.length===filtered.length?"✕ Clear All":"✓ All"}
              </button>
              {selected.length>0&&<button style={{...S.btnD,padding:"8px 12px",fontSize:12}} onClick={bulkDelete}>🗑 Delete {selected.length}</button>}
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={exitSelect}>Cancel</button>
            </>
          )}
        </div>
      </div>
      <div style={{...S.tabs,marginTop:12}}>{[["upcoming","Upcoming"],["highlow","High→Low"],["1cat","1 Cat"],["2cat","2 Cats"],["3cat","3 Cats"],["4cat","4+ Cats"]].map(([v,l])=><button key={v} style={S.tab(filter===v)} onClick={()=>{setFilter(v);exitSelect();}}>{l}</button>)}</div>
      <div style={{position:"relative",marginTop:12}}>
        <input style={{...S.inp,minHeight:52,padding:"14px 16px",paddingRight:search?40:16,borderRadius:14,fontSize:15}} placeholder="🔍  Search name, cat name, phone..." value={search} onChange={e=>{setSearch(e.target.value);exitSelect();}}/>
        {search&&<button onClick={()=>{setSearch("");exitSelect();}} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"#e0e0e0",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontFamily:"inherit",fontSize:12,color:"#555",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>✕</button>}
      </div>
    </div>
    <div style={{...S.sec,marginTop:0}}><div style={{marginTop:16}}>
      {filtered.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:C.text3}}><div style={{fontSize:32,marginBottom:8}}>🐱</div>No customers found</div>
        :filtered.map(c=>{
          const cats=c.cats||[]; const cb=bookings.filter(b=>b.customerId===c.id); const last=cb.sort((a,b)=>b.checkin.localeCompare(a.checkin))[0];
          const isSel=selected.includes(c.id);
          return(<div key={c.id} style={{...S.card,marginBottom:10,minHeight:150,cursor:"pointer",outline:isSel?`2px solid ${C.accent}`:"none",background:isSel?C.accentBg:C.white}} onClick={selectMode?()=>toggleSelect(c.id):()=>setDetailCust(c)}>
            <div style={{padding:"22px 16px"}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:cats.length>1?16:0}}>
                {selectMode&&(
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${isSel?C.accent:C.border}`,background:isSel?C.accent:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {isSel&&<span style={{color:"#fff",fontSize:13,fontWeight:800}}>✓</span>}
                  </div>
                )}
                <div style={{display:"flex",position:"relative",flexShrink:0}}>
                  {cats.slice(0,3).map((cat,i)=>(
                    <div key={cat.id} style={{width:40,height:40,borderRadius:10,marginLeft:i>0?-12:0,border:`2px solid ${C.white}`,zIndex:cats.length-i,overflow:"hidden",flexShrink:0,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                      {getCatThumb(cat)?<img src={getCatThumb(cat)} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                    </div>
                  ))}
                </div>
                <div style={{flex:1,minWidth:0,paddingTop:1}}>
                  <div style={{fontSize:13,lineHeight:"20px",fontWeight:700,color:C.text}}>{c.nickname} <span style={{fontSize:13,lineHeight:"20px",fontWeight:600,color:C.text2}}>({cats.map(x=>x.name).join(", ")||"—"})</span></div>
                  <div style={{fontSize:13,color:C.text2}}>{c.phone||""}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0,paddingTop:1}}><div style={{fontSize:13,lineHeight:"20px",fontWeight:600,color:C.accent}}>{cb.length} booking{cb.length!==1?"s":""}</div>{last&&<div style={{fontSize:11,color:C.text3}}>{fmt(last.checkin)}</div>}</div>
              </div>
              {cats.length>1&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:6}}>{cats.map((cat,i)=><span key={cat.id} style={{...S.chip(i===0?C.text2:C.orange),fontSize:13}}>{cat.name}{i>0?" +฿50":""}</span>)}</div>}
            </div>
          </div>);
        })
      }
    </div></div>
    {(showForm||editCust)&&<CustomerSheet customer={editCust} onSave={async d=>{await onSaveCustomer(d);setShowForm(false);setEditCust(null);if(detailCust)setDetailCust(d);}} onClose={()=>{setShowForm(false);setEditCust(null);}}/>}
    {detailCust&&<CustomerDetail customer={detailCust} bookings={bookings} onEdit={()=>{setEditCust(detailCust);setDetailCust(null);}} onDelete={async()=>{await onDeleteCustomer(detailCust.id);setDetailCust(null);}} onClose={()=>setDetailCust(null)} onNewBooking={()=>{setBookingFor(detailCust);setDetailCust(null);}}/>}
    {bookingFor&&<BookingSheet customers={customers} bookings={bookings} booking={{customerId:bookingFor.id,selectedCatIds:(bookingFor.cats||[]).slice(0,1).map(x=>x.id),checkin:"",checkout:"",size:"S",roomId:"",discount:"0",payMethod:"Cash",paid:false,notes:""}} onSave={async d=>{await onSaveBooking(d);setBookingFor(null);}} onClose={()=>setBookingFor(null)}/>}
  </div>);
}

// BOOKINGS PAGE
// ════════════════════════════════════════════════════════════════
function BookingsPage({bookings,customers,onSaveBooking,onDeleteBooking,onImportBookings,onShowReceipt}){
  const [showForm,setShowForm]=useState(false);
  const [editBook,setEditBook]=useState(null);
  const [filter,setFilter]=useState("upcoming");
  const [search,setSearch]=useState("");
  const [selectMode,setSelectMode]=useState(false);
  const [selected,setSelected]=useState([]);
  const now=today();

  const getEffectiveCheckout=b=>{
    const extras=(b.extraRooms||[]).filter(er=>(er.roomIds||[]).length>0&&er.checkout);
    if(extras.length===0) return b.checkout;
    return [b.checkout,...extras.map(er=>er.checkout)].reduce((a,d)=>d>a?d:a,b.checkout);
  };
  const byFilter=bookings.filter(b=>{
    const ec=getEffectiveCheckout(b);
    return filter==="upcoming"?ec>=now:filter==="past"?ec<now:true;
  });
  const filtered=byFilter.filter(b=>{
    if(!search.trim()) return true;
    const s=search.toLowerCase().trim();
    const cust=customers.find(c=>c.id===b.customerId);
    const cats=(cust?.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
    const catNames=cats.map(c=>c.name).join(" ").toLowerCase();
    const nickname=(cust?.nickname||"").toLowerCase();
    const phone=(cust?.phone||"").toLowerCase();
    const room=(b.roomIds||[b.roomId]).filter(Boolean).join(" ").toLowerCase();
    // Date search — support multiple formats
    const checkinFmt=b.checkin?fmt(b.checkin).toLowerCase():""; // "1 Mar 2026"
    const checkoutFmt=b.checkout?fmt(b.checkout).toLowerCase():"";
    const checkinRaw=b.checkin||""; // "2026-03-01"
    const checkoutRaw=b.checkout||"";
    // Month name search (mar, april, etc.)
    const MONTH_MAP={jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12",january:"01",february:"02",march:"03",april:"04",june:"06",july:"07",august:"08",september:"09",october:"10",november:"11",december:"12"};
    let matchDate=checkinFmt.includes(s)||checkoutFmt.includes(s)||checkinRaw.includes(s)||checkoutRaw.includes(s);
    // Try month name matching
    for(const [mname,mnum] of Object.entries(MONTH_MAP)){
      if(s.includes(mname)){
        if(checkinRaw.includes("-"+mnum+"-")||checkoutRaw.includes("-"+mnum+"-")) matchDate=true;
      }
    }
    return nickname.includes(s)||catNames.includes(s)||room.includes(s)||phone.includes(s)||matchDate;
  }).sort((a,b)=>a.checkin.localeCompare(b.checkin));

  const toggleSelect=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const toggleSelectAll=()=>setSelected(s=>s.length===filtered.length?[]:filtered.map(b=>b.id));
  const exitSelect=()=>{setSelectMode(false);setSelected([]);};
  const bulkDelete=async()=>{
    
    for(const id of selected) await onDeleteBooking(id);
    exitSelect();
  };

  return(<div>
    <div style={S.header}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={S.htitle}>Bookings</div><div style={S.hSub}>{bookings.length} total · {bookings.filter(b=>b.checkin<=now&&getEffectiveCheckout(b)>=now).length} active now</div></div>
        <div style={{display:"flex",gap:6}}>
          {!selectMode?(
            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={()=>setSelectMode(true)}>☑ Select</button>
              <button style={S.btnP} onClick={()=>setShowForm(true)}>+ Book</button>
            </>
          ):(
            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={toggleSelectAll}>
                {selected.length===filtered.length?"✕ Clear All":"✓ All"}
              </button>
              {selected.length>0&&<button style={{...S.btnD,padding:"8px 12px",fontSize:12}} onClick={bulkDelete}>🗑 Delete {selected.length}</button>}
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={exitSelect}>Cancel</button>
            </>
          )}
        </div>
      </div>
      <div style={{...S.tabs,marginTop:12}}>{[["upcoming","Upcoming"],["past","Past"],["all","All"]].map(([v,l])=><button key={v} style={{...S.tab(filter===v),fontSize:13}} onClick={()=>{setFilter(v);exitSelect();setSearch("");}}>{l}</button>)}</div>
      <div style={{position:"relative",marginTop:10}}>
        <input style={{...S.inp,paddingRight:search?36:14}} placeholder="🔍  Search by name, cat, room, date (e.g. Mar, Apr 2026)..." value={search} onChange={e=>{setSearch(e.target.value);exitSelect();}}/>
        {search&&<button onClick={()=>{setSearch("");exitSelect();}} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"#e0e0e0",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontFamily:"inherit",fontSize:12,color:"#555",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>✕</button>}
      </div>
    </div>
    <div style={{...S.sec,marginTop:0}}><div style={{marginTop:16}}>
      {filtered.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:C.text3}}><div style={{fontSize:32,marginBottom:8}}>📋</div>No bookings</div>
        :filtered.map(b=>{
          const cust=customers.find(c=>c.id===b.customerId);
          const cats=(cust?.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
          // Effective checkout = latest of main checkout or any extraRoom checkout
          const effectiveCheckout=getEffectiveCheckout(b);
          const n=nights(b.checkin,effectiveCheckout); const isActive=b.checkin<=now&&effectiveCheckout>=now;
          const room=ROOMS.find(r=>r.id===b.roomId);
          const isSel=selected.includes(b.id);
          return(<div key={b.id} style={{...S.card,marginBottom:10,minHeight:162,borderLeft:isActive?`3px solid ${C.accent}`:"",outline:isSel?`2px solid ${C.accent}`:"none",background:isSel?C.accentBg:C.white}} onClick={selectMode?()=>toggleSelect(b.id):undefined}>
            <div style={{padding:"22px 16px"}}>
              <div style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
                {selectMode&&(
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${isSel?C.accent:C.border}`,background:isSel?C.accent:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>
                    {isSel&&<span style={{color:"#fff",fontSize:13,fontWeight:800}}>✓</span>}
                  </div>
                )}
                <div style={{display:"flex",flexShrink:0}}>
                  {cats.slice(0,2).map((cat,i)=>(
                    <div key={cat.id} style={{width:38,height:38,borderRadius:9,overflow:"hidden",flexShrink:0,marginLeft:i>0?-10:0,border:`2px solid ${C.white}`,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>
                      {getCatThumb(cat)?<img src={getCatThumb(cat)} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                    </div>
                  ))}
                  {cats.length===0&&<div style={{...S.av(""),width:38,height:38,borderRadius:9,fontSize:17}}>🐱</div>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,lineHeight:"20px",fontWeight:700}}>{cust?.nickname||"?"} <span style={{fontSize:13,lineHeight:"20px",fontWeight:600,color:C.text2}}>({cats.length>0?cats.map(c=>c.name).join(", "):(b.catName||"Cat")})</span></div>
                  <div style={{fontSize:13,lineHeight:"20px",color:C.text2}}>{fmt(b.checkin)} → {fmt(effectiveCheckout)} · {n} night{n>1?"s":""}</div>
                  {(b.extraRooms||[]).length>0&&!selectMode&&(
                    <div style={{fontSize:13,lineHeight:"20px",color:C.purple,marginTop:2}}>
                      🔄 {(b.extraRooms||[]).length} ช่วงย้ายห้อง · {(b.extraRooms||[]).map(er=>(er.roomIds||[]).join("+")).join(", ")}
                    </div>
                  )}
                </div>
                <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:13,lineHeight:"20px",fontWeight:800,color:C.accent}}>฿{fmt2(b.net||0)}</div>{b.discount>0&&<div style={{fontSize:13,lineHeight:"20px",color:C.red}}>-{b.discount}%</div>}</div>
              </div>
              {/* Booking notes + Customer notes */}
              {b.notes&&!selectMode&&(
                <div style={{background:"#f0f6ff",borderRadius:8,padding:"6px 10px",marginBottom:6,border:"1px solid #0071e320",display:"flex",gap:6,alignItems:"flex-start"}}>
                  <span style={{fontSize:11,flexShrink:0}}>📋</span>
                  <NotesText text={b.notes} style={{fontSize:12,color:C.text2,lineHeight:1.5}}/>
                </div>
              )}
              {cust?.notes&&!selectMode&&(
                  <div style={{background:"#fffbf0",borderRadius:8,padding:"6px 10px",marginBottom:8,border:"1px solid #ffd70040"}}>
                    <div style={{fontSize:12,fontWeight:700,color:C.orange,marginBottom:2}}>📝 Customer Notes</div>
                    <NotesText text={cust.notes} style={{fontSize:14,color:C.text2,lineHeight:1.5}}/>
                </div>
              )}
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:selectMode?0:10}}>
                {isActive&&<span style={{...S.chip(C.accent),fontSize:13}}>🐾 Active</span>}
                {(b.roomIds&&b.roomIds.length>0?b.roomIds:[b.roomId]).filter(Boolean).map(rid=>{
                  const rr=ROOMS.find(x=>x.id===rid);
                  return rid?<span key={rid} style={{...S.chip(getRoomColor(rid)),fontSize:13}}>{rid}</span>:null;
                })}
                {!b.roomId&&(!b.roomIds||b.roomIds.length===0)&&b.size==="L"&&<span style={{...S.chip(C.orange),fontSize:13}}>Legacy L</span>}
                <span style={{...S.chip(b.paid?C.green:C.orange),fontSize:13}}>{b.paid?"✓ Paid Full":"Unpaid"}</span>
                {!b.paid&&b.depositAmt>0&&<span style={{...S.chip(C.orange),fontSize:13}}>💰 มัดจำ ฿{fmt2(b.depositAmt)}</span>}
                {!b.paid&&b.remaining>0&&<span style={{...S.chip(C.red),fontSize:13}}>คงเหลือ ฿{fmt2(b.remaining)}</span>}
                <span style={{...S.chip(C.blue),fontSize:13}}>{b.payMethod}</span>
                {(b.selectedCatIds?.length||0)>1&&<span style={{...S.chip(C.purple),fontSize:13}}>{b.selectedCatIds.length} cats</span>}
                {b.litter&&<span style={{...S.chip(C.blue),fontSize:13}}>🪣 ทราย</span>}
              </div>
              {!selectMode&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button style={{...S.btnG,fontSize:12,padding:"7px 12px"}} onClick={()=>setEditBook(b)}>Edit</button>
                <button style={S.btnD} onClick={()=>onDeleteBooking(b.id)}>Delete</button>
                <button style={{padding:"7px 10px",background:"#f0f6ff",color:C.blue,border:`1px solid ${C.blue}25`,borderRadius:9,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>exportICS(b,customers)}>📅 iCal</button>
                {!b.paid&&<button style={{padding:"7px 12px",background:C.greenBg,color:C.green,border:`1px solid ${C.green}30`,borderRadius:9,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",marginLeft:"auto"}} onClick={()=>onSaveBooking({...b,paid:true})}>Mark Paid ✓</button>}
              </div>}
            </div>
          </div>);
        })
      }
    </div></div>
    {(showForm||editBook)&&<BookingSheet booking={editBook} customers={customers} bookings={bookings} onSave={async d=>{await onSaveBooking(d);setShowForm(false);setEditBook(null);}} onClose={()=>{setShowForm(false);setEditBook(null);}}/>}

}

// Color palette for multi-year lines
const YEAR_COLORS=["#ff6b9d","#0071e3","#34c759","#ff9500","#af52de"];

function getMonthRevenue(bookings, year, month){
  const s=new Date(year,month,1);
  const e=new Date(year,month+1,0);
  const sStr=fmtD(s);
  const eStr=fmtD(e);
  return bookings.filter(b=>b.checkin<=eStr&&b.checkout>=sStr).reduce((sum,b)=>{
    const totalDays=Math.max(1,Math.round((new Date(b.checkout+"T12:00:00")-new Date(b.checkin+"T12:00:00"))/(864e5))+1);
    const net=b.net||0;
    const taxi=b.petTaxiAmt||0;
    const depFee=b.depositCcFee||0;
    const ccFee=b.payMethod==="Credit Card"?(b.ccFeeAmt||parseFloat(((b.remaining||Math.max(0,net-(b.depositAmt||0)))*CREDIT_CARD_FEE_PCT/100).toFixed(2))):0;
    const perDay=(net-taxi-depFee-ccFee)/totalDays;
    const overlapStart=b.checkin>sStr?b.checkin:sStr;
    const overlapEnd=b.checkout<eStr?b.checkout:eStr;
    const overlapDays=Math.round((new Date(overlapEnd+"T12:00:00")-new Date(overlapStart+"T12:00:00"))/(864e5))+1;
    return sum+perDay*Math.max(0,overlapDays);
  },0);
}
function getMonthBookings(bookings, year, month){
  const s=new Date(year,month,1);
  const e=new Date(year,month+1,0);
  return bookings.filter(b=>b.checkin>=fmtD(s)&&b.checkin<=fmtD(e)).length;
}
function getMonthRevenueByCheckin(bookings, year, month){
  const s=new Date(year,month,1);
  const e=new Date(year,month+1,0);
  const sStr=fmtD(s);
  const eStr=fmtD(e);
  return bookings.filter(b=>b.checkin>=sStr&&b.checkin<=eStr).reduce((sum,b)=>{
    const net=b.net||0;
    const taxi=b.petTaxiAmt||0;
    const depFee=b.depositCcFee||0;
    const ccFee=b.payMethod==='Credit Card'?(b.ccFeeAmt||parseFloat(((b.remaining||Math.max(0,net-(b.depositAmt||0)))*CREDIT_CARD_FEE_PCT/100).toFixed(2))):0;
    return sum+(net-taxi-depFee-ccFee);
  },0);
}
function pct(a,b){ if(!b) return null; return Math.round((a-b)/b*100); }
function PctBadge({val}){
  if(val===null) return <span style={{fontSize:13,color:"#bbb"}}>—</span>;
  const up=val>=0;
  return <span style={{fontSize:13,fontWeight:700,color:up?C.green:C.red,background:up?"#f0fdf4":"#fff5f5",padding:"2px 7px",borderRadius:100,border:`1px solid ${up?C.green+"40":C.red+"40"}`}}>{up?"+":""}{val}%</span>;
}

function DashboardPage({bookings,customers,onExportBookings}){
  // ── Main mode: revenue | checkin ──
  const [mode,setMode]=useState("revenue"); // "revenue" | "checkin"
  // ── Sub-tabs (shared between modes) ──
  const [subTab,setSubTab]=useState("overview"); // overview | mom | yoy
  const dashSlabel={...S.slabel,fontSize:15};

  // ── Overview state ──
  const [period,setPeriod]=useState("month");
  const [offset,setOffset]=useState(0);
  useEffect(()=>setOffset(0),[period,mode]);

  // ── MoM state ──
  const [momYears,setMomYears]=useState([new Date().getFullYear(),new Date().getFullYear()-1]);
  const toggleMomYear=yr=>{
    if(momYears.includes(yr)){ if(momYears.length>1) setMomYears(y=>y.filter(x=>x!==yr)); }
    else setMomYears(y=>[...y,yr]);
  };

  // ── YoY state ──
  const curYear=new Date().getFullYear();
  const [yoyYears,setYoyYears]=useState([curYear,curYear-1]);

    if(yoyYears.includes(yr)){ if(yoyYears.length>1) setYoyYears(y=>y.filter(x=>x!==yr)); }
    else setYoyYears(y=>[...y,yr].sort((a,b)=>b-a));
  };

  const availYears=Array.from({length:13},(_,i)=>2030-i);

  // ── Helpers: Revenue mode (pro-rata) ──
  const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const getRange=()=>{
    const _bkk=new Date(new Date().getTime()+7*60*60*1000);const _bkkStr=_bkk.toISOString().slice(0,10);const now=new Date(_bkkStr+"T00:00:00");
    if(period==="day"){const d=new Date(now);d.setDate(now.getDate()+offset);return{start:d,end:d,label:`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};}
    if(period==="week"){const m=new Date(now);m.setDate(now.getDate()-((now.getDay()+6)%7)+offset*7);const s=new Date(m);s.setDate(m.getDate()+6);return{start:m,end:s,label:`${m.getDate()} ${MONTHS[m.getMonth()]} – ${s.getDate()} ${MONTHS[s.getMonth()]} ${s.getFullYear()}`};}
    if(period==="month"){const s=new Date(now.getFullYear(),now.getMonth()+offset,1);const e=new Date(now.getFullYear(),now.getMonth()+offset+1,0);return{start:s,end:e,label:`${MONTHS_FULL[s.getMonth()]} ${s.getFullYear()}`};}
    const y=new Date().getFullYear()+offset;return{start:new Date(y,0,1),end:new Date(y,11,31),label:`${y}`};
  };
  const{start,end,label}=getRange();
  const startStr=ds(start),endStr=ds(end);

  const netPerDay=b=>{
    const totalDays=Math.max(1,Math.round((new Date(b.checkout+"T12:00:00")-new Date(b.checkin+"T12:00:00"))/(864e5))+1);
    const taxi=b.petTaxiAmt||0;
    const depFee=b.depositCcFee||0;
    const remFee=b.payMethod==="Credit Card"?(b.ccFeeAmt||parseFloat(((b.remaining||Math.max(0,(b.net||0)-(b.depositAmt||0)))*CREDIT_CARD_FEE_PCT/100).toFixed(2))):0;
    const fullNet=parseFloat(((b.net||0)-taxi-depFee-remFee).toFixed(2));
    return fullNet/totalDays;
  };
  const actualNet=b=>{const taxi=b.petTaxiAmt||0;const depFee=b.depositCcFee||0;const remFee=b.payMethod==="Credit Card"?(b.ccFeeAmt||parseFloat(((b.remaining||Math.max(0,(b.net||0)-(b.depositAmt||0)))*CREDIT_CARD_FEE_PCT/100).toFixed(2))):0;return parseFloat(((b.net||0)-taxi-depFee-remFee).toFixed(2));};
  const getRevenueForDateRange=(rangeStart,rangeEnd,bkList)=>
    (bkList||bookings).reduce((sum,b)=>{
      if(!b.checkin||!b.checkout) return sum;
      const overlapStart=b.checkin>rangeStart?b.checkin:rangeStart;
      const overlapEnd=b.checkout<rangeEnd?b.checkout:rangeEnd;
      if(overlapStart>overlapEnd) return sum;
      const overlapDays=Math.round((new Date(overlapEnd+"T12:00:00")-new Date(overlapStart+"T12:00:00"))/(864e5))+1;
      return sum+netPerDay(b)*Math.max(0,overlapDays);
    },0);

  // ── Helpers: Check-in mode (full net → checkin month) ──
  const getNetByCheckin=b=>{
    const net=b.net||0;
    const taxi=b.petTaxiAmt||0;
    const depFee=b.depositCcFee||0;
    const remFee=b.payMethod==="Credit Card"?(b.ccFeeAmt||parseFloat(((b.remaining||Math.max(0,net-(b.depositAmt||0)))*CREDIT_CARD_FEE_PCT/100).toFixed(2))):0;

  // room stats for checkin

  })).filter(x=>x.count>0).sort((a,b)=>b.revenue-a.revenue);

  // ── Revenue-mode overview ──
  const inRange=period==="day"

  const ccFeeTotal=parseFloat((period==="day"

        const totalDays=Math.max(1,nights(b.checkin,b.checkout)+1);

  const petTaxiTotal=parseFloat((period==="day"

  const unpaid=parseFloat((period==="day"

  const totalNights=period==="day"?inRange.length:inRange.reduce((a,b)=>a+nights(b.checkin,b.checkout),0);

                const total=Array.from({length:12},(_,m)=>getMR(yr,m)).reduce((a,b)=>a+b,0);
                const sortedYrs=[...momYears].sort((a,b)=>b-a);
                const prevYr=sortedYrs[i+1];
                const prevTotal=prevYr!==undefined?Array.from({length:12},(_,m)=>getMR(prevYr,m)).reduce((a,b)=>a+b,0):null;
                return(
                  <div key={yr} style={{flex:1,textAlign:"right"}}>
                    <div style={{fontSize:13,fontWeight:800,color:YEAR_COLORS[momYears.indexOf(yr)%YEAR_COLORS.length]}}>฿{fmt2(total)}</div>
                    {prevTotal!==null&&<div style={{marginTop:6}}><PctBadge val={pct(total,prevTotal)}/></div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    )}

    {/* ══ YoY TAB ════════════════════════════════════════════════ */}
    {subTab==="yoy"&&(
      <div style={{padding:"14px 20px 0"}}>
        <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:8}}>Year-over-Year — {modeLabel}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5, minmax(0, 1fr))",gap:8,marginBottom:6,width:"100%"}}>
          {availYears.map((yr,i)=>{
            const sel=yoyYears.includes(yr);
            const colorIdx=yoyYears.indexOf(yr);
            return(
              <button key={yr} style={{width:"100%",padding:"7px 8px",background:sel?YEAR_COLORS[colorIdx%YEAR_COLORS.length]||C.text:C.bg,color:sel?"#fff":C.text2,border:`1px solid ${sel?YEAR_COLORS[colorIdx%YEAR_COLORS.length]||C.text:C.border}`,borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:sel?700:500,cursor:"pointer",textAlign:"center"}} onClick={()=>toggleYear(yr)}>
                {yr}
              </button>
            );
          })}
        </div>
        <div style={{fontSize:13,color:C.text3,marginTop:6}}>{yoyYears.length} years selected — {yoyYears.sort((a,b)=>b-a).join(", ")}</div>
        <div style={{display:"flex",gap:8,marginTop:8,marginBottom:14}}>
          <button style={{...S.btnG,fontSize:13,padding:"5px 12px"}} onClick={()=>setYoyYears([...availYears])}>Select All</button>
          <button style={{...S.btnG,fontSize:13,padding:"5px 12px"}} onClick={()=>setYoyYears([new Date().getFullYear()])}>Clear All</button>
        </div>

        <div style={dashSlabel}>Yearly Summary</div>
        <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(yoyYears.length,3)},1fr)`,gap:8,marginBottom:14}}>
          {yearTotals.sort((a,b)=>b.yr-a.yr).map((yt,i)=>{
            const prevYr=yearTotals.find(y=>y.yr===yt.yr-1);
            return(
              <div key={yt.yr} style={{...S.statCard,borderTop:`3px solid ${YEAR_COLORS[yoyYears.indexOf(yt.yr)%YEAR_COLORS.length]||C.accent}`}}>
                <div style={{fontSize:13,fontWeight:800,color:YEAR_COLORS[yoyYears.indexOf(yt.yr)%YEAR_COLORS.length]||C.accent,marginBottom:4}}>{yt.yr}</div>
                <div style={{fontSize:18,lineHeight:"22px",fontWeight:800,color:C.text}}>฿{fmt2(yt.total)}</div>
                <div style={{fontSize:13,color:C.text3,marginBottom:5}}>{yt.bkgs} bookings</div>
                {prevYr&&<><PctBadge val={pct(yt.total,prevYr.total)}/><span style={{fontSize:13,color:C.text3,marginLeft:4}}>vs {yt.yr-1}</span></>}
              </div>
            );

        </div>

        <div style={dashSlabel}>YoY Monthly Chart</div>
        <div style={{...S.cardPad,marginBottom:14}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:12}}>
            {yoyYears.sort((a,b)=>b-a).map(yr=>(
              <div key={yr} style={{display:"flex",alignItems:"center",gap:5,fontSize:13,fontWeight:700}}>
                <div style={{width:12,height:12,borderRadius:3,background:YEAR_COLORS[yoyYears.indexOf(yr)%YEAR_COLORS.length]||C.accent}}/>
                {yr}
              </div>
            ))}
          </div>
          {yoyData.map((d,mi)=>{
            const isCurrentMonth=new Date().getMonth()===mi;
            const sortedYrs=[...yoyYears].sort((a,b)=>b-a);
            return(
              <div key={mi} style={{marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:isCurrentMonth?800:600,color:isCurrentMonth?C.accent:C.text2,marginBottom:4}}>
                  {d.monthFull}{isCurrentMonth?" ◀":""}
                </div>
                {sortedYrs.map((yr,yi)=>{
                  const val=d[yr]||0;
                  const p2=val/maxYoy*100;
                  const inside=p2>30;
                  const color=YEAR_COLORS[yoyYears.indexOf(yr)%YEAR_COLORS.length]||C.accent;
                  return(
                    <div key={yr} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <div style={{fontSize:13,fontWeight:700,color:color,width:36,flexShrink:0,textAlign:"right"}}>{yr}</div>
                      <div style={{flex:1,height:22,background:C.bg,borderRadius:6,overflow:"hidden",position:"relative"}}>
                        <div style={{height:"100%",borderRadius:6,background:color,opacity:0.85,width:`${p2}%`,transition:"width 0.4s",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:6}}>
                          {inside&&val>0&&<span style={{fontSize:13,fontWeight:700,color:"#fff"}}>฿{fmt2(val)}</span>}
                        </div>
                        {!inside&&val>0&&<span style={{position:"absolute",left:`calc(${p2}% + 5px)`,top:"50%",transform:"translateY(-50%)",fontSize:13,fontWeight:700,color:C.text2}}>฿{fmt2(val)}</span>}
                        {val===0&&<span style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.text3}}>—</span>}
                      </div>

                })}

            );
          })}
        </div>

        <div style={dashSlabel}>YoY Table</div>
        <div style={{overflowX:"auto",marginBottom:24}}>
          <div style={{...S.card,overflow:"hidden",minWidth:Math.max(320,140+yoyYears.length*110)}}>
            <div style={{display:"flex",padding:"8px 14px",background:C.bg,borderBottom:`1px solid ${C.borderLight}`}}>
              <div style={{width:54,flexShrink:0,fontSize:13,fontWeight:700,color:C.text3}}>Month</div>
              {[...yoyYears].sort((a,b)=>b-a).map((yr,i)=>(
                <div key={yr} style={{flex:1,textAlign:"right",fontSize:13,fontWeight:800,color:YEAR_COLORS[yoyYears.indexOf(yr)%YEAR_COLORS.length]||C.accent}}>

                  {i>0&&<div style={{fontSize:13,color:C.text3}}>vs {[...yoyYears].sort((a,b)=>b-a)[i-1]}</div>}
                </div>
              ))}
              {yoyYears.length>=2&&<div style={{width:82,flexShrink:0,textAlign:"right",paddingRight:4,fontSize:13,fontWeight:700,color:C.text3}}>%</div>}
            </div>
            {yoyData.map((d,mi)=>{
              const isCurrentMonth=new Date().getMonth()===mi;
              const sortedYrs=[...yoyYears].sort((a,b)=>b-a);
              return(
                <div key={mi} style={{display:"flex",padding:"9px 14px",borderBottom:mi<11?`1px solid ${C.borderLight}`:"none",background:isCurrentMonth?"#fff8fb":"transparent",alignItems:"center"}}>

                    {d.month}{isCurrentMonth&&" ◀"}
                  </div>

                    <div key={yr} style={{flex:1,textAlign:"right",fontSize:13,fontWeight:700,color:d[yr]>0?YEAR_COLORS[yoyYears.indexOf(yr)%YEAR_COLORS.length]||C.accent:C.text3}}>
                      {d[yr]>0?`฿${fmt2(d[yr])}`:"—"}
                    </div>
                  ))}
                  {yoyYears.length>=2&&(()=>{
                    const s=sortedYrs;
                    return <div style={{width:82,flexShrink:0,textAlign:"right",paddingRight:4}}><PctBadge val={pct(d[s[0]]||0,d[s[1]]||0)}/></div>;

            <div style={{display:"flex",padding:"10px 14px",background:C.bg,borderTop:`2px solid ${C.border}`,alignItems:"center"}}>

              {[...yoyYears].sort((a,b)=>b-a).map((yr,i)=>(

    )}

}

// ── PRICING PERIODS ADMIN PANEL ──────────────────────────────────────
function PricingPeriodsPanel({pricingDoc,onSavePricing,setToast}){
  const defaultRoomPeriods=()=>JSON.parse(JSON.stringify(PRICE_PERIODS));
  const defaultLitterPeriods=()=>JSON.parse(JSON.stringify(LITTER_PERIODS));

  const [roomPeriods,setRoomPeriods]=React.useState(()=>
    (pricingDoc&&pricingDoc.roomPeriods&&pricingDoc.roomPeriods.length>0)
      ?pricingDoc.roomPeriods:defaultRoomPeriods());
  const [litterPeriods,setLitterPeriods]=React.useState(()=>
    (pricingDoc&&pricingDoc.litterPeriods&&pricingDoc.litterPeriods.length>0)
      ?pricingDoc.litterPeriods:defaultLitterPeriods());
  const [saving,setSaving]=React.useState(false);
  const [dirty,setDirty]=React.useState(false);
  const [expanded,setExpanded]=React.useState(false);

  // Sync if pricingDoc changes externally
  React.useEffect(()=>{
    if(pricingDoc){
      if(pricingDoc.roomPeriods&&pricingDoc.roomPeriods.length>0)
        setRoomPeriods(pricingDoc.roomPeriods);
      if(pricingDoc.litterPeriods&&pricingDoc.litterPeriods.length>0)
        setLitterPeriods(pricingDoc.litterPeriods);
      setDirty(false);
    }
  },[pricingDoc]);

  const markDirty=()=>setDirty(true);

  // ── Room period helpers ──
  const addRoomPeriod=()=>{
    setRoomPeriods(p=>[...p,{start:today(),end:null,prices:{S:350,M:450}}]);
    markDirty();
  };
  const removeRoomPeriod=(i)=>{
    if(roomPeriods.length<=1){setToast("❌ ต้องมีอย่างน้อย 1 period");return;}
    setRoomPeriods(p=>p.filter((_,idx)=>idx!==i));
    markDirty();
  };
  const updateRoomPeriod=(i,field,val)=>{
    setRoomPeriods(p=>p.map((r,idx)=>idx!==i?r:{...r,[field]:val||null}));
    markDirty();
  };
  const updateRoomPrice=(i,size,val)=>{
    setRoomPeriods(p=>p.map((r,idx)=>{
      if(idx!==i) return r;
      const prices={...r.prices};
      const n=parseFloat(val);
      if(!val||isNaN(n)) delete prices[size]; else prices[size]=n;
      return{...r,prices};
    }));
    markDirty();
  };

  // ── Litter period helpers ──
  const addLitterPeriod=()=>{
    setLitterPeriods(p=>[...p,{start:today(),end:null,feePerRound:60,basis:"per6nights"}]);
    markDirty();
  };
  const removeLitterPeriod=(i)=>{
    if(litterPeriods.length<=1){setToast("❌ ต้องมีอย่างน้อย 1 period");return;}
    setLitterPeriods(p=>p.filter((_,idx)=>idx!==i));
    markDirty();
  };
  const updateLitterPeriod=(i,field,val)=>{
    setLitterPeriods(p=>p.map((r,idx)=>idx!==i?r:{...r,[field]:field==="feePerRound"?(parseFloat(val)||60):val||null}));
    markDirty();
  };

  // ── Validate & Save ──
  const handleSave=async()=>{
    // Basic validation
    for(const p of roomPeriods){
      if(!p.start){setToast("❌ Room period: ต้องระบุวันเริ่มต้น");return;}
      if(!p.prices||Object.keys(p.prices).length===0){setToast("❌ Room period: ต้องมีราคาอย่างน้อย 1 size");return;}
    }
    for(const p of litterPeriods){
      if(!p.start){setToast("❌ Litter period: ต้องระบุวันเริ่มต้น");return;}
      if(!p.feePerRound||p.feePerRound<=0){setToast("❌ Litter period: ต้องมีราคาทราย > 0");return;}
    }
    setSaving(true);
    try{
      const sorted_r=[...roomPeriods].sort((a,b)=>a.start>b.start?1:-1);
      const sorted_l=[...litterPeriods].sort((a,b)=>a.start>b.start?1:-1);
      await onSavePricing({roomPeriods:sorted_r,litterPeriods:sorted_l,updatedAt:new Date().toISOString()});
      setRoomPeriods(sorted_r);
      setLitterPeriods(sorted_l);
      setDirty(false);
      setToast("✅ บันทึก Pricing Periods แล้ว!");
    }catch(e){
      setToast("❌ Save failed: "+e.message);
    }
    setSaving(false);
  };

  const inp={...S.inp,padding:"5px 8px",fontSize:12,flex:1};
  const labelStyle={fontSize:10,fontWeight:700,color:C.text3,marginBottom:3};

  return(
    <div style={{marginBottom:16}}>
      <div style={S.slabel}>💰 Pricing Periods</div>
      <div style={{...S.cardPad}}>
        {/* Collapsed preview header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:expanded?14:0,cursor:"pointer"}}
          onClick={()=>setExpanded(e=>!e)}>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>จัดการราคาห้องพักและค่าทราย</div>
            <div style={{fontSize:11,color:C.text3,marginTop:2}}>
              {roomPeriods.length} room period · {litterPeriods.length} litter period
              {dirty&&<span style={{color:C.orange,marginLeft:8}}>● มีการเปลี่ยนแปลง</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {dirty&&<button style={{...S.btnP,padding:"6px 14px",fontSize:12}} onClick={e=>{e.stopPropagation();handleSave();}} disabled={saving}>
              {saving?"⏳ Saving...":"💾 บันทึก"}
            </button>}
            <span style={{fontSize:18,color:C.text3}}>{expanded?"▲":"▼"}</span>
          </div>
        </div>

        {expanded&&(
          <div>
            {/* ── Room Periods ── */}
            <div style={{fontWeight:800,fontSize:13,color:C.accent,marginBottom:10}}>🏠 Room Pricing Periods</div>
            <div style={{background:C.blueBg,borderRadius:8,padding:"8px 12px",fontSize:11,color:C.blue,marginBottom:12,lineHeight:1.7}}>
              <b>วิธีใช้:</b> แต่ละ Period กำหนดช่วงวันที่และราคาต่อคืน — ระบบจะใช้ราคาของ period ที่ตรงกับวัน Check-in<br/>
              <b>End date ว่าง</b> = ใช้ต่อเนื่องถึงปัจจุบัน · ราคา L ซ่อนจาก booking ใหม่ แต่ใช้กับข้อมูลเก่าได้
            </div>
            {roomPeriods.map((p,i)=>(
              <div key={i} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"flex-end"}}>
                  <div style={{flex:1}}>
                    <div style={labelStyle}>Start Date</div>
                    <input style={inp} type="date" value={p.start||""} onChange={e=>updateRoomPeriod(i,"start",e.target.value)}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={labelStyle}>End Date (ว่าง = ปัจจุบัน)</div>
                    <input style={inp} type="date" value={p.end||""} onChange={e=>updateRoomPeriod(i,"end",e.target.value)}/>
                  </div>
                  <button onClick={()=>removeRoomPeriod(i)}
                    style={{background:"transparent",border:`1px solid ${C.red}30`,color:C.red,borderRadius:8,padding:"5px 10px",fontSize:13,cursor:"pointer",flexShrink:0}}>✕</button>
                </div>
                <div style={{display:"flex",gap:8}}>
                  {["S","M","L"].map(sz=>(
                    <div key={sz} style={{flex:1}}>
                      <div style={labelStyle}>ห้อง {sz} (฿/คืน)</div>
                      <input style={inp} type="number" min="0" inputMode="numeric"
                        value={p.prices?.[sz]||""}
                        placeholder={sz==="L"?"ไม่บังคับ":""}
                        onChange={e=>updateRoomPrice(i,sz,e.target.value)}/>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            <button style={{...S.btnG,width:"100%",marginBottom:20,borderStyle:"dashed",fontSize:12}} onClick={addRoomPeriod}>
              + เพิ่ม Room Period
            </button>

            {/* ── Litter Periods ── */}
            <div style={{fontWeight:800,fontSize:13,color:C.accent,marginBottom:10}}>🪣 Cat Litter Pricing Periods</div>
            <div style={{background:C.blueBg,borderRadius:8,padding:"8px 12px",fontSize:11,color:C.blue,marginBottom:12,lineHeight:1.7}}>
              <b>per6nights</b> = คิดราคา 1 รอบต่อ 6 คืน (เช่น ฿60 / 6 คืน / ตัว)
            </div>
            {litterPeriods.map((p,i)=>(
              <div key={i} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"flex-end"}}>
                  <div style={{flex:1}}>
                    <div style={labelStyle}>Start Date</div>
                    <input style={inp} type="date" value={p.start||""} onChange={e=>updateLitterPeriod(i,"start",e.target.value)}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={labelStyle}>End Date (ว่าง = ปัจจุบัน)</div>
                    <input style={inp} type="date" value={p.end||""} onChange={e=>updateLitterPeriod(i,"end",e.target.value)}/>
                  </div>
                  <button onClick={()=>removeLitterPeriod(i)}
                    style={{background:"transparent",border:`1px solid ${C.red}30`,color:C.red,borderRadius:8,padding:"5px 10px",fontSize:13,cursor:"pointer",flexShrink:0}}>✕</button>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <div style={{flex:1}}>
                    <div style={labelStyle}>ราคา (฿)</div>
                    <input style={inp} type="number" min="0" inputMode="numeric"
                      value={p.feePerRound||""} onChange={e=>updateLitterPeriod(i,"feePerRound",e.target.value)}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={labelStyle}>คิดแบบ</div>
                    <select style={{...inp,background:C.bg}} value={p.basis||"per6nights"}
                      onChange={e=>updateLitterPeriod(i,"basis",e.target.value)}>
                      <option value="per6nights">per6nights (ทุก 6 คืน)</option>
                      <option value="perNight">perNight (ต่อคืน)</option>
                    </select>
                  </div>
                </div>
              </div>
            ))}
            <button style={{...S.btnG,width:"100%",marginBottom:16,borderStyle:"dashed",fontSize:12}} onClick={addLitterPeriod}>
              + เพิ่ม Litter Period
            </button>

            {/* Save button */}
            <button style={{...S.btnP,width:"100%",padding:"12px"}} onClick={handleSave} disabled={saving||!dirty}>
              {saving?"⏳ กำลังบันทึก...":dirty?"💾 บันทึก Pricing Periods":"✅ บันทึกแล้ว"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
