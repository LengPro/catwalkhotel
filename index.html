async function fbSave(col,id,data){

}

// ── NotesText — render URLs as clickable links ────────────────
function NotesText({text,style}){
  if(!text) return null;
  const urlRegex=/(https?:\/\/[^\s]+|www\.[^\s]+)/g;
  const parts=text.split(urlRegex);
  return(
    <span style={style}>
      {parts.map((part,i)=>{
        if(urlRegex.test(part)){
          urlRegex.lastIndex=0;
          const href=part.startsWith("http")?part:"https://"+part;
          return <a key={i} href={href} target="_blank" rel="noopener noreferrer" style={{color:"#0071e3",textDecoration:"underline",wordBreak:"break-all"}} onClick={e=>e.stopPropagation()}>{part}</a>;
        }
        return <span key={i}>{part}</span>;
      })}
    </span>
  );
}

  if(roomId.startsWith("B-S")) return ROOM_COLOR_MAP["B-S"];
  if(roomId.startsWith("C-S")) return ROOM_COLOR_MAP["C-S"];
  return "#888";
}

  const discAmt=parseFloat((base*(parseFloat(discount)||0)/100).toFixed(2));
  const net=parseFloat((base-discAmt).toFixed(2));
  return{base,discAmt,net,litterAmt,litterWeeks,extraCats,pricePerNight:nightlyRate};
};

const fmt2=v=>typeof v==="number"?trunc2(v).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}):v;

function getCustomer(id,customers){ return customers.find(c=>c.id===id)||null; }
function getBookingRooms(b){ return(b.roomIds&&b.roomIds.length>0?b.roomIds:[b.roomId]).filter(Boolean); }
function applyCardFee(amount,payMethod){ return payMethod==="CreditCard"?parseFloat((amount*(1+CREDIT_CARD_FEE_PCT)).toFixed(2)):amount; }
function resolveCatNames(b,customers){
  const cust=customers.find(c=>c.id===b.customerId);
  return(b.selectedCatIds||[]).map(id=>(cust?.cats||[]).find(cat=>cat.id===id)?.name).filter(Boolean).join(", ")||b.catName||"Cat";
}

// ── Room availability ─────────────────────────────────────────────────
function getRoomBookings(roomId, bookings) {
  return bookings.filter(b => {
    if(b.roomId === roomId || (b.roomIds||[]).includes(roomId)) return true;
    // Check extraRooms
    return (b.extraRooms||[]).some(er=>(er.roomIds||[]).includes(roomId));
  });
}
function isRoomAvailable(roomId, checkin, checkout, bookings, excludeId=null) {
  const rb = bookings.filter(b=>b.id!==excludeId);
  for (const b of rb) {
    // Check main rooms
    if(b.roomId===roomId||(b.roomIds||[]).includes(roomId)){
      if (b.checkin < checkout && b.checkout > checkin) return false;
    }
    // Check extraRooms
    for(const er of (b.extraRooms||[])){
      if((er.roomIds||[]).includes(roomId)){
        if(er.checkin < checkout && er.checkout > checkin) return false;
      }
    }
  }
  return true;
}
function getAvailableRooms(type, checkin, checkout, bookings, excludeId=null) {
  return ROOMS.filter(r => r.type === type && isRoomAvailable(r.id, checkin, checkout, bookings, excludeId));
}

// ── FileUpload ────────────────────────────────────────────────────────
function FileUpload({value,onChange,label,icon}){
  const ref=useRef();
  const hf=e=>{
    const f=e.target.files[0];
    if(!f) return;
    // Compress image using canvas before saving
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=600; // max width/height px
        let w=img.width, h=img.height;
        if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} }
        else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        // Compress to JPEG quality 0.75 (~50-80KB typical)
        const compressed=canvas.toDataURL("image/jpeg",0.75);
        onChange(compressed);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  const isImg=value&&value.startsWith("data:image");
  return(<div style={{border:`1px dashed ${value?C.green:C.border}`,borderRadius:12,padding:"12px 14px",background:value?C.greenBg:C.bg,cursor:"pointer"}} onClick={()=>ref.current.click()}>
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      {isImg?<img src={value} style={{width:48,height:48,borderRadius:8,objectFit:"cover",flexShrink:0}} alt=""/>:<div style={{width:48,height:48,borderRadius:8,background:C.white,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{icon}</div>}
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:value?C.green:C.text2}}>{value?`✓ ${label} uploaded`:`Upload ${label}`}</div><div style={{fontSize:11,color:C.text3,marginTop:2}}>Tap to {value?"change":"select"}</div></div>
      {value&&<button style={{...S.btnD,fontSize:11,padding:"5px 10px"}} onClick={e=>{e.stopPropagation();onChange("");}}>✕</button>}
    </div>
    <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={hf}/>
  </div>);
}

// ── VaccinePhotoAdd ───────────────────────────────────────────────────
function VaccinePhotoAdd({onAddMultiple,maxRemaining}){
  const ref=React.useRef();
  const compressOne=(file)=>new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1200;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.75));
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  const hf=async e=>{
    const files=Array.from(e.target.files).slice(0,maxRemaining);
    if(!files.length)return;
    const results=await Promise.all(files.map(compressOne));
    onAddMultiple(results);
    e.target.value="";
  };
  return(
    <div style={{border:`1px dashed ${C.border}`,borderRadius:9,padding:"8px 12px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:C.bg}} onClick={()=>ref.current.click()}>
      <span style={{fontSize:18}}>💉</span>
      <span style={{fontSize:12,color:C.text2,flex:1}}>Add vaccine passport photo{maxRemaining>1?" (select multiple)":""}</span>
      <span style={{fontSize:11,color:C.text3}}>Tap</span>
      <input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={hf}/>
    </div>
  );
}

// INFINITE SCROLL CALENDAR — shared date range picker
// ════════════════════════════════════════════════════════════════
function InfiniteScrollCalendar({checkin,checkout,onChange,allowPast=false,startLabel="📅 Check-in",endLabel="📅 Check-out"}){
  const toStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today2=toStr(new Date());
  const [picking,setPicking]=useState(!checkin?"checkin":!checkout?"checkout":"checkin");
  const [show,setShow]=useState(false);
  // Generate list of months: 6 past + current + 18 future
  const getMonths=()=>{
    const list=[];
    const now=new Date();
    for(let i=-2;i<=18;i++){
      const d=new Date(now.getFullYear(),now.getMonth()+i,1);
      list.push({y:d.getFullYear(),m:d.getMonth()});
    }
    return list;
  };
  const months=getMonths();
  const scrollRef=useRef(null);

  // Scroll to current month on open
  useEffect(()=>{
    if(show&&scrollRef.current){
      const today=new Date();
      const targetIdx=months.findIndex(mo=>mo.y===today.getFullYear()&&mo.m===today.getMonth());
      if(targetIdx>=0){
        // Each month block is ~280px tall
        setTimeout(()=>{
          if(scrollRef.current) scrollRef.current.scrollTop=Math.max(0,(targetIdx-0.5)*290);
        },50);
      }
    }
  },[show]);

  const handleDay=(dateStr)=>{
    if(picking==="checkin"){
      onChange({checkin:dateStr,checkout:""});
      setPicking("checkout");
    } else {
      if(dateStr<checkin){
        // selected earlier than checkin — restart
        onChange({checkin:dateStr,checkout:""});
        setPicking("checkout");
      } else {
        // same day or later → allow (same day = 1 คืน day use)
        onChange({checkin,checkout:dateStr});
        setPicking("checkin");
        setShow(false);
      }
    }
  };

  const n=checkin&&checkout?Math.max(1,Math.round((new Date(checkout)-new Date(checkin))/(864e5))):0;

  return(
    <div>
      {/* Display button */}
      <div style={{border:`1px solid ${(checkin||checkout)?C.accent:C.border}`,borderRadius:12,padding:"10px 12px",cursor:"pointer",background:C.white,display:"flex",alignItems:"center",justifyContent:"space-between"}} onClick={()=>setShow(s=>!s)}>
        <div style={{display:"flex",alignItems:"center",gap:8,flex:1}}>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:C.text3,marginBottom:2}}>CHECK-IN</div>
            <div style={{fontSize:14,fontWeight:800,color:checkin?C.accent:C.text3}}>{checkin?fmt(checkin):"— —"}</div>
          </div>
          <div style={{fontSize:18,color:C.text3}}>→</div>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:C.text3,marginBottom:2}}>CHECK-OUT</div>
            <div style={{fontSize:14,fontWeight:800,color:checkout?C.blue:C.text3}}>{checkout?fmt(checkout):"— —"}</div>
          </div>
        </div>
        {n>0&&<div style={{...S.chip(C.text),marginLeft:8}}>{n}คืน</div>}
      </div>

      {/* Infinite scroll calendar panel */}
      {show&&(
        <div style={{marginTop:6,border:`1px solid ${C.borderLight}`,borderRadius:14,background:C.white,boxShadow:C.shadowMd,overflow:"hidden"}}>
          {/* Header */}
          <div style={{background:C.accentBg,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:10,borderBottom:`1px solid ${C.accent}20`}}>
            <div style={{fontSize:12,fontWeight:700,color:C.accent}}>
              {picking==="checkin"?startLabel:endLabel}
              {checkin&&picking==="checkout"?` (จาก ${fmt(checkin)})` :""}
            </div>
            <div style={{display:"flex",gap:6}}>
              <button style={{...S.btnG,fontSize:11,padding:"5px 10px"}} onClick={()=>{onChange({checkin:"",checkout:""});setPicking("checkin");}}>ล้าง</button>
              <button style={{...S.btnG,fontSize:11,padding:"5px 10px"}} onClick={()=>setShow(false)}>เสร็จ</button>
            </div>
          </div>
          {/* Day of week header */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"6px 8px 2px",background:"#fafafa",borderBottom:`1px solid ${C.borderLight}`,position:"sticky",top:43,zIndex:9}}>
            {["อา","จ","อ","พ","พฤ","ศ","ส"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.text3}}>{d}</div>)}
          </div>
          {/* Scrollable months */}
          <div ref={scrollRef} style={{overflowY:"auto",maxHeight:"60vh",WebkitOverflowScrolling:"touch"}}>
            {months.map(({y,m})=>{
              const daysInMonth=new Date(y,m+1,0).getDate();
              const firstDayOfWeek=new Date(y,m,1).getDay();
              const days=[];
              for(let i=0;i<firstDayOfWeek;i++) days.push(null);
              for(let d=1;d<=daysInMonth;d++) days.push(`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
              const monthKey=`${y}-${m}`;
              return(
                <div key={monthKey} style={{borderBottom:`1px solid ${C.borderLight}`,paddingBottom:8}}>
                  {/* Month label */}
                  <div style={{padding:"10px 14px 6px",fontSize:13,fontWeight:800,color:C.text,background:"#fafafa",borderBottom:`1px solid ${C.borderLight}40`}}>
                    {MONTHS_FULL[m]} {y}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"4px 8px",gap:2}}>
                    {days.map((dateStr,i)=>{
                      if(!dateStr) return <div key={i}/>;
                      const isCI=dateStr===checkin;
                      const isCO=dateStr===checkout;
                      const inRange=checkin&&checkout&&dateStr>checkin&&dateStr<checkout;
                      const isPast=!allowPast&&dateStr<today2;
                      const isToday3=dateStr===today2;
                      const isSel=isCI||isCO;
                      return(
                        <div key={dateStr} onClick={()=>!isPast&&handleDay(dateStr)} style={{
                          textAlign:"center",padding:"7px 2px",borderRadius:8,
                          cursor:isPast?"default":"pointer",
                          background:isSel?C.accent:inRange?C.accentBg:"transparent",
                          color:isSel?"#fff":isPast?"#ccc":isToday3?C.accent:C.text,
                          fontWeight:isSel?800:isToday3?700:400,
                          fontSize:14,
                          border:isToday3&&!isSel?`1px solid ${C.accent}`:"none",
                        }}>
                          {new Date(dateStr+"T12:00:00").getDate()}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// ROOMS PAGE — Timeline + Availability
// ════════════════════════════════════════════════════════════════
function RoomsPage({bookings,customers,setToast,onSaveBooking,onDeleteBooking,onShowReceipt}){
  const [viewDate,setViewDate]=useState(today());
  const [daysShow,setDaysShow]=useState(30); // configurable: 14/30/60/90
  const [detailBooking,setDetailBooking]=useState(null);
  const [editBooking,setEditBooking]=useState(null);
  const [checkAvail,setCheckAvail]=useState({checkin:"",checkout:"",type:"S"});
  const tlRef=useRef(null);
  const stickyHdrRef=useRef(null);

  // Sync sticky header horizontal scroll with main timeline
  useEffect(()=>{
    const el=tlRef.current;
    if(!el) return;
    const onScroll=()=>{ if(stickyHdrRef.current) stickyHdrRef.current.scrollLeft=el.scrollLeft; };
    el.addEventListener("scroll",onScroll,{passive:true});
    return()=>el.removeEventListener("scroll",onScroll);
  },[]);

  // Build date array for timeline
  const dateArr=useMemo(()=>{
    const arr=[];
    for(let i=0;i<daysShow;i++) arr.push(addDays(viewDate,i));
    return arr;
  },[viewDate,daysShow]);

  const todayStr=today();
  const occupiedRoomsToday=bookings.filter(b=>b.checkin<=todayStr&&b.checkout>=todayStr)
    .reduce((acc,b)=>{(b.roomIds&&b.roomIds.length>0?b.roomIds:[b.roomId].filter(Boolean)).forEach(r=>acc.add(r));return acc;},new Set()).size;

  // Scroll today into view on mount / date change
  useEffect(()=>{
    if(!tlRef.current) return;
    const idx=dateArr.indexOf(todayStr);
    if(idx>=0){ const scrollTo=idx*44; tlRef.current.scrollLeft=Math.max(0,scrollTo-60); if(stickyHdrRef.current) stickyHdrRef.current.scrollLeft=tlRef.current.scrollLeft; }
  },[viewDate,dateArr]);

  // Pre-filter virtual row bookings — avoids 2× full scan per render inside JSX
  const homeVRBookings=useMemo(()=>bookings.filter(b=>b.size==="H"&&b.checkin&&b.checkout),[bookings]);
  const taxiVRBookings=useMemo(()=>bookings.filter(b=>b.petTaxiAmt>0&&b.checkin&&b.checkout),[bookings]);

  // Index: roomId → [bookings] — built once per bookings change, O(1) lookup per cell
  const roomBookingIndex=useMemo(()=>{
    const idx=new Map();
    const add=(rid,b)=>{ if(!idx.has(rid)) idx.set(rid,[]); idx.get(rid).push(b); };
    for(const b of bookings){
      const rooms=(b.roomIds&&b.roomIds.length>0?b.roomIds:[b.roomId]).filter(Boolean);
      rooms.forEach(rid=>add(rid,b));
      (b.extraRooms||[]).forEach(er=>(er.roomIds||[]).forEach(rid=>add(rid,b)));
    }
    return idx;
  },[bookings]);

  // Per-column date meta — avoids repeated new Date() inside the cell loop
  const dateMeta=useMemo(()=>{
    const m=new Map();
    for(const d of dateArr){
      const dt=new Date(d+"T12:00:00");
      m.set(d,{isWeekend:dt.getDay()===0||dt.getDay()===6,isMonth1:dt.getDate()===1,isToday:d===todayStr});
    }
    return m;
  },[dateArr,todayStr]);

  function getBookingForRoomDate(roomId,dateStr){
    return (roomBookingIndex.get(roomId)||[]).find(b=>{
      if((b.roomId===roomId||(b.roomIds||[]).includes(roomId))&&b.checkin<=dateStr&&b.checkout>=dateStr) return true;
      return (b.extraRooms||[]).some(er=>(er.roomIds||[]).includes(roomId)&&er.checkin<=dateStr&&er.checkout>=dateStr);
    })||null;
  }

  // Returns {bk, checkin, checkout} with date range scoped to this specific room segment
  function getBookingEntryForRoomDate(roomId,dateStr){
    for(const b of (roomBookingIndex.get(roomId)||[])){
      if(b.roomId===roomId||(b.roomIds||[]).includes(roomId)){
        const extraStarts=(b.extraRooms||[]).filter(er=>(er.roomIds||[]).length>0&&er.checkin).map(er=>er.checkin).sort();
        const mainEnd=extraStarts.length>0?extraStarts[0]:b.checkout;
        if(b.checkin<=dateStr&&mainEnd>=dateStr) return{bk:b,checkin:b.checkin,checkout:mainEnd};
      }
      for(const er of (b.extraRooms||[])){
        if((er.roomIds||[]).includes(roomId)&&er.checkin<=dateStr&&er.checkout>=dateStr)
          return{bk:b,checkin:er.checkin,checkout:er.checkout};
      }
    }
    return null;
  }

  const availCheckin=checkAvail.checkin;
  const availCheckout=checkAvail.checkout;
  const availableRooms=availCheckin&&availCheckout&&availCheckin<=availCheckout
    ? ROOMS.filter(r=>r.type===checkAvail.type&&isRoomAvailable(r.id,availCheckin,availCheckout,bookings))
    : null;

  // Auto-move timeline to checkin date when availability is selected
  useEffect(()=>{
    if(availCheckin) setViewDate(availCheckin);
  },[availCheckin]);

  const zones=["A","B","C"];

  // Export ALL bookings as one ICS file
  function exportAllBookingsICS(){
    if(!bookings.length){ setToast("No bookings to export"); return; }
    const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Catwalk Hotel//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "X-WR-CALNAME:Catwalk Hotel — All Bookings",
      "X-WR-TIMEZONE:Asia/Bangkok",
    ];
    const ts=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    bookings.forEach(b=>{
      const cust=customers.find(c=>c.id===b.customerId)||{};
      const cats=(cust.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
      const catNames=cats.map(c=>c.name).join(", ")||b.catName||"Cat";
      const catDetails=cats.map(c=>`  • ${c.name}${c.breed?` (${c.breed})`:""}`).join("\\n");
      const n=nights(b.checkin,b.checkout);
      const rooms=(b.roomIds&&b.roomIds.length>0?b.roomIds:[b.roomId].filter(Boolean)).join(", ")||b.size||"";
      const checkoutPlusOne=addDays(b.checkout,1);
      const descParts=[
        `IN  : ${b.checkin}`,
        `OUT : ${b.checkout}`,
        `ชื่อลค : ${cust.nickname||""}${cust.fullname?` (${cust.fullname})`:""}`,
        `ชื่อแมว : ${catNames}`,
        `ราคาห้อง : ฿${fmt2(b.net||0)}`,
        `ทราย : ${b.litter?"✅":"❌"}${b.litter&&b.litterAmt>0?` ฿${fmt2(b.litterAmt)}`:""}`,
        `Taxi : ${b.petTaxiAmt>0?`✅ ฿${fmt2(b.petTaxiAmt)} (${b.petTaxiDay||""})`:`❌`}`,
        `เบอร์ : ${cust.phone||""}`,
        `ที่อยู่ : ${cust.address||""}`,
        `Booking notes : ${b.notes||""}`,
        ``,
        `━━ รายละเอียด ━━`,
        `🏠 ${rooms} · ${n} คืน`,
        `💰 ฿${fmt2(b.net||0)} · ${b.payMethod||""}${b.paid?" ✓":" (ยังไม่ชำระครบ)"}`,
        b.depositAmt>0?`💳 มัดจำ: ฿${fmt2(b.depositAmt)}`:"",
        b.remaining>0?`⚠️ ค้างชำระ: ฿${fmt2(b.remaining)}`:"",
        b.discount>0?`🏷 ส่วนลด: ${b.discount}%`:"",
        catDetails?`\\n━━ แมว ━━\\n${catDetails}`:"",
        cust.line?`📱 ${cust.line}`:"",
        cust.notes?`📝 Customer Notes: ${cust.notes}`:"",
      ].filter(Boolean);
      const desc=descParts.join("\\n");
      const custName2=cust.nickname||"";const summary=`${rooms} ${custName2?custName2+" ":""} (${catNames}) : ${n} คืน`;
      // Single all-day event covering full stay
      lines.push(
        "BEGIN:VEVENT",
        `UID:stay-${b.id}@catwalkhotel`,
        `DTSTAMP:${ts}`,
        `DTSTART;VALUE=DATE:${toICS(b.checkin)}`,
        `DTEND;VALUE=DATE:${toICS(checkoutPlusOne)}`,
        `SUMMARY:${summary}`,
        `DESCRIPTION:${desc}`,
        `LOCATION:Catwalk Hotel — ${rooms}`,
        "BEGIN:VALARM",
        "TRIGGER:-P1D",
        "ACTION:DISPLAY",
        `DESCRIPTION:พรุ่งนี้มีลูกค้า! ${summary}`,
        "END:VALARM",
        "END:VEVENT"
      );
    });
    lines.push("END:VCALENDAR");
    const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`catwalk-all-bookings-${today()}.ics`;
    a.click();
    setToast(`✅ Downloaded ${bookings.length} bookings as .ics`);
  }

  return(<div>
    <div style={S.header}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div><div style={S.htitle}>Rooms</div><div style={S.hSub}>{ROOMS.length} rooms · {occupiedRoomsToday} occupied today · S ฿{PRICES.S} · M ฿{PRICES.M}/night</div></div>
        <button style={{...S.btnB,fontSize:12,padding:"9px 14px",whiteSpace:"nowrap"}} onClick={exportAllBookingsICS}>
          📅 Download All .ICS
        </button>
      </div>
    </div>

    {/* ── Check Availability Panel ── */}
    <div style={{...S.sec,marginTop:8,paddingTop:0,paddingBottom:0}}>
      <div style={S.slabel}>Check Availability</div>
      <div style={{...S.card,padding:10,marginBottom:0}}>
        {/* Date Range Picker for availability */}
        {(()=>{
          const availN=checkAvail.checkin&&checkAvail.checkout?Math.max(1,Math.round((new Date(checkAvail.checkout)-new Date(checkAvail.checkin))/(864e5))):0;
          return(
            <div style={{marginBottom:6}}>
              <InfiniteScrollCalendar
                checkin={checkAvail.checkin}
                checkout={checkAvail.checkout}
                allowPast={true}
                onChange={({checkin,checkout})=>setCheckAvail(v=>({...v,checkin,checkout}))}
              />
            </div>
          );
        })()}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {["S","M"].map(t=>(
            <button key={t} style={{padding:"8px",background:checkAvail.type===t?C.text:C.bg,color:checkAvail.type===t?"#fff":C.text2,border:`1px solid ${checkAvail.type===t?C.text:C.border}`,borderRadius:10,fontFamily:"inherit",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:1}} onClick={()=>setCheckAvail(v=>({...v,type:t}))}>
              <span style={{fontSize:14,fontWeight:800}}>Room {t}</span>
              <span style={{fontSize:12,fontWeight:600,opacity:0.8}}>฿{PRICES[t]}/night</span>
            </button>
          ))}
        </div>
        {availableRooms!==null&&(
          <div style={{marginTop:10,padding:"8px 12px",background:availableRooms.length>0?C.greenBg:C.accentBg,borderRadius:10,border:`1px solid ${availableRooms.length>0?C.green:C.accent}40`}}>
            <div style={{fontSize:13,fontWeight:700,color:availableRooms.length>0?C.green:C.accent,marginBottom:availableRooms.length>0?6:0}}>
              {availableRooms.length>0?`✅ ${availableRooms.length} room${availableRooms.length>1?"s":""} available (${nights(availCheckin,availCheckout)} nights)`:"❌ No rooms available for this period"}
            </div>
            {availableRooms.length>0&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {availableRooms.map(r=>(
                  <span key={r.id} style={{...S.chip(getRoomColor(r.id)),fontWeight:700}}>{r.label}</span>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>

    {/* ── Timeline ── */}
    <div style={{...S.sec,marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={S.slabel}>Room Timeline</div>
          {/* Days selector */}
          <div style={{display:"flex",gap:4}}>
            {[14,30,60,90].map(d=>(
              <button key={d} style={{padding:"3px 9px",background:daysShow===d?C.text:C.bg,color:daysShow===d?"#fff":C.text2,border:`1px solid ${daysShow===d?C.text:C.border}`,borderRadius:7,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer"}} onClick={()=>setDaysShow(d)}>{d}d</button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"nowrap",whiteSpace:"nowrap"}}>
          <input type="month" style={{...S.inp,width:138,minWidth:138,padding:"5px 10px",fontSize:14,borderRadius:8,flexShrink:0}} min="2018-01" max="2030-12"
            value={viewDate.slice(0,7)}
            onChange={e=>{ if(e.target.value) setViewDate(e.target.value+"-01"); }}
          />
          <button style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,color:C.text2,flexShrink:0}} onClick={()=>setViewDate(d=>addDays(d,-30))} title="Prev month">《</button>
          <button style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,color:C.text2,flexShrink:0}} onClick={()=>setViewDate(d=>addDays(d,-7))}>‹</button>
          <button style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"0 12px",height:32,cursor:"pointer",fontSize:13,fontWeight:700,color:C.text2,flexShrink:0}} onClick={()=>setViewDate(today())}>Today</button>
          <button style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,color:C.text2,flexShrink:0}} onClick={()=>setViewDate(d=>addDays(d,7))}>›</button>
          <button style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,color:C.text2,flexShrink:0}} onClick={()=>setViewDate(d=>addDays(d,30))} title="Next month">》</button>
        </div>
      </div>

      {/* Current period label */}
      <div style={{fontSize:14,fontWeight:600,color:C.text2,marginBottom:8,paddingLeft:2}}>
        {(()=>{ const x=new Date(viewDate+"T12:00:00"); return `${MONTHS_FULL[x.getMonth()]} ${x.getFullYear()}`; })()}
        {" → "}{(()=>{ const x=new Date(dateArr[dateArr.length-1]+"T12:00:00"); return `${MONTHS_FULL[x.getMonth()]} ${x.getFullYear()}`; })()}
        <span style={{color:C.text3,fontWeight:400}}> · scroll ← → to see all days</span>
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:12,marginBottom:10,flexWrap:"wrap"}}>
        {zones.map(z=><div key={z} style={{display:"flex",alignItems:"center",gap:5,fontSize:13,fontWeight:600,color:ZONE_COLORS[z]}}><div style={{width:12,height:12,borderRadius:3,background:ZONE_COLORS[z]}}/> Zone {z}</div>)}
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,fontWeight:600,color:"#1565c0"}}><div style={{width:12,height:12,borderRadius:3,background:"#e3f2fd",border:"1px solid #1565c040"}}/> @Home</div>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,fontWeight:600,color:"#f9a825"}}><div style={{width:12,height:12,borderRadius:3,background:"#fffde7",border:"1px solid #f9a82540"}}/> Pet Taxi</div>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:C.text3}}><div style={{width:12,height:12,borderRadius:3,background:"#f0f0f0",border:`1px solid ${C.border}`}}/> Free</div>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:C.accent}}><div style={{width:12,height:12,borderRadius:3,background:C.accentBg,border:`1px solid ${C.accent}40`}}/> Today</div>
      </div>

      {/* Timeline table — horizontal scroll, sticky room column */}
      {/* Sticky date header — synced with tlRef scroll */}

              <div style={{fontSize:10,fontWeight:700,color:isToday?C.accent:isSat||isSun?"#bbb":C.text3}}>{DAYS_SHORT[x.getDay()]}</div>

              {/* Each room row */}

                    }
                    return(<div key={d} style={{
                      width:68,flexShrink:0,height:38,
                      background:isToday?"#fff5f8":isWeekend?"#fafafa":C.white,

            </div>);
          })}
          {/* ── @Home and Pet Taxi special rows ── */}
          {[
            {vr:VIRTUAL_ROWS[0], vrBookings:homeVRBookings},

          ].map(({vr,vrBookings})=>{
            // All bookings visible on a given date
            const getBksForDate=(d)=>vrBookings.filter(b=>{
              if(vr.type!=="taxi") return d>=b.checkin&&d<=b.checkout;
              const day=b.petTaxiDay||"checkin";
              if(day==="both") return d===b.checkin||d===b.checkout;
              if(day==="checkout") return d===b.checkout;
              return d===b.checkin;
            });
            // Row height adapts to the busiest day in the visible range
            const chipH=28;
            const maxN=Math.max(1,...dateArr.map(d=>getBksForDate(d).length));
            const rowH=maxN*chipH+8;
            return(<div key={vr.id}>
              {/* Zone label row */}
              <div style={{display:"flex",background:vr.bg,borderBottom:`1px solid ${C.borderLight}`}}>
                <div style={{width:68,flexShrink:0,padding:"5px 8px",fontSize:10,fontWeight:800,color:vr.color,borderRight:`1px solid ${C.borderLight}`,position:"sticky",left:0,zIndex:5,background:vr.bg}}>{vr.label.toUpperCase()}</div>
                {dateArr.map(d=><div key={d} style={{width:68,flexShrink:0,height:20,borderRight:`1px solid ${C.borderLight}`,background:vr.bg}}/>)}
              </div>
              {/* Single row — cells stack chips vertically when multiple bookings exist */}
              <div style={{display:"flex",borderBottom:`1px solid ${C.borderLight}`}}>
                <div style={{width:68,flexShrink:0,padding:"6px 8px",borderRight:`1px solid ${C.border}`,background:C.white,display:"flex",flexDirection:"column",justifyContent:"center",position:"sticky",left:0,zIndex:5}}>
                  <div style={{fontSize:13,fontWeight:800,color:vr.color}}>{vr.label}</div>
                  <div style={{fontSize:9,color:C.text3}}>{vr.type==="H"?"@Home":"Taxi"}</div>
                </div>
                {dateArr.map((d,di)=>{
                  const bks=getBksForDate(d);
                  const {isToday,isMonth1}=dateMeta.get(d)||{};
                  if(bks.length>0){
                    return(<div key={d} style={{
                      width:68,flexShrink:0,height:rowH,
                      background:vr.bg,
                      borderRight:isMonth1?"2px solid #bbb":`1px solid ${vr.color}30`,
                      borderLeft:isMonth1?"2px solid #bbb":"none",
                      display:"flex",flexDirection:"column",gap:2,padding:"4px 2px",
                    }}>
                      {bks.map(bk=>{
                        const cust=customers.find(c=>c.id===bk.customerId);
                        const cats=(cust?.cats||[]).filter(c=>(bk.selectedCatIds||[]).includes(c.id));
                        const allCatNames=cats.map(c=>c.name).join(", ")||bk.catName||"Cat";
                        const nickname=cust?.nickname||"";
                        const isStart=bk.checkin===d;
                        const isEnd=bk.checkout===d;
                        const tip=vr.type==="H"
                          ?`${nickname}: ${allCatNames} · @Home ฿${bk.homePriceTotal||bk.homePricePerNight||"??"} รวม`
                          :`${nickname}: ${allCatNames} · 🚕 ฿${fmt2(bk.petTaxiAmt)}`;
                        return(<div key={bk.id} title={tip} style={{
                          flex:1,minHeight:0,
                          background:vr.color+"18",
                          borderLeft:isStart?`3px solid ${vr.color}`:`1px solid ${vr.color}30`,
                          borderRight:isEnd?`3px solid ${vr.color}`:`1px solid ${vr.color}30`,
                          borderTop:`1px solid ${vr.color}30`,
                          borderBottom:`1px solid ${vr.color}30`,
                          borderRadius:isStart&&isEnd?"4px":isStart?"4px 0 0 4px":isEnd?"0 4px 4px 0":"0",
                          cursor:"pointer",overflow:"hidden",
                          display:"flex",flexDirection:"column",justifyContent:"center",padding:"1px 3px",
                        }} onClick={()=>setDetailBooking(bk)}>
                          {(vr.type==="taxi"||isStart||di===0)&&<>
                            {nickname&&<div style={{fontSize:11,fontWeight:800,color:vr.color,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.2}}>{nickname}</div>}
                            <div style={{fontSize:10,fontWeight:600,color:vr.color+"bb",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.2}}>{allCatNames}</div>
                          </>}
                        </div>);
                      })}
                    </div>);
                  }
                  return(<div key={d} style={{
                    width:68,flexShrink:0,height:rowH,
                    background:vr.bg,
                    borderRight:`1px solid ${isMonth1?"#bbb":C.borderLight}`,
                    borderLeft:isMonth1?"2px solid #bbb":"none",
                  }}/>);
                })}
              </div>
            </div>);
          })}
        </div>
      </div>
    </div>

    {/* ── Today's Occupancy Summary ── */}
    <div style={{...S.sec,marginTop:16,paddingBottom:0}}>
      <div style={S.slabel}>Today's Rooms — {fmt(todayStr)}</div>
      {zones.map(zone=>{
        const zRooms=ROOMS.filter(r=>r.zone===zone);
        return(<div key={zone} style={{...S.cardPad,marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:800,color:ZONE_COLORS[zone],marginBottom:10}}>Zone {zone}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(80px,1fr))",gap:8}}>
            {zRooms.map(room=>{
              const b=getBookingForRoomDate(room.id,todayStr);
              const cust=b?customers.find(c=>c.id===b.customerId):null;
              const cats=b?(cust?.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id)):[];
              const allCatNames=cats.map(c=>c.name).join(", ")||b?.catName||null;
              const nickname=cust?.nickname||null;
              const isHome=b?.size==="H";
              const hasTaxi=b?.petTaxiAmt>0;
              return(<div key={room.id} style={{borderRadius:10,padding:"8px 10px",background:b?(isHome?"#f3e5f5":getRoomColor(room.id)+"18"):C.bg,border:`1px solid ${b?(isHome?"#9c27b040":getRoomColor(room.id)+"40"):C.border}`,textAlign:"center",cursor:b?"pointer":"default"}} onClick={()=>b&&setDetailBooking(b)}>
                <div style={{fontSize:14,fontWeight:800,color:b?(isHome?"#7b1fa2":getRoomColor(room.id)):C.text2}}>{room.label}</div>
                {b?(
                  <>
                    {nickname&&<div style={{fontSize:12,marginTop:2,color:isHome?"#7b1fa2":getRoomColor(room.id),fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nickname}{isHome?" 🏡":""}{hasTaxi?" Taxi":""}</div>}
                    <div style={{fontSize:12,color:(isHome?"#9c27b0":getRoomColor(room.id))+"aa",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{allCatNames||"Occupied"}</div>
                  </>
                ):<div style={{fontSize:12,marginTop:2,color:C.text3,fontWeight:600}}>Free</div>}
              </div>);
            })}
          </div>
        </div>);
      })}
    </div>

    {/* ── Year Quick Jump ── */}
    <div style={{...S.sec,marginTop:16,paddingBottom:16}}>
      <div style={S.slabel}>Jump to Year</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {[2018,2019,2020,2021,2022,2023,2024,2025,2026,2027,2028,2029,2030].map(yr=>{
          const curYear=new Date(viewDate+"T12:00:00").getFullYear();
          const isNow=new Date().getFullYear()===yr;
          return(<button key={yr} style={{padding:"8px 14px",background:curYear===yr?C.text:(isNow?C.accentBg:C.bg),color:curYear===yr?"#fff":(isNow?C.accent:C.text2),border:`1px solid ${curYear===yr?C.text:(isNow?C.accent+"50":C.border)}`,borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:curYear===yr||isNow?700:500,cursor:"pointer"}} onClick={()=>setViewDate(`${yr}-01-01`)}>
            {yr}{isNow?" ★":""}
          </button>);
        })}
      </div>
    </div>
    {detailBooking&&(
      <div style={S.overlay} onClick={()=>setDetailBooking(null)}>
        <div style={{...S.sheet,maxHeight:"60vh",position:"relative"}} onClick={e=>e.stopPropagation()}>
          <div style={S.sheetHandle}/>
          {/* X close button top-right */}
          <button onClick={()=>setDetailBooking(null)} style={{position:"absolute",top:14,right:16,width:30,height:30,borderRadius:"50%",background:C.bg,border:`1px solid ${C.border}`,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:C.text2,fontFamily:"inherit",zIndex:10}}>✕</button>
          <div style={{padding:"16px 20px"}}>
            {(()=>{
              const b=detailBooking;
              const cust=customers.find(c=>c.id===b.customerId)||{};
              const cats=(cust.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
              const catNames=cats.map(c=>c.name).join(", ")||b.catName||"Cat";
              const n=nights(b.checkin,b.checkout);
              const room=ROOMS.find(r=>r.id===b.roomId);
              return(<>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                  <div style={{background:room?getRoomColor(room.id)+"18":C.accentBg,borderRadius:12,padding:"10px 14px",textAlign:"center",flexShrink:0}}>
                    <div style={{fontSize:16,fontWeight:800,color:room?getRoomColor(room.id):C.accent}}>{b.roomId||b.size}</div>
                    <div style={{fontSize:12,color:C.text,marginTop:2}}>{b.size} room</div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:16,fontWeight:800}}>{cust.nickname||"?"} <span style={{fontSize:16,fontWeight:600,color:C.text}}>({catNames})</span></div>
                    <div style={{fontSize:14,color:C.text}}>
                      <div>{fmt(b.checkin)} → {fmt(b.checkout)}</div>
                      <div>{n} night{n>1?"s":""}</div>
                    </div>
                  </div>
                  <div style={{fontSize:18,fontWeight:800,color:C.accent}}>฿{(b.net||0).toLocaleString()}</div>
                </div>
                {/* Booking notes */}
                {b.notes&&(
                  <div style={{background:"#f0f6ff",borderRadius:10,padding:"8px 12px",marginBottom:8,border:"1px solid #0071e320"}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.blue,marginBottom:2}}>📋 Booking Notes</div>
                    <NotesText text={b.notes} style={{fontSize:12,color:C.text2,lineHeight:1.5}}/>
                  </div>
                )}
                {/* Customer notes */}
                {cust.notes&&(
                  <div style={{background:"#fffbf0",borderRadius:10,padding:"8px 12px",marginBottom:10,border:"1px solid #ffd70040"}}>
                    <div style={{fontSize:13,fontWeight:700,color:C.orange,marginBottom:2}}>📝 Customer Notes</div>
                    <NotesText text={cust.notes} style={{fontSize:14,color:C.text2,lineHeight:1.5}}/>
                  </div>
                )}
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
                  <span style={{...S.chip(b.paid?C.green:C.orange),fontSize:13,padding:"5px 11px"}}>{b.paid?"✓ Paid":"Unpaid"}</span>
                  <span style={{...S.chip(C.blue),fontSize:13,padding:"5px 11px"}}>{b.payMethod}</span>
                  {b.discount>0&&<span style={{...S.chip(C.red),fontSize:13,padding:"5px 11px"}}>-{b.discount}%</span>}
                  {b.size==="H"&&<span style={{...S.chip("#7b1fa2"),fontSize:13,padding:"5px 11px"}}>@Home</span>}
                  {b.litter&&<span style={{...S.chip(C.blue),fontSize:13,padding:"5px 11px"}}>🪣 ทราย</span>}
                  {b.petTaxiAmt>0&&<span style={{...S.chip("#7b1fa2"),fontSize:13,padding:"5px 11px"}}>🚕{b.petTaxiDay==="checkout"?" ส่ง":b.petTaxiDay==="both"?" รับ+ส่ง":" รับ"} ฿{fmt2(b.petTaxiAmt)}</span>}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:4}}>
                  <button style={{padding:"12px 6px",background:C.accent,color:"#fff",border:"none",borderRadius:12,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}} onClick={()=>{setEditBooking(b);setDetailBooking(null);}}>
                    <span style={{fontSize:18}}>✏️</span><span>Edit</span>
                  </button>
                  <button style={{padding:"12px 6px",background:"#f0fff4",color:C.green,border:`1px solid ${C.green}30`,borderRadius:12,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}} onClick={()=>{setEditBooking({...b,id:uid(),checkin:"",checkout:"",roomId:"",roomIds:[]});setDetailBooking(null);}}>
                    <span style={{fontSize:18}}>⧉</span><span>Duplicate</span>
                  </button>
                  <button style={{padding:"12px 6px",background:"#fff8f0",color:C.orange,border:`1px solid ${C.orange}30`,borderRadius:12,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}} onClick={()=>{onShowReceipt(b,"receipt");setDetailBooking(null);}}>
                    <span style={{fontSize:18}}>🧾</span><span>Receipt</span>
                  </button>
                  <button style={{padding:"12px 6px",background:"#f0f6ff",color:C.blue,border:`1px solid ${C.blue}30`,borderRadius:12,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}} onClick={()=>{exportICS(b,customers);setToast("iCal downloaded!");}}>
                    <span style={{fontSize:18}}>📅</span><span>iCal</span>
                  </button>
                  <button style={{padding:"12px 6px",background:"#fff5f5",color:C.red,border:`1px solid ${C.red}30`,borderRadius:12,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,gridColumn:"2/4"}} onClick={async()=>{await onDeleteBooking(b.id);setDetailBooking(null);}}>
                    <span style={{fontSize:18}}>🗑</span><span>Delete</span>
                  </button>
                </div>
              </>);
            })()}
          </div>
        </div>
      </div>
    )}
    {editBooking&&<BookingSheet booking={editBooking} customers={customers} bookings={bookings} onSave={async d=>{await onSaveBooking(d);setEditBooking(null);setToast("Saved ☁️");}} onClose={()=>setEditBooking(null)}/>}
  </div>);
}

// ════════════════════════════════════════════════════════════════
// RECEIPT / QUOTE MODAL
// ════════════════════════════════════════════════════════════════
function ReceiptModal({booking, customers, mode, receiptNum, onClose}){
  const [lang,setLang]=useState("th");
  const cust=customers.find(c=>c.id===booking.customerId)||{};
  const cats=(cust.cats||[]).filter(c=>(booking.selectedCatIds||[]).includes(c.id));
  const catNames=cats.map(c=>c.name).join(", ")||booking.catName||"Cat";
  const n=nights(booking.checkin,booking.checkout);
  const rooms=(booking.roomIds&&booking.roomIds.length>0)?booking.roomIds:[booking.roomId].filter(Boolean);
  const isReceipt=mode==="receipt";

  const T={
    th:{
      title:isReceipt?"ใบเสร็จรับเงิน":"ใบเสนอราคา",
      no:isReceipt?"เลขที่ใบเสร็จ":"เลขที่ใบเสนอราคา",
      date:"วันที่",
      customer:"ลูกค้า",
      cat:"แมว",
      room:"ห้อง",
      checkin:"เช็คอิน",
      checkout:"เช็คเอาต์",
      nights:"จำนวนคืน",
      roomRate:"ค่าห้องพัก",
      extraCat:"ค่าแมวเพิ่ม",
      litter:"ค่าทรายแมว",
      subtotal:"ราคาก่อนลด",
      discount:"ส่วนลด",
      total:"ยอดรวมสุทธิ",
      deposit:"มัดจำแล้ว",
      remaining:"ยอดค้างชำระ",
      payMethod:"วิธีชำระเงิน",
      paid:"ชำระแล้ว ✓",
      unpaid:"ยังไม่ชำระ",
      scanPay:"สแกนจ่าย PromptPay",
      footer:"ขอบคุณที่ไว้วางใจ Catwalk Hotel 🐱",
      night:"คืน",
      rooms:"ห้อง",
    },
    en:{
      title:isReceipt?"Receipt":"Quotation",
      no:isReceipt?"Receipt No.":"Quote No.",
      date:"Date",
      customer:"Customer",
      cat:"Cat(s)",
      room:"Room(s)",
      checkin:"Check-in",
      checkout:"Check-out",
      nights:"Nights",
      roomRate:"Room Rate",
      extraCat:"Extra Cat",
      litter:"Cat Litter",
      subtotal:"Subtotal",
      discount:"Discount",
      total:"Net Total",
      deposit:"Deposit Paid",
      remaining:"Balance Due",
      payMethod:"Payment",
      paid:"Paid ✓",
      unpaid:"Unpaid",
      scanPay:"Scan to Pay (PromptPay)",
      footer:"Thank you for choosing Catwalk Hotel 🐱",
      night:"night(s)",
      rooms:"room(s)",
    }
  };
  const t=T[lang];
  const today_str=fmt(new Date().toISOString().split("T")[0]);

  // Price breakdown
  const numCats=Math.max(booking.selectedCatIds?.length||1,1);
  const extraCatsPerRoom=Math.max(0,numCats-1);
  const extraCats=extraCatsPerRoom*rooms.length;
  const isHomeBooking=booking.size==="H";
  const bookingPricePerNight=getBookingPricePerNight(booking);
  const basePerRoom=isHomeBooking?(booking.homePriceTotal||booking.homePricePerNight||0):n*bookingPricePerNight;
  const baseTotal=basePerRoom*rooms.length;
  const extraCatAmt=extraCats*n*EXTRA_CAT_FEE;
  const litterAmt=booking.litter?getLitterAmt(n,numCats,booking.checkin):0;
  const subtotal=baseTotal+extraCatAmt+litterAmt;
  const discAmt=Math.round(subtotal*(parseFloat(booking.discount)||0)/100);
  const net=subtotal-discAmt;
  const deposit=booking.depositAmt||0;
  const remaining=Math.max(0,net-deposit);

  const docNum=`CW-${new Date().getFullYear()}-${String(receiptNum).padStart(4,"0")}`;

  const handlePrint=()=>{
    const printArea=document.getElementById("receipt-print-area");
    const win=window.open("","_blank","width=800,height=1000");
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Helvetica Neue',Helvetica,'Sukhumvit Set',sans-serif;background:#fff;padding:20px;}
        @media print{body{padding:0;}}
        @page{size:A5;margin:10mm;}
      </style>
      </head><body>${printArea.innerHTML}</body></html>`);
    win.document.close();
    setTimeout(()=>{win.print();},400);
  };

  // Row helper
  const Row=({label,value,bold,color,indent})=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"4px 0",borderBottom:"1px solid #f0f0f0",paddingLeft:indent?16:0}}>
      <span style={{fontSize:12,color:color||"#555",fontWeight:bold?"700":"400"}}>{label}</span>
      <span style={{fontSize:12,color:color||"#333",fontWeight:bold?"700":"600",textAlign:"right"}}>{value}</span>
    </div>
  );

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:500,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 0"}}>
      <div style={{background:"#f5f5f5",borderRadius:16,width:"100%",maxWidth:480,margin:"0 16px"}}>

        {/* Toolbar */}
        <div style={{padding:"12px 16px",display:"flex",gap:8,alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",gap:6}}>
            <button style={{padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700,background:lang==="th"?"#1a1a1a":"#e0e0e0",color:lang==="th"?"#fff":"#333"}} onClick={()=>setLang("th")}>ไทย</button>
            <button style={{padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700,background:lang==="en"?"#1a1a1a":"#e0e0e0",color:lang==="en"?"#fff":"#333"}} onClick={()=>setLang("en")}>EN</button>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button style={{padding:"7px 14px",borderRadius:20,background:"#ff383c",color:"#fff",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}} onClick={handlePrint}>🖨 Print / Save PDF</button>
            <button style={{padding:"7px 12px",borderRadius:20,background:"#e0e0e0",color:"#333",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}} onClick={onClose}>✕</button>
          </div>
        </div>

        {/* Document */}
        <div id="receipt-print-area" style={{background:"#fff",margin:"0 12px 12px",borderRadius:12,overflow:"hidden",boxShadow:"0 2px 20px rgba(0,0,0,0.1)"}}>

          {/* Header */}
          <div style={{background:"#1a1a1a",padding:"20px 24px",display:"flex",alignItems:"center",gap:16}}>
            <img src={CATWALK_LOGO} style={{width:56,height:56,borderRadius:10,objectFit:"contain",background:"#fff",padding:4}} alt="logo"/>
            <div>
              <div style={{fontSize:18,fontWeight:800,color:"#fff",letterSpacing:"0.05em"}}>CATWALK HOTEL</div>
              <div style={{fontSize:11,color:"#ccc",marginTop:2}}>แคทวอร์ค โฮเท็ล</div>
              <div style={{fontSize:10,color:"#999",marginTop:2}}>📞 {CATWALK_INFO.phone} · {CATWALK_INFO.hours}</div>
            </div>
          </div>

          {/* Doc type banner */}
          <div style={{background:isReceipt?"#ff383c":"#0071e3",padding:"8px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:15,fontWeight:800,color:"#fff",letterSpacing:"0.05em"}}>{t.title}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",textAlign:"right"}}>
              <div>{t.no}: {docNum}</div>
              <div>{t.date}: {today_str}</div>
            </div>
          </div>

          <div style={{padding:"16px 20px"}}>
            {/* Customer info */}
            <div style={{background:"#fafafa",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                <div><div style={{fontSize:10,fontWeight:700,color:"#999",marginBottom:2}}>{t.customer.toUpperCase()}</div><div style={{fontSize:13,fontWeight:700}}>{cust.nickname||"—"}</div></div>
                <div><div style={{fontSize:10,fontWeight:700,color:"#999",marginBottom:2}}>{t.cat.toUpperCase()}</div><div style={{fontSize:13,fontWeight:700}}>{catNames}</div></div>
                <div><div style={{fontSize:10,fontWeight:700,color:"#999",marginBottom:2}}>{t.room.toUpperCase()}</div><div style={{fontSize:13,fontWeight:700}}>{rooms.join(", ")||"—"}</div></div>
                <div><div style={{fontSize:10,fontWeight:700,color:"#999",marginBottom:2}}>{t.nights.toUpperCase()}</div><div style={{fontSize:13,fontWeight:700}}>{n} {t.night}</div></div>
                <div><div style={{fontSize:10,fontWeight:700,color:"#999",marginBottom:2}}>{t.checkin.toUpperCase()}</div><div style={{fontSize:12}}>{fmt(booking.checkin)}</div></div>
                <div><div style={{fontSize:10,fontWeight:700,color:"#999",marginBottom:2}}>{t.checkout.toUpperCase()}</div><div style={{fontSize:12}}>{fmt(booking.checkout)}</div></div>
              </div>
            </div>

            {/* Price breakdown */}
            <div style={{marginBottom:14}}>
              {rooms.map((r,i)=>(
                <Row key={r} label={`${t.roomRate} ${r} (${n} ${t.night} × ฿${bookingPricePerNight.toLocaleString()})`} value={`฿${fmt2(basePerRoom)}`}/>
              ))}
              {extraCats>0&&<Row label={`${t.extraCat} (${extraCats} × ${n} ${t.night} × ฿${EXTRA_CAT_FEE})`} value={`฿${fmt2(extraCatAmt)}`}/>}
              {litterAmt>0&&<Row label={`${t.litter} (${getLitterLabel(n,numCats,booking.checkin)})`} value={`฿${fmt2(litterAmt)}`}/>}
              {discAmt>0&&(
                <>
                  <Row label={t.subtotal} value={`฿${fmt2(subtotal)}`}/>
                  <Row label={`${t.discount} ${booking.discount}%`} value={`-฿${fmt2(discAmt)}`} color="#e53935"/>
                </>
              )}
              {/* Total */}
              <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:"2px solid #1a1a1a",marginTop:4}}>
                <span style={{fontSize:14,fontWeight:800}}>{t.total}</span>
                <span style={{fontSize:16,fontWeight:800,color:"#ff383c"}}>฿{fmt2(net)}</span>
              </div>
              {deposit>0&&<Row label={t.deposit} value={`฿${fmt2(deposit)}${booking.depositPayMethod&&booking.depositPayMethod!=="Transfer"?" ("+booking.depositPayMethod+")":""}`} color="#2e7d32"/>}
              {remaining>0&&<Row label={t.remaining} value={`฿${fmt2(remaining)}`} bold color="#e53935"/>}
              {remaining===0&&<Row label={t.paid} value={`฿${fmt2(net)}`} bold color="#2e7d32"/>}
              <Row label={t.payMethod} value={booking.payMethod||"—"}/>
              {(booking.payMethod==="Credit Card"||booking.petTaxiAmt>0)&&(()=>{
                const ccFee=booking.payMethod==="Credit Card"?parseFloat((net*CREDIT_CARD_FEE_PCT/100).toFixed(2)):0;
                const taxi=booking.petTaxiAmt||0;
                const shopNet=net-ccFee-taxi;
                return(
                  <div style={{background:"#fff8f0",borderRadius:8,padding:"8px 10px",marginTop:6,border:"1px solid #ff950030"}}>
                    {ccFee>0&&(
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                        <span style={{fontSize:13,color:"#e65100"}}>💳 {lang==="th"?`ค่าธรรมเนียม Credit Card (${CREDIT_CARD_FEE_PCT}%)`:`Credit Card Fee (${CREDIT_CARD_FEE_PCT}%)`}</span>
                        <span style={{fontSize:13,fontWeight:700,color:"#e65100"}}>-฿{fmt2(ccFee)}</span>
                      </div>
                    )}
                    {taxi>0&&(
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                        <span style={{fontSize:11,color:"#2563eb"}}>🚗 {lang==="th"?"หัก Pet Taxi":"Pet Taxi deducted"}</span>
                        <span style={{fontSize:11,fontWeight:700,color:"#2563eb"}}>-฿{fmt2(taxi)}</span>
                      </div>
                    )}
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <span style={{fontSize:12,fontWeight:700,color:"#555"}}>{lang==="th"?"รายได้จริงที่ได้รับ":"Actual Revenue"}</span>
                      <span style={{fontSize:13,fontWeight:800,color:"#2e7d32"}}>฿{fmt2(shopNet)}</span>
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* QR Payment */}
            <div style={{border:"1px solid #e0e0e0",borderRadius:10,padding:"12px",textAlign:"center",marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:"#999",marginBottom:8}}>{t.scanPay}</div>
              <img src={CATWALK_QR} style={{width:140,height:"auto",objectFit:"cover",objectPosition:"center 20%",clipPath:"inset(18% 8% 38% 8%)",display:"block",margin:"0 auto -16px"}} alt="QR"/>
              <div style={{fontSize:10,color:"#999",marginTop:4}}>{CATWALK_INFO.bankName}</div>
            </div>

            {/* Address */}
            <div style={{fontSize:10,color:"#aaa",textAlign:"center",lineHeight:1.6,marginBottom:8}}>
              {CATWALK_INFO.address.split("\\n").map((l,i)=><div key={i}>{l}</div>)}
            </div>

            {/* Footer */}
            <div style={{textAlign:"center",fontSize:12,fontWeight:700,color:"#ff383c",padding:"8px 0",borderTop:"1px dashed #e0e0e0"}}>{t.footer}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// BOOKING FORM with room selector
// ════════════════════════════════════════════════════════════════
function BookingSheet({booking,customers,bookings,onSave,onClose}){
  const [form,setForm]=useState(booking||{customerId:"",selectedCatIds:[],checkin:"",checkout:"",size:"S",roomIds:[],extraRooms:[],discount:"0",discountItems:["rooms"],deposit:"0",depositPayMethod:"Transfer",payMethod:"Transfer",paid:false,litter:false,litterCustom:0,petTaxi:0,petTaxiDay:"checkin",extraFee:0,extraFeeNote:"",notes:""});
  const [custSearch,setCustSearch]=useState("");
  const [showCustList,setShowCustList]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const cust=customers.find(c=>c.id===form.customerId);
  const cats=cust?.cats||[];
  const numCats=form.selectedCatIds?.length||0;
  const isLegacySize=form.size==="L";
  const n=form.checkin&&form.checkout&&form.checkin<=form.checkout?nights(form.checkin,form.checkout):0;
  const selectedRooms=form.roomIds||[];
  const numRooms=Math.max(selectedRooms.length,1);
  const petTaxiAmt=Math.max(0,parseFloat(form.petTaxi)||0);
  const extraFeeAmt=Math.max(0,parseFloat(form.extraFee)||0);
  const homePriceLump=Math.max(0,parseFloat(form.homePrice)||0); // total price, not per-night
  const pricingDate=form.checkin||booking?.checkin||today();
  const getPriceForSize=sz=>sz==="H"?0:getPriceForDate(pricingDate,sz); // @Home handled separately
  // catPerRoom: {roomId: numCats} — default spread cats evenly, user can adjust
  const catPerRoom=form.catPerRoom||{};
  const getCatsForRoom=rid=>{
    const stored=parseInt(catPerRoom[rid]);
    if(Number.isFinite(stored)&&stored>0) return stored;
    if((selectedRooms||[]).length===1) return Math.max(1,numCats);
    return 1;
  };
  // Litter fee (period-aware; user can override via litterCustom)
  const _litterPeriod=getLitterFeeForDate(pricingDate);
  // Price = sum of each room with its own cat count + pet taxi
  const calcRoomNet=(rid)=>{
    const r=ROOMS.find(x=>x.id===rid);
    const sz=r?.type||form.size;
    const pricePerNight=getPriceForSize(sz);
    const roomCats=getCatsForRoom(rid);
    const extraCats=Math.max(0,roomCats-1);
    const la=form.litter?getLitterAmt(n,roomCats,pricingDate):0;
    const base=n*(pricePerNight+extraCats*EXTRA_CAT_FEE)+la;
    const discAmt2=parseFloat((base*(parseFloat(form.discount)||0)/100).toFixed(2));
    return{net:parseFloat((base-discAmt2).toFixed(2)),base,extraCats,roomCats,la,pricePerNight};
  };
  const lCatsTotal=selectedRooms.length>0?selectedRooms.reduce((s,rid)=>s+getCatsForRoom(rid),0):Math.max(1,numCats);
  const lRoundsTotal=n>0?(_litterPeriod.basis==="perNight"?n:Math.ceil(n/6)):0;
  const suggestedLitterAmt=form.litter?getLitterAmt(n,lCatsTotal,pricingDate):0;
  const customLitterVal=parseFloat(form.litterCustom)||0;
  const totalLitterAmt=form.litter?(customLitterVal>0?customLitterVal:suggestedLitterAmt):0;
  // discount applies to (room base + litter + extraFee), petTaxi excluded from discount
  const disc=parseFloat(form.discount)||0;
  const roomBaseNoLitter=(rid)=>{
    if(rid==="@HOME") return homePriceLump;
    const r=calcRoomNet(rid);return n*(r.pricePerNight+r.extraCats*EXTRA_CAT_FEE);
  };
  // ── Extra Rooms helpers (must be before totalRoomBase) ──
  const extraRooms=form.extraRooms||[];
  const getExtraNights=(er)=>er.checkin&&er.checkout&&er.checkin<=er.checkout?nights(er.checkin,er.checkout):0;
  // Returns cat count for a room in an extra-room period.
  // Uses er.catPerRoom (stored on the extra room itself, NOT form.catPerRoom)
  // so stale values from when the room was a main room never interfere.
  const getExtraCatsForRoom=(er,rid)=>{
    const stored=parseInt((er.catPerRoom||{})[rid]);
    if(Number.isFinite(stored)&&stored>0) return stored;
    // Default: all cats move to this room if it's the only one in the period
    if((er.roomIds||[]).length===1) return Math.max(1,numCats);
    return 1;
  };
  const calcExtraRoomBase=(er)=>{
    const n2=getExtraNights(er);
    if(!n2) return 0;
    return (er.roomIds||[]).reduce((sum,rid)=>{
      const r=ROOMS.find(x=>x.id===rid);
      const sz=r?.type||er.size||"S";
      const ppn=getPriceForDate(er.checkin||pricingDate,sz)||0;
      const roomCats=getExtraCatsForRoom(er,rid);
      const extraCats=Math.max(0,roomCats-1);
      return sum+n2*(ppn+extraCats*EXTRA_CAT_FEE);
    },0);
  };
  const totalExtraRoomsBase=extraRooms.reduce((sum,er)=>sum+(calcExtraRoomBase(er)||0),0)||0;
  const totalRoomBase=parseFloat(((selectedRooms.length>0?selectedRooms.reduce((sum,rid)=>sum+(roomBaseNoLitter(rid)||0),0):(n>0&&numCats>0&&form.size!=="H"?(()=>{const p=calcPrice(n,form.size,numCats,0,false,pricingDate);return p.base||0;})():homePriceLump))+(totalExtraRoomsBase||0)).toFixed(2))||0;
  const discItems=form.discountItems||["rooms"];
  const discBase=(discItems.includes("rooms")?totalRoomBase:0)+(discItems.includes("litter")?totalLitterAmt:0)+(discItems.includes("other")?extraFeeAmt:0)+(discItems.includes("taxi")?petTaxiAmt:0);
  const nonDiscBase=(discItems.includes("rooms")?0:totalRoomBase)+(discItems.includes("litter")?0:totalLitterAmt)+(discItems.includes("other")?0:extraFeeAmt)+(discItems.includes("taxi")?0:petTaxiAmt);
  const discountableBase=discBase;
  const discAmt2=parseFloat((discBase*disc/100).toFixed(2));
  const totalNet=parseFloat((discBase-discAmt2+nonDiscBase).toFixed(2));
  const net=totalNet;
  const isCreditCard=form.payMethod==="Credit Card";
  // base = room+litter before discount; discAmt = actual discount amount (room+litter)
  const base=discountableBase;
  const discAmt=discAmt2;
  const {litterAmt,litterWeeks}=n>0&&numCats>0?calcPrice(n,form.size,numCats,0,form.litter,pricingDate):{litterAmt:0,litterWeeks:0};
  const depositAmt=Math.max(0,parseFloat(form.deposit)||0);
  const depositCcFee=form.depositPayMethod==="Credit Card"&&depositAmt>0?parseFloat((depositAmt*CREDIT_CARD_FEE_PCT/100).toFixed(2)):0;
  const remaining=parseFloat(Math.max(0,net-depositAmt).toFixed(2));
  const ccFeeAmt=isCreditCard&&remaining>0?parseFloat((remaining*CREDIT_CARD_FEE_PCT/100).toFixed(2)):0;
  const shopReceives=parseFloat((remaining-ccFeeAmt).toFixed(2));
  const toggleRoom=id=>{
    const ids=form.roomIds||[];
    set("roomIds",ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);
  };

  // ── Extra Rooms helpers (UI actions) ──
  const addExtraRoom=()=>{
    const er={id:uid(),size:"S",roomIds:[],checkin:form.checkin||"",checkout:form.checkout||""};
    set("extraRooms",[...extraRooms,er]);
  };
  const removeExtraRoom=(eid)=>set("extraRooms",extraRooms.filter(e=>e.id!==eid));
  const updateExtraRoom=(eid,patch)=>set("extraRooms",extraRooms.map(e=>e.id===eid?{...e,...patch}:e));
  const valid=form.customerId&&form.selectedCatIds?.length>0&&form.checkin&&form.checkout&&form.checkin<=form.checkout&&(isLegacySize||(form.roomIds||[]).length>0);
  const toggleCat=id=>{const ids=form.selectedCatIds||[];set("selectedCatIds",ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);};
  useEffect(()=>{if(cust&&!booking)set("selectedCatIds",cats.length>0?[cats[0].id]:[]);},[form.customerId]);

  // Available rooms for selected dates+type
  // For @Home (H): always available — use virtual @HOME room
  const availRooms=form.checkin&&form.checkout&&form.checkin<=form.checkout
    ? form.size==="H"
      ? [{id:"@HOME",zone:"special",type:"H",label:"@Home"}]
      : form.size==="L"
        ? [{id:"@LEGACY-L",zone:"legacy",type:"L",label:"Legacy L"}]
      : ROOMS.filter(r=>r.type===form.size&&isRoomAvailable(r.id,form.checkin,form.checkout,bookings,booking?.id))
    : [];
  // Auto-clear roomIds that are no longer available
  useEffect(()=>{
    if((form.roomIds||[]).length>0&&form.size!=="H"&&form.size!=="L"){
      const stillAvail=(form.roomIds||[]).filter(id=>availRooms.find(r=>r.id===id));
      if(stillAvail.length!==(form.roomIds||[]).length) set("roomIds",stillAvail);
    }
  },[form.checkin,form.checkout,form.size]);
  // Auto-select @HOME when H type selected with valid dates
  useEffect(()=>{
    if(form.size==="H"&&form.checkin&&form.checkout) set("roomIds",["@HOME"]);
  },[form.size,form.checkin,form.checkout]);
  // Keep legacy L bookings editable without reintroducing current L inventory
  useEffect(()=>{
    if(form.size==="L"&&form.checkin&&form.checkout) set("roomIds",["@LEGACY-L"]);
  },[form.size,form.checkin,form.checkout]);

  // Reset litterCustom when dates/cats change so suggested recalculates
  // Skip the very first render so saved litterCustom isn't wiped on edit
  const _litterResetInit=useRef(true);
  useEffect(()=>{
    if(_litterResetInit.current){_litterResetInit.current=false;return;}
    set("litterCustom",0);
  },[form.checkin,form.checkout,form.selectedCatIds,form.roomIds]);

  // backward compat: if old booking has roomId (string), convert
  useEffect(()=>{
    if(booking?.roomId&&!(booking?.roomIds?.length)){
      set("roomIds",[booking.roomId]);
    }
  },[]);

  return(<div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={S.sheet}>
      <div style={S.sheetHandle}/>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div style={S.sheetTitle}>{booking?"Edit Booking":"New Booking"}</div>
        <button style={S.btnG} onClick={onClose}>Cancel</button>
      </div>
      <div style={{padding:"0 16px"}}>
        {/* Customer — Searchable Picker */}
        {(()=>{
          const filteredCusts=customers.filter(c=>{
            if(!custSearch.trim()) return true;
            const s=custSearch.toLowerCase();
            return c.nickname.toLowerCase().includes(s)||(c.cats||[]).some(cat=>cat.name.toLowerCase().includes(s))||(c.phone||"").includes(s);
          });
          const selectedCust=customers.find(c=>c.id===form.customerId);
          return(
            <div style={S.fg}>
              <div style={S.lbl}>Customer *</div>
              {/* Selected display / search input */}
              <div style={{border:`1px solid ${form.customerId?C.accent:C.border}`,borderRadius:12,overflow:"hidden",background:C.white}}>
                <div style={{display:"flex",alignItems:"center",padding:"0 12px",gap:8}}>
                  {selectedCust&&!showCustList&&(
                    <div style={{display:"flex",alignItems:"center",gap:8,flex:1,padding:"10px 0"}}>
                      <div style={{fontSize:20}}>😺</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:700,color:C.accent}}>
                          {selectedCust.nickname} <span style={{fontWeight:500,color:C.text2}}>({(selectedCust.cats||[]).map(x=>x.name).join(", ")||"—"})</span>
                        </div>
                      </div>
                      <button style={{background:"none",border:"none",color:C.text3,fontSize:18,cursor:"pointer",padding:"4px"}} onClick={()=>{set("customerId","");setCustSearch("");setShowCustList(true);}}>✕</button>
                    </div>
                  )}
                  {(!selectedCust||showCustList)&&(
                    <input
                      style={{flex:1,border:"none",outline:"none",fontSize:14,padding:"12px 0",background:"transparent",fontFamily:"inherit"}}
                      placeholder="🔍 Search customer name or cat..."
                      value={custSearch}
                      autoFocus={showCustList}
                      onChange={e=>{setCustSearch(e.target.value);setShowCustList(true);}}
                      onFocus={()=>setShowCustList(true)}
                    />
                  )}
                </div>
                {/* Dropdown list */}
                {showCustList&&(
                  <div style={{borderTop:`1px solid ${C.borderLight}`,maxHeight:220,overflowY:"auto"}}>
                    {filteredCusts.length===0&&(
                      <div style={{padding:"12px 16px",fontSize:13,color:C.text3}}>No customers found</div>
                    )}
                    {filteredCusts.map(c=>(
                      <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:`1px solid ${C.borderLight}`,cursor:"pointer",background:form.customerId===c.id?C.accentBg:C.white}} onClick={()=>{set("customerId",c.id);setShowCustList(false);setCustSearch("");}}>
                        <div style={{display:"flex",flexShrink:0}}>
                          {(c.cats||[]).slice(0,2).map((cat,i)=>(
                            <div key={cat.id} style={{width:32,height:32,borderRadius:8,overflow:"hidden",background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,marginLeft:i>0?-8:0,border:`2px solid ${C.white}`}}>
                              {cat.photo?<img src={cat.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                            </div>
                          ))}
                          {(c.cats||[]).length===0&&<div style={{width:32,height:32,borderRadius:8,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>😺</div>}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:700,color:form.customerId===c.id?C.accent:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                            {c.nickname} <span style={{fontWeight:500,color:C.text3}}>({(c.cats||[]).map(x=>x.name).join(", ")||"—"})</span>
                          </div>
                          {c.phone&&<div style={{fontSize:11,color:C.text3}}>{c.phone}</div>}
                        </div>
                        {form.customerId===c.id&&<span style={{color:C.accent,fontSize:16}}>✓</span>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })()}
        {/* Cats */}
        {cust&&cats.length>0&&(
          <div style={S.fg}><div style={S.lbl}>Select Cat(s) *</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {cats.map((cat,i)=>{
                const sel=(form.selectedCatIds||[]).includes(cat.id);
                return(<div key={cat.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",border:`2px solid ${sel?C.accent:C.border}`,borderRadius:12,cursor:"pointer",background:sel?C.accentBg:C.white}} onClick={()=>toggleCat(cat.id)}>
                  <div style={{width:38,height:38,borderRadius:9,overflow:"hidden",flexShrink:0,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                    {cat.photo?<img src={cat.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                  </div>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{cat.name}</div><div style={{fontSize:11,color:C.text3}}>{cat.breed||"Cat"}</div></div>
                  {i>0&&<span style={S.chip(C.orange)}>+฿{EXTRA_CAT_FEE}/night</span>}
                  <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${sel?C.accent:C.border}`,background:sel?C.accent:"none",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,flexShrink:0}}>{sel?"✓":""}</div>
                </div>);
              })}
            </div>
          </div>
        )}
        {/* Date Range Picker */}
        <InfiniteScrollCalendar
          checkin={form.checkin}
          checkout={form.checkout}
          allowPast={true}
          onChange={({checkin,checkout})=>{set("checkin",checkin);set("checkout",checkout);}}
        />
        {/* Size */}
        <div style={S.fg}><div style={S.lbl}>Room Type</div>
          {isLegacySize&&(
              <div style={{marginBottom:8,padding:"10px 12px",background:"#fff8f0",border:`1px solid ${C.orange}30`,borderRadius:10,fontSize:14,color:C.text2}}>
              Booking นี้ใช้ห้องไซส์ <b>L</b> แบบย้อนหลัง ระบบยังเก็บและคำนวณราคาให้ได้ แต่จะไม่เปิดห้อง L เป็นตัวเลือกใหม่ในระบบปัจจุบัน
            </div>
          )}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {["S","M","H"].map(sz=><button key={sz} style={{padding:"11px",background:form.size===sz?C.text:C.bg,color:form.size===sz?"#fff":C.text2,border:`1px solid ${form.size===sz?C.text:C.border}`,borderRadius:10,fontFamily:"inherit",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}} onClick={()=>set("size",sz)}>
              <span style={{fontSize:14,fontWeight:800}}>{sz==="S"?"Room S":sz==="M"?"Room M":"@Home"}</span>
              <span style={{fontSize:12,fontWeight:600,opacity:0.8}}>{sz==="H"?"ราคากำหนดเอง":`฿${getPriceForSize(sz)}/night`}</span>
            </button>)}
          </div>
          {form.size==="H"&&(
            <div style={{marginTop:8}}>
              <input
                type="number"
                inputMode="numeric"
                pattern="[0-9]*"

              </div>

            {/* ส่วนลด */}
            {discAmt>0&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:13,color:C.red}}>🏷 ส่วนลด {form.discount}% ({(form.discountItems||["rooms"]).map(k=>k==="rooms"?"ห้อง":k==="litter"?"ทราย":k==="taxi"?"Taxi":"อื่นๆ").join("+")})</span>

                <span style={{fontSize:15,fontWeight:700,color:C.orange}}>-฿{fmt2(depositAmt)}</span>
              </div>
            )}

            {/* ยังต้องชำระ / ครบแล้ว */}
            {remaining>0?(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#fff5f5",borderRadius:8,border:"1px solid #ff3b3020",marginBottom:isCreditCard?0:0}}>
                <span style={{fontSize:14,fontWeight:800,color:C.red}}>ยังต้องชำระ</span>
                <span style={{fontSize:16,fontWeight:800,color:C.red}}>฿{fmt2(remaining)}</span>
              </div>
            ):(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:C.greenBg,borderRadius:8,border:`1px solid ${C.green}40`}}>
                <span style={{fontSize:14,fontWeight:800,color:C.green}}>✅ ชำระครบแล้ว</span>
                <span style={{fontSize:16,fontWeight:800,color:C.green}}>✓</span>
              </div>

            {/* ── CC fee + Pet Taxi section (internal) ── */}
            {(depositCcFee>0||ccFeeAmt>0||petTaxiAmt>0)&&(
              <div style={{marginTop:10,padding:"10px 12px",background:"#fff8f0",borderRadius:8,border:"1px solid #ff950030"}}>
