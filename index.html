async function fbLoad(col){ try{ const s=await db.collection(col).orderBy("createdAt","asc").get(); return s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ console.error(e); return []; } }
async function fbSave(col,id,data){
  const{id:_,...rest}=data;
  // Check estimated size — Firestore limit is 1MB per document
  const json=JSON.stringify(rest);
  if(json.length>800000){
    throw new Error(`Document too large (${Math.round(json.length/1024)}KB). รูปภาพใหญ่เกินไป`);

}

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ── Room Config ───────────────────────────────────────────────────────
const ROOMS = [
  {id:"A-S1",zone:"A",type:"S",label:"A-S1"},{id:"A-S2",zone:"A",type:"S",label:"A-S2"},
  {id:"A-S3",zone:"A",type:"S",label:"A-S3"},{id:"A-S4",zone:"A",type:"S",label:"A-S4"},
  {id:"A-S5",zone:"A",type:"S",label:"A-S5"},{id:"A-M1",zone:"A",type:"M",label:"A-M1"},
  {id:"A-M2",zone:"A",type:"M",label:"A-M2"},{id:"B-S6",zone:"B",type:"S",label:"B-S6"},
  {id:"B-S7",zone:"B",type:"S",label:"B-S7"},{id:"B-S8",zone:"B",type:"S",label:"B-S8"},
  {id:"B-S9",zone:"B",type:"S",label:"B-S9"},{id:"B-S10",zone:"B",type:"S",label:"B-S10"},
  {id:"C-S11",zone:"C",type:"S",label:"C-S11"},{id:"C-S12",zone:"C",type:"S",label:"C-S12"},
  {id:"C-S13",zone:"C",type:"S",label:"C-S13"},{id:"C-S14",zone:"C",type:"S",label:"C-S14"},
];
// สีแยกตามกลุ่มห้อง
const ROOM_COLOR_MAP = {
  "A-S": "#ff383c",
  "A-M": "#cb30e0",
  "B-S": "#ff8d28",
  "C-S": "#481a29",
};
// ── NotesText — render URLs as clickable links ────────────────
function NotesText({text,style}){
  if(!text) return null;
  const urlRegex=/(https?:\/\/[^\s]+|www\.[^\s]+)/g;
  const parts=text.split(urlRegex);
  return(
    <span style={style}>
      {parts.map((part,i)=>{
        if(urlRegex.test(part)){
          urlRegex.lastIndex=0;
          const href=part.startsWith("http")?part:"https://"+part;
          return <a key={i} href={href} target="_blank" rel="noopener noreferrer" style={{color:"#0071e3",textDecoration:"underline",wordBreak:"break-all"}} onClick={e=>e.stopPropagation()}>{part}</a>;
        }
        return <span key={i}>{part}</span>;
      })}
    </span>
  );
}

function getRoomColor(roomId){
  if(!roomId) return "#888";
  if(roomId.startsWith("A-S")) return ROOM_COLOR_MAP["A-S"];
  if(roomId.startsWith("A-M")) return ROOM_COLOR_MAP["A-M"];
  if(roomId.startsWith("B-S")) return ROOM_COLOR_MAP["B-S"];
  if(roomId.startsWith("C-S")) return ROOM_COLOR_MAP["C-S"];
  return "#888";
}
function getRoomBg(roomId){
  return getRoomColor(roomId)+"18";
}
// Zone fallback colors (for zone label rows)
const ZONE_COLORS = {
  A: "#ff383c",
  B: "#ff8d28",
  C: "#481a29",
};
const ZONE_BG = {
  A: "#ff383c18",
  B: "#ff8d2818",
  C: "#481a2918",
};
const PRICES = {S:350,M:450};
const EXTRA_CAT_FEE = 50;
const LITTER_FEE = 60; // per week
const PAY_METHODS = ["Cash","Transfer","Credit Card","QR Code"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS_SHORT=["Su","Mo","Tu","We","Th","Fr","Sa"];

// ── Helpers ───────────────────────────────────────────────────────────
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().split("T")[0];
const fmt=(d)=>{ if(!d) return"—"; const x=new Date(d+"T12:00:00"); return`${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const fmtShort=(d)=>{ if(!d) return"—"; const x=new Date(d+"T12:00:00"); return`${x.getDate()}/${x.getMonth()+1}`; };
const nights=(a,b)=>Math.max(1,Math.round((new Date(b)-new Date(a))/(864e5)));
const addDays=(d,n)=>{ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.toISOString().split("T")[0]; };
const calcPrice=(n,size,numCats,discount,litter)=>{
  const litterWeeks=litter?Math.ceil(n/7):0;
  const litterAmt=litterWeeks*LITTER_FEE;
  const base=n*(PRICES[size]+Math.max(0,numCats-1)*EXTRA_CAT_FEE)+litterAmt;
  const discAmt=Math.round(base*(parseFloat(discount)||0)/100);
  return{base,discAmt,net:base-discAmt,litterAmt,litterWeeks};
};
const newCat=()=>({id:uid(),name:"",breed:"",photo:"",vaccinePassport:"",notes:""});

// ── Room availability ─────────────────────────────────────────────────
function getRoomBookings(roomId, bookings) {
  return bookings.filter(b => b.roomId === roomId || (b.roomIds||[]).includes(roomId));
}
function isRoomAvailable(roomId, checkin, checkout, bookings, excludeId=null) {
  const rb = getRoomBookings(roomId, bookings).filter(b => b.id !== excludeId);
  for (const b of rb) {
    // checkout day is occupied, so new checkin must be after existing checkout
    if (b.checkin < checkout && b.checkout >= checkin) return false;
  }
  return true;
}
function getAvailableRooms(type, checkin, checkout, bookings, excludeId=null) {
  return ROOMS.filter(r => r.type === type && isRoomAvailable(r.id, checkin, checkout, bookings, excludeId));
}

// ── CSV helpers ───────────────────────────────────────────────────────
function dlCSV(rows,fn){ const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"})); a.download=fn; a.click(); }
function exportBookingsCSV(bookings,customers){
  const h=["Booking ID","Owner","Phone","Cats","Room","Check-in","Check-out","Nights","Size","Num Cats","Base","Disc%","Disc Amt","Litter Amt","Net Total","Deposit","Remaining","Payment","Paid","Created"];
  const rows=bookings.map(b=>{ const c=customers.find(x=>x.id===b.customerId)||{}; const n=nights(b.checkin,b.checkout); const nc=b.selectedCatIds?.length||1; const{base,discAmt,net,litterAmt}=calcPrice(n,b.size,nc,b.discount,b.litter); const cats=(b.selectedCatIds||[]).map(id=>(c.cats||[]).find(cat=>cat.id===id)?.name||"").filter(Boolean).join(", ")||b.catName||""; const dep=b.depositAmt||0; const rem=b.paid?0:(b.remaining||Math.max(0,net-dep)); return[b.id,c.nickname||"",c.phone||"",cats,b.roomId||"",b.checkin,b.checkout,n,b.size,nc,base,b.discount||0,discAmt,b.litter?litterAmt:0,net,dep,rem,b.payMethod,b.paid?"Yes":"No",b.createdAt?.split("T")[0]||""]; });
  dlCSV([h,...rows],`cat-hotel-bookings-${today()}.csv`);
}
function exportCustomersCSV(customers,bookings){
  const h=["ID","Nickname","Full Name","Phone","Line","Address","ID Card","Registered","Cat1","Breed1","Vax1","Cat2","Breed2","Vax2","Cat3","Breed3","Vax3","Bookings","Spent"];
  const rows=customers.map(c=>{ const cb=bookings.filter(b=>b.customerId===c.id); const spent=cb.reduce((a,b)=>a+(b.net||0),0); const cats=c.cats||[]; const cc=[0,1,2].flatMap(i=>[cats[i]?.name||"",cats[i]?.breed||"",cats[i]?.vaccinePassport?"Yes":"No"]); return[c.id,c.nickname||"",c.fullname||"",c.phone||"",c.line||"",c.address||"",c.idCard?"Yes":"No",c.createdAt?.split("T")[0]||"",...cc,cb.length,spent]; });
  dlCSV([h,...rows],`cat-hotel-customers-${today()}.csv`);
}

// ── ICS / Calendar ────────────────────────────────────────────────────
const toICS=d=>d.replace(/-/g,"");
function exportICS(b,customers){ const c=customers.find(x=>x.id===b.customerId)||{}; const cats=(c.cats||[]).filter(x=>(b.selectedCatIds||[]).includes(x.id)); const names=cats.map(x=>x.name).join(", ")||b.catName||"Cat"; const n=nights(b.checkin,b.checkout); const desc=`Owner: ${c.nickname||""}\\nRoom: ${b.roomId||b.size}\\nCats: ${names}\\n${n} nights · ฿${(b.net||0).toLocaleString()}\\nPayment: ${b.payMethod}${b.paid?" ✓":" (unpaid)"}`; const ts=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"; const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cat Hotel//EN","METHOD:PUBLISH","BEGIN:VEVENT",`UID:ci-${b.id}@cathotel`,`DTSTAMP:${ts}`,`DTSTART;VALUE=DATE:${toICS(b.checkin)}`,`DTEND;VALUE=DATE:${toICS(b.checkin)}`,`SUMMARY:🐱 ${names} – Check-in (${b.roomId||b.size})`,`DESCRIPTION:${desc}`,"END:VEVENT","BEGIN:VEVENT",`UID:co-${b.id}@cathotel`,`DTSTAMP:${ts}`,`DTSTART;VALUE=DATE:${toICS(b.checkout)}`,`DTEND;VALUE=DATE:${toICS(b.checkout)}`,`SUMMARY:🐱 ${names} – Check-out (${b.roomId||b.size})`,`DESCRIPTION:${desc}`,"END:VEVENT","END:VCALENDAR"].join("\r\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download=`booking-${names.replace(/\s+/g,"-")}-${b.checkin}.ics`; a.click(); }
function openGCal(b,customers){ const c=customers.find(x=>x.id===b.customerId)||{}; const cats=(c.cats||[]).filter(x=>(b.selectedCatIds||[]).includes(x.id)); const names=cats.map(x=>x.name).join(", ")||b.catName||"Cat"; const n=nights(b.checkin,b.checkout); const title=encodeURIComponent(`🐱 ${names} – ${b.roomId||b.size} Cat Hotel`); const details=encodeURIComponent(`Owner: ${c.nickname||""}\nRoom: ${b.roomId||b.size}\nCats: ${names}\n${n} nights · ฿${(b.net||0).toLocaleString()}\nPayment: ${b.payMethod}${b.paid?" ✓":" (pending)"}`); window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${toICS(b.checkin)}/${toICS(b.checkout)}&details=${details}`,"_blank"); }

// ── FileUpload ────────────────────────────────────────────────────────
function FileUpload({value,onChange,label,icon}){
  const ref=useRef();
  const hf=e=>{
    const f=e.target.files[0];
    if(!f) return;
    // Compress image using canvas before saving
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=600; // max width/height px
        let w=img.width, h=img.height;
        if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} }
        else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        // Compress to JPEG quality 0.75 (~50-80KB typical)
        const compressed=canvas.toDataURL("image/jpeg",0.75);
        onChange(compressed);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  const isImg=value&&value.startsWith("data:image");
  return(<div style={{border:`1px dashed ${value?C.green:C.border}`,borderRadius:12,padding:"12px 14px",background:value?C.greenBg:C.bg,cursor:"pointer"}} onClick={()=>ref.current.click()}>
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      {isImg?<img src={value} style={{width:48,height:48,borderRadius:8,objectFit:"cover",flexShrink:0}} alt=""/>:<div style={{width:48,height:48,borderRadius:8,background:C.white,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{icon}</div>}
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:value?C.green:C.text2}}>{value?`✓ ${label} uploaded`:`Upload ${label}`}</div><div style={{fontSize:11,color:C.text3,marginTop:2}}>Tap to {value?"change":"select"}</div></div>
      {value&&<button style={{...S.btnD,fontSize:11,padding:"5px 10px"}} onClick={e=>{e.stopPropagation();onChange("");}}>✕</button>}
    </div>
    <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={hf}/>
  </div>);
}

// ROOMS PAGE — Timeline + Availability
// ════════════════════════════════════════════════════════════════
function RoomsPage({bookings,customers,setToast,onSaveBooking,onDeleteBooking}){
  const [viewDate,setViewDate]=useState(today());
  const [daysShow,setDaysShow]=useState(30); // configurable: 14/30/60/90
  const [detailBooking,setDetailBooking]=useState(null);
  const [editBooking,setEditBooking]=useState(null);
  const [checkAvail,setCheckAvail]=useState({checkin:"",checkout:"",type:"S"});
  const tlRef=useRef(null);

  // Build date array for timeline
  const dateArr=useMemo(()=>{
    const arr=[];
    for(let i=0;i<daysShow;i++) arr.push(addDays(viewDate,i));
    return arr;
  },[viewDate,daysShow]);

  const todayStr=today();

  // Scroll today into view on mount / date change
  useEffect(()=>{
    if(!tlRef.current) return;
    const idx=dateArr.indexOf(todayStr);
    if(idx>=0){ const scrollTo=idx*44; tlRef.current.scrollLeft=Math.max(0,scrollTo-60); }
  },[viewDate,dateArr]);

  function getBookingForRoomDate(roomId,dateStr){
    return bookings.find(b=>
      (b.roomId===roomId||(b.roomIds||[]).includes(roomId))
      &&b.checkin<=dateStr&&b.checkout>=dateStr
    );
  }

  const availCheckin=checkAvail.checkin;
  const availCheckout=checkAvail.checkout;
  const availableRooms=availCheckin&&availCheckout&&availCheckin<availCheckout
    ? ROOMS.filter(r=>r.type===checkAvail.type&&isRoomAvailable(r.id,availCheckin,availCheckout,bookings))
    : null;

  // Auto-move timeline to checkin date when availability is selected
  useEffect(()=>{
    if(availCheckin) setViewDate(availCheckin);
  },[availCheckin]);

  const zones=["A","B","C"];

  // Export ALL bookings as one ICS file
  function exportAllBookingsICS(){
    if(!bookings.length){ setToast("No bookings to export"); return; }
    const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cat Hotel Rooms//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
    const ts=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    bookings.forEach(b=>{
      const cust=customers.find(c=>c.id===b.customerId)||{};
      const cats=(cust.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
      const catNames=cats.map(c=>c.name).join(", ")||b.catName||"Cat";
      const n=nights(b.checkin,b.checkout);
      const room=ROOMS.find(r=>r.id===b.roomId);
      const desc=[
        `Owner: ${cust.nickname||""}`,
        `Phone: ${cust.phone||""}`,
        `Cats: ${catNames}`,
        `Room: ${b.roomId||b.size} (Zone ${room?.zone||"?"})`,
        `${n} nights · ฿${(b.net||0).toLocaleString()}`,
        b.litter?`Cat Litter: ฿${b.litterAmt||0}`:"",
        `Payment: ${b.payMethod}${b.paid?" ✓":" (unpaid)"}`,
        b.notes?`Notes: ${b.notes}`:"",
      ].filter(Boolean).join("\\n");
      const summary=`🐱 ${catNames} — ${b.roomId||b.size} Cat Hotel`;
      // Check-in event
      lines.push(
        "BEGIN:VEVENT",
        `UID:checkin-${b.id}@cathotel`,
        `DTSTAMP:${ts}`,
        `DTSTART;VALUE=DATE:${toICS(b.checkin)}`,
        `DTEND;VALUE=DATE:${toICS(b.checkin)}`,
        `SUMMARY:📥 Check-in: ${summary}`,
        `DESCRIPTION:${desc}`,
        `LOCATION:${b.roomId||b.size} — Cat Hotel`,
        "END:VEVENT"
      );
      // Check-out event
      lines.push(
        "BEGIN:VEVENT",
        `UID:checkout-${b.id}@cathotel`,
        `DTSTAMP:${ts}`,
        `DTSTART;VALUE=DATE:${toICS(b.checkout)}`,
        `DTEND;VALUE=DATE:${toICS(b.checkout)}`,
        `SUMMARY:📤 Check-out: ${summary}`,
        `DESCRIPTION:${desc}`,
        `LOCATION:${b.roomId||b.size} — Cat Hotel`,
        "END:VEVENT"
      );
      // Full stay block event
      const checkoutPlusOne=addDays(b.checkout,1);
      lines.push(
        "BEGIN:VEVENT",
        `UID:stay-${b.id}@cathotel`,
        `DTSTAMP:${ts}`,
        `DTSTART;VALUE=DATE:${toICS(b.checkin)}`,
        `DTEND;VALUE=DATE:${toICS(checkoutPlusOne)}`,
        `SUMMARY:🏠 ${summary}`,
        `DESCRIPTION:${desc}`,
        `LOCATION:${b.roomId||b.size} — Cat Hotel`,
        "END:VEVENT"
      );
    });
    lines.push("END:VCALENDAR");
    const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`cat-hotel-all-rooms-${today()}.ics`;
    a.click();
    setToast(`✅ Downloaded ${bookings.length} bookings as .ics`);
  }

  return(<div>
    <div style={S.header}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div><div style={S.htitle}>Rooms</div><div style={S.hSub}>{ROOMS.length} rooms · {bookings.filter(b=>b.checkin<=todayStr&&b.checkout>=todayStr).length} occupied today · S ฿{PRICES.S} · M ฿{PRICES.M}/night</div></div>
        <button style={{...S.btnB,fontSize:12,padding:"9px 14px",whiteSpace:"nowrap"}} onClick={exportAllBookingsICS}>
          📅 Download All .ICS
        </button>
      </div>
    </div>

    {/* ── Check Availability Panel ── */}
    <div style={{...S.sec,marginTop:16}}>
      <div style={S.slabel}>Check Availability</div>
      <div style={{...S.card,padding:14,marginBottom:0}}>
        {/* Date Range Picker for availability */}
        {(()=>{
          const [showAvailCal,setShowAvailCal]=useState(false);
          const [availCalMonth,setAvailCalMonth]=useState(()=>{const d=new Date();d.setDate(1);return d;});
          const [availPicking,setAvailPicking]=useState("checkin");

          const daysInMonth2=(y,m)=>new Date(y,m+1,0).getDate();
          const firstDay2=(y,m)=>new Date(y,m,1).getDay();
          const toStr2=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
          const today2=toStr2(new Date());

          const handleAvailDay=(dateStr)=>{
            if(availPicking==="checkin"){
              setCheckAvail(v=>({...v,checkin:dateStr,checkout:""}));
              setAvailPicking("checkout");
            } else {
              if(dateStr<=checkAvail.checkin){
                setCheckAvail(v=>({...v,checkin:dateStr,checkout:""}));
                setAvailPicking("checkout");
              } else {
                setCheckAvail(v=>({...v,checkout:dateStr}));
                setAvailPicking("checkin");
                setShowAvailCal(false);
              }
            }
          };

          const y2=availCalMonth.getFullYear(), m2=availCalMonth.getMonth();
          const dim2=daysInMonth2(y2,m2);
          const fd2=firstDay2(y2,m2);
          const calDays2=[];

                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>

                  <div style={{flex:1}}>

  </div>);

// ════════════════════════════════════════════════════════════════
// BOOKING FORM with room selector
// ════════════════════════════════════════════════════════════════
function BookingSheet({booking,customers,bookings,onSave,onClose}){
  const [form,setForm]=useState(booking||{customerId:"",selectedCatIds:[],checkin:"",checkout:"",size:"S",roomIds:[],discount:"0",deposit:"0",payMethod:"Cash",paid:false,litter:false,notes:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const cust=customers.find(c=>c.id===form.customerId);
  const cats=cust?.cats||[];
  const numCats=form.selectedCatIds?.length||0;
  const n=form.checkin&&form.checkout&&form.checkin<form.checkout?nights(form.checkin,form.checkout):0;
  const selectedRooms=form.roomIds||[];
  const numRooms=Math.max(selectedRooms.length,1);
  // Price = sum of each room separately
  const totalNet=selectedRooms.length>0
    ? selectedRooms.reduce((sum,rid)=>{
        const r=ROOMS.find(x=>x.id===rid);
        const sz=r?.type||form.size;
        const {net:rNet}=calcPrice(n,sz,numCats,form.discount,form.litter);
        return sum+rNet;
      },0)
    : (n>0&&numCats>0?calcPrice(n,form.size,numCats,form.discount,form.litter).net:0);
  const net=totalNet;
  const {base,discAmt,litterAmt,litterWeeks}=n>0&&numCats>0?calcPrice(n,form.size,numCats,form.discount,form.litter):{base:0,discAmt:0,net:0,litterAmt:0,litterWeeks:0};
  const depositAmt=Math.max(0,parseFloat(form.deposit)||0);
  const remaining=Math.max(0,net-depositAmt);
  const toggleRoom=id=>{
    const ids=form.roomIds||[];
    set("roomIds",ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);
  };
  const valid=form.customerId&&form.selectedCatIds?.length>0&&form.checkin&&form.checkout&&form.checkin<form.checkout&&(form.roomIds||[]).length>0;
  const toggleCat=id=>{const ids=form.selectedCatIds||[];set("selectedCatIds",ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);};
  useEffect(()=>{if(cust&&!booking)set("selectedCatIds",cats.length>0?[cats[0].id]:[]);},[form.customerId]);

  // Available rooms for selected dates+type
  const availRooms=form.checkin&&form.checkout&&form.checkin<form.checkout
    ? ROOMS.filter(r=>r.type===form.size&&isRoomAvailable(r.id,form.checkin,form.checkout,bookings,booking?.id))
    : [];
  // Auto-clear roomIds that are no longer available
  useEffect(()=>{
    if((form.roomIds||[]).length>0){
      const stillAvail=(form.roomIds||[]).filter(id=>availRooms.find(r=>r.id===id));
      if(stillAvail.length!==(form.roomIds||[]).length) set("roomIds",stillAvail);
    }
  },[form.checkin,form.checkout,form.size]);

  // backward compat: if old booking has roomId (string), convert
  useEffect(()=>{
    if(booking?.roomId&&!(booking?.roomIds?.length)){
      set("roomIds",[booking.roomId]);
    }
  },[]);

  return(<div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={S.sheet}>
      <div style={S.sheetHandle}/>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div style={S.sheetTitle}>{booking?"Edit Booking":"New Booking"}</div>
        <button style={S.btnG} onClick={onClose}>Cancel</button>
      </div>
      <div style={{padding:"0 16px"}}>
        {/* Customer — Searchable Picker */}
        {(()=>{
          const [custSearch,setCustSearch]=useState("");
          const [showCustList,setShowCustList]=useState(false);
          const filteredCusts=customers.filter(c=>{
            if(!custSearch.trim()) return true;
            const s=custSearch.toLowerCase();
            return c.nickname.toLowerCase().includes(s)||(c.cats||[]).some(cat=>cat.name.toLowerCase().includes(s))||(c.phone||"").includes(s);
          });
          const selectedCust=customers.find(c=>c.id===form.customerId);
          return(
            <div style={S.fg}>
              <div style={S.lbl}>Customer *</div>
              {/* Selected display / search input */}
              <div style={{border:`1px solid ${form.customerId?C.accent:C.border}`,borderRadius:12,overflow:"hidden",background:C.white}}>
                <div style={{display:"flex",alignItems:"center",padding:"0 12px",gap:8}}>
                  {selectedCust&&!showCustList&&(
                    <div style={{display:"flex",alignItems:"center",gap:8,flex:1,padding:"10px 0"}}>
                      <div style={{fontSize:20}}>😺</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:700,color:C.accent}}>
                          {selectedCust.nickname} <span style={{fontWeight:500,color:C.text2}}>({(selectedCust.cats||[]).map(x=>x.name).join(", ")||"—"})</span>
                        </div>
                      </div>
                      <button style={{background:"none",border:"none",color:C.text3,fontSize:18,cursor:"pointer",padding:"4px"}} onClick={()=>{set("customerId","");setCustSearch("");setShowCustList(true);}}>✕</button>
                    </div>
                  )}
                  {(!selectedCust||showCustList)&&(
                    <input
                      style={{flex:1,border:"none",outline:"none",fontSize:14,padding:"12px 0",background:"transparent",fontFamily:"inherit"}}
                      placeholder="🔍 Search customer name or cat..."
                      value={custSearch}
                      autoFocus={showCustList}
                      onChange={e=>{setCustSearch(e.target.value);setShowCustList(true);}}
                      onFocus={()=>setShowCustList(true)}
                    />
                  )}
                </div>
                {/* Dropdown list */}
                {showCustList&&(
                  <div style={{borderTop:`1px solid ${C.borderLight}`,maxHeight:220,overflowY:"auto"}}>
                    {filteredCusts.length===0&&(
                      <div style={{padding:"12px 16px",fontSize:13,color:C.text3}}>No customers found</div>
                    )}
                    {filteredCusts.map(c=>(
                      <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:`1px solid ${C.borderLight}`,cursor:"pointer",background:form.customerId===c.id?C.accentBg:C.white}} onClick={()=>{set("customerId",c.id);setShowCustList(false);setCustSearch("");}}>
                        <div style={{display:"flex",flexShrink:0}}>
                          {(c.cats||[]).slice(0,2).map((cat,i)=>(
                            <div key={cat.id} style={{width:32,height:32,borderRadius:8,overflow:"hidden",background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,marginLeft:i>0?-8:0,border:`2px solid ${C.white}`}}>
                              {cat.photo?<img src={cat.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                            </div>
                          ))}
                          {(c.cats||[]).length===0&&<div style={{width:32,height:32,borderRadius:8,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>😺</div>}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:700,color:form.customerId===c.id?C.accent:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                            {c.nickname} <span style={{fontWeight:500,color:C.text3}}>({(c.cats||[]).map(x=>x.name).join(", ")||"—"})</span>
                          </div>
                          {c.phone&&<div style={{fontSize:11,color:C.text3}}>{c.phone}</div>}
                        </div>
                        {form.customerId===c.id&&<span style={{color:C.accent,fontSize:16}}>✓</span>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })()}
        {/* Cats */}
        {cust&&cats.length>0&&(
          <div style={S.fg}><div style={S.lbl}>Select Cat(s) *</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {cats.map((cat,i)=>{
                const sel=(form.selectedCatIds||[]).includes(cat.id);
                return(<div key={cat.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",border:`2px solid ${sel?C.accent:C.border}`,borderRadius:12,cursor:"pointer",background:sel?C.accentBg:C.white}} onClick={()=>toggleCat(cat.id)}>
                  <div style={{width:38,height:38,borderRadius:9,overflow:"hidden",flexShrink:0,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                    {cat.photo?<img src={cat.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                  </div>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{cat.name}</div><div style={{fontSize:11,color:C.text3}}>{cat.breed||"Cat"}</div></div>
                  {i>0&&<span style={S.chip(C.orange)}>+฿{EXTRA_CAT_FEE}/night</span>}
                  <div style={{width:20,height:20,borderRadius:"50%",border:`2px solid ${sel?C.accent:C.border}`,background:sel?C.accent:"none",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,flexShrink:0}}>{sel?"✓":""}</div>
                </div>);
              })}
            </div>
          </div>
        )}
        {/* Date Range Picker */}
        {(()=>{
          const [showCal,setShowCal]=useState(false);
          const [calMonth,setCalMonth]=useState(()=>{
            if(form.checkin) return new Date(form.checkin+"T12:00:00");
            const d=new Date(); d.setDate(1); return d;
          });
          const [picking,setPicking]=useState("checkin"); // "checkin" | "checkout"

          const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
          const firstDay=(y,m)=>new Date(y,m,1).getDay();
          const toStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

          const handleDayClick=(dateStr)=>{
            if(picking==="checkin"){
              set("checkin",dateStr);
              set("checkout","");
              setPicking("checkout");
            } else {
              if(dateStr<=form.checkin){
                set("checkin",dateStr);
                set("checkout","");
                setPicking("checkout");
              } else {
                set("checkout",dateStr);
                setPicking("checkin");
                setShowCal(false);
              }
            }
          };

          const y=calMonth.getFullYear(), m=calMonth.getMonth();
          const dim=daysInMonth(y,m);
          const fd=firstDay(y,m);
          const today2=toStr(new Date());
          const isEdit=!!booking; // allow past dates when editing

          const calDays=[];
          for(let i=0;i<fd;i++) calDays.push(null);
          for(let d=1;d<=dim;d++) calDays.push(toStr(new Date(y,m,d)));

          return(
            <div style={S.fg}>
              <div style={S.lbl}>Check-in → Check-out *</div>
              {/* Display button */}
              <div style={{border:`1px solid ${(form.checkin||form.checkout)?C.accent:C.border}`,borderRadius:12,padding:"12px 14px",cursor:"pointer",background:C.white,display:"flex",alignItems:"center",justifyContent:"space-between"}} onClick={()=>{setShowCal(!showCal);setPicking(form.checkin&&!form.checkout?"checkout":"checkin");}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flex:1}}>
                  <div style={{textAlign:"center",flex:1}}>
                    <div style={{fontSize:10,fontWeight:700,color:C.text3,marginBottom:2}}>CHECK-IN</div>
                    <div style={{fontSize:14,fontWeight:800,color:form.checkin?C.accent:C.text3}}>{form.checkin?fmt(form.checkin):"เลือกวัน"}</div>
                  </div>
                  <div style={{fontSize:18,color:C.text3}}>→</div>
                  <div style={{textAlign:"center",flex:1}}>
                    <div style={{fontSize:10,fontWeight:700,color:C.text3,marginBottom:2}}>CHECK-OUT</div>
                    <div style={{fontSize:14,fontWeight:800,color:form.checkout?C.blue:C.text3}}>{form.checkout?fmt(form.checkout):"เลือกวัน"}</div>
                  </div>
                </div>
                {form.checkin&&form.checkout&&n>0&&(
                  <div style={{...S.chip(C.text),marginLeft:8}}>{n}คืน</div>
                )}
              </div>
              {/* Inline Calendar */}
              {showCal&&(
                <div style={{marginTop:8,border:`1px solid ${C.borderLight}`,borderRadius:14,background:C.white,boxShadow:C.shadow,overflow:"hidden"}}>
                  {/* Status bar */}
                  <div style={{background:C.accentBg,padding:"8px 14px",fontSize:12,fontWeight:700,color:C.accent,textAlign:"center"}}>
                    {picking==="checkin"?"📅 เลือกวัน Check-in":"📅 เลือกวัน Check-out"}{form.checkin&&picking==="checkout"?` (จาก ${fmt(form.checkin)})`:""}
                  </div>
                  {/* Month nav */}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:`1px solid ${C.borderLight}`}}>
                    <button style={{background:"none",border:"none",fontSize:18,cursor:"pointer",padding:"4px 8px",color:C.text2}} onClick={()=>setCalMonth(d=>{const x=new Date(d);x.setMonth(x.getMonth()-1);return x;})}>‹</button>
                    <div style={{fontSize:14,fontWeight:800}}>{MONTHS_FULL[m]} {y}</div>
                    <button style={{background:"none",border:"none",fontSize:18,cursor:"pointer",padding:"4px 8px",color:C.text2}} onClick={()=>setCalMonth(d=>{const x=new Date(d);x.setMonth(x.getMonth()+1);return x;})}>›</button>
                  </div>
                  {/* Day headers */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"6px 8px 0"}}>
                    {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.text3,padding:"2px 0"}}>{d}</div>)}
                  </div>
                  {/* Days grid */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"4px 8px 10px",gap:2}}>
                    {calDays.map((dateStr,i)=>{
                      if(!dateStr) return <div key={i}/>;
                      const isCheckin=dateStr===form.checkin;
                      const isCheckout=dateStr===form.checkout;
                      const inRange=form.checkin&&form.checkout&&dateStr>form.checkin&&dateStr<form.checkout;
                      const isPast=!isEdit&&dateStr<today2;
                      const isToday3=dateStr===today2;
                      const isSel=isCheckin||isCheckout;
                      return(
                        <div key={dateStr} onClick={()=>!isPast&&handleDayClick(dateStr)} style={{
                          textAlign:"center",padding:"6px 2px",borderRadius:8,cursor:isPast?"default":"pointer",
                          background:isSel?C.accent:inRange?C.accentBg:"transparent",
                          color:isSel?"#fff":isPast?C.text3:isToday3?C.accent:C.text,
                          fontWeight:isSel?800:isToday3?700:400,
                          fontSize:13,opacity:isPast?0.35:1,
                          border:isToday3&&!isSel?`1px solid ${C.accent}`:"none",
                        }}>
                          {new Date(dateStr+"T12:00:00").getDate()}
                        </div>
                      );
                    })}
                  </div>
                  {/* Clear button */}
                  <div style={{padding:"0 12px 10px",display:"flex",gap:8}}>
                    <button style={{...S.btnG,flex:1,fontSize:12}} onClick={()=>{set("checkin","");set("checkout","");setPicking("checkin");}}>Clear</button>
                    <button style={{...S.btnG,flex:1,fontSize:12}} onClick={()=>setShowCal(false)}>Done</button>
                  </div>
                </div>
              )}
            </div>
          );
        })()}
        {/* Size */}
        <div style={S.fg}><div style={S.lbl}>Room Type</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {["S","M"].map(sz=><button key={sz} style={{padding:"11px",background:form.size===sz?C.text:C.bg,color:form.size===sz?"#fff":C.text2,border:`1px solid ${form.size===sz?C.text:C.border}`,borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer"}} onClick={()=>set("size",sz)}>{sz} — ฿{PRICES[sz]}/night</button>)}
          </div>
        </div>
        {/* Room selector — multi-select */}
        <div style={S.fg}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
            <div style={S.lbl}>เลือกห้อง * (เลือกได้หลายห้อง)</div>
            {selectedRooms.length>0&&<span style={S.chip(C.accent)}>{selectedRooms.length} ห้อง</span>}
          </div>
          {form.checkin&&form.checkout&&form.checkin<form.checkout?(
            availRooms.length>0?(
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {availRooms.map(r=>{
                  const sel=selectedRooms.includes(r.id);
                  return(
                    <button key={r.id} style={{padding:"10px 4px",background:sel?getRoomColor(r.id):getRoomBg(r.id),color:sel?"#fff":getRoomColor(r.id),border:`2px solid ${sel?getRoomColor(r.id):getRoomColor(r.id)+"40"}`,borderRadius:10,fontFamily:"inherit",fontSize:12,fontWeight:800,cursor:"pointer",textAlign:"center"}} onClick={()=>toggleRoom(r.id)}>
                      {r.label}
                      {sel&&<div style={{fontSize:9,marginTop:2}}>✓</div>}
                    </button>
                  );
                })}
              </div>
            ):<div style={{padding:"12px 14px",background:C.accentBg,borderRadius:10,fontSize:13,fontWeight:600,color:C.accent}}>❌ No {form.size} rooms available for these dates</div>
          ):<div style={{padding:"12px 14px",background:C.bg,borderRadius:10,fontSize:13,color:C.text3}}>Enter dates to see available rooms</div>}
          {selectedRooms.length>1&&(
            <div style={{marginTop:8,padding:"8px 12px",background:C.blueBg,borderRadius:8,fontSize:12,color:C.blue,fontWeight:600}}>
              ✓ {selectedRooms.length} ห้อง: {selectedRooms.join(", ")} · ราคาคำนวณแยกต่อห้อง
            </div>
          )}
        </div>
        {/* Price breakdown */}
        {n>0&&numCats>0&&selectedRooms.length>0&&(
          <div style={{background:C.bg,borderRadius:12,padding:"14px 16px",marginBottom:14,border:`1px solid ${C.border}`}}>
            {selectedRooms.map((rid,ri)=>{
              const r=ROOMS.find(x=>x.id===rid);
              const sz=r?.type||form.size;
              const {base:rb,discAmt:rd,net:rn}=calcPrice(n,sz,numCats,form.discount,form.litter);
              return(
                <div key={rid} style={{marginBottom:ri<selectedRooms.length-1?10:0,paddingBottom:ri<selectedRooms.length-1?10:0,borderBottom:ri<selectedRooms.length-1?`1px dashed ${C.border}`:"none"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:12,fontWeight:700,color:getRoomColor(rid)}}>{rid}</span>
                    <span style={{fontSize:12,fontWeight:700}}>฿{rn.toLocaleString()}</span>
                  </div>
                  <div style={{fontSize:11,color:C.text3}}>{n}n × ฿{PRICES[sz]}{numCats>1?` + ${numCats-1} extra cat`:""}{form.litter?` + ทราย`:""}{ rd>0?` − ${form.discount}%`:""}</div>
                </div>
              );
            })}
            {form.litter&&litterAmt>0&&selectedRooms.length===1&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:5,marginTop:5}}><span style={{fontSize:13,color:C.text2}}>🪣 ทรายแมว {litterWeeks} สัปดาห์</span><span style={{fontSize:13,fontWeight:600,color:C.blue}}>+฿{litterAmt.toLocaleString()}</span></div>}
            {discAmt>0&&selectedRooms.length===1&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:13,color:C.text2}}>Discount ({form.discount}%)</span><span style={{fontSize:13,fontWeight:600,color:C.red}}>-฿{discAmt.toLocaleString()}</span></div>}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:8,marginTop:8,display:"flex",justifyContent:"space-between",marginBottom:depositAmt>0?8:0}}>
              <span style={{fontSize:15,fontWeight:800}}>Net Total {selectedRooms.length>1&&`(${selectedRooms.length} ห้อง)`}</span>
              <span style={{fontSize:18,fontWeight:800,color:C.accent}}>฿{net.toLocaleString()}</span>
            </div>
            {depositAmt>0&&(<>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,padding:"6px 10px",background:"#fffbf0",borderRadius:8}}>
                <span style={{fontSize:13,color:C.orange,fontWeight:600}}>💰 มัดจำ (Deposit paid)</span>
                <span style={{fontSize:13,fontWeight:700,color:C.orange}}>-฿{depositAmt.toLocaleString()}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",background:remaining===0?C.greenBg:"#fff5f5",borderRadius:8,border:`1px solid ${remaining===0?C.green+"40":"#ff3b3020"}`}}>
                <span style={{fontSize:14,fontWeight:800,color:remaining===0?C.green:C.red}}>{remaining===0?"✅ ชำระครบแล้ว":"💳 ยังค้างชำระ (Due at check-in)"}</span>
                <span style={{fontSize:16,fontWeight:800,color:remaining===0?C.green:C.red}}>{remaining===0?"✓":"฿"+remaining.toLocaleString()}</span>
              </div>
            </>)}
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={S.fg}><div style={S.lbl}>Discount %</div><input type="number" style={S.inp} min="0" max="100" value={form.discount} onChange={e=>set("discount",e.target.value)}/></div>
          <div style={S.fg}><div style={S.lbl}>Payment Method</div><select style={S.sel} value={form.payMethod} onChange={e=>set("payMethod",e.target.value)}>{PAY_METHODS.map(m=><option key={m}>{m}</option>)}</select></div>
        </div>
        {/* Deposit */}
        <div style={{...S.fg,padding:"14px",background:"#fffbf0",borderRadius:12,border:`1px solid ${depositAmt>0?C.orange+"60":"#ffd70050"}`,marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:16}}>💰</span>
            <div style={{fontSize:14,fontWeight:700,color:C.orange}}>มัดจำ (Deposit)</div>
            {depositAmt>0&&net>0&&<span style={{...S.chip(C.orange),marginLeft:"auto"}}>จ่ายไปแล้ว {Math.round(depositAmt/net*100)}%</span>}
          </div>
          <input type="number" style={{...S.inp,borderColor:depositAmt>0?C.orange+"80":C.border}} min="0" placeholder="0" value={form.deposit||""} onChange={e=>set("deposit",e.target.value)}/>
          {depositAmt>0&&net>0&&(
            <div style={{marginTop:8,display:"flex",justifyContent:"space-between",fontSize:12,color:C.text2}}>
              <span>ยอดรวม ฿{net.toLocaleString()}</span>
              <span style={{color:remaining>0?C.red:C.green,fontWeight:700}}>คงเหลือ ฿{remaining.toLocaleString()}</span>
            </div>
          )}
        </div>
        {/* Cat Litter */}
        <div style={{...S.fg,padding:"12px 14px",background:form.litter?"#f0f6ff":C.bg,borderRadius:12,border:`1px solid ${form.litter?C.blue+"40":C.border}`,marginBottom:10}}>
          <label style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
            <input type="checkbox" checked={form.litter||false} onChange={e=>set("litter",e.target.checked)} style={{width:18,height:18,accentColor:C.blue}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:form.litter?C.blue:C.text}}>🪣 ทรายแมว (Cat Litter)</div>
              <div style={{fontSize:11,color:C.text3,marginTop:2}}>฿{LITTER_FEE}/สัปดาห์ · {n>0?`${Math.ceil(n/7)} สัปดาห์ = ฿${Math.ceil(n/7)*LITTER_FEE}`:"เลือกวันก่อน"}</div>
            </div>
            {form.litter&&n>0&&<span style={S.chip(C.blue)}>+฿{litterAmt.toLocaleString()}</span>}
          </label>
        </div>
        {/* Paid */}
        <div style={S.fg}><label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}><input type="checkbox" checked={form.paid} onChange={e=>set("paid",e.target.checked)} style={{width:18,height:18,accentColor:C.green}}/><span style={{fontSize:14,fontWeight:600}}>ชำระเงินครบแล้ว (Fully Paid)</span></label></div>
        <div style={S.fg}><div style={S.lbl}>Notes</div><textarea style={S.ta} rows={2} value={form.notes||""} onChange={e=>set("notes",e.target.value)} placeholder="Special requests..."/></div>
        <button style={{...S.btnP,width:"100%",opacity:valid?1:0.4}} onClick={()=>valid&&onSave({...form,id:booking?.id||uid(),createdAt:booking?.createdAt||new Date().toISOString(),net,base,discAmt,numCats,litterAmt,litterWeeks,depositAmt,remaining,roomId:selectedRooms[0]||""})}>
          {booking?"Save Changes":"Add Booking"}
        </button>
      </div>
    </div>
  </div>);
}

// ════════════════════════════════════════════════════════════════
// CUSTOMER FORM

function CustomerSheet({customer,onSave,onClose}){

          <div style={S.fg}><div style={S.lbl}>Line ID</div><input style={S.inp} placeholder="Line ID" value={form.line} onChange={e=>set("line",e.target.value)}/></div>

    </div>
  </div>);
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return[];
  const headers=lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim().toLowerCase());
  return lines.slice(1).map(line=>{
    // handle quoted fields with commas inside
    const fields=[]; let cur=""; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ inQ=!inQ; }
      else if(ch===","&&!inQ){ fields.push(cur.trim()); cur=""; }
      else{ cur+=ch; }
    }
    fields.push(cur.trim());
    const row={};
    headers.forEach((h,i)=>{ row[h]=(fields[i]||"").replace(/^"|"$/g,"").trim(); });
    return row;
  }).filter(r=>Object.values(r).some(v=>v));
}

function importCustomersFromCSV(rows, existingCustomers){
  const results={imported:0, skipped:0, errors:[]};
  const newCustomers=[];
  rows.forEach((r,i)=>{
    const nickname=(r["name"]||r["nickname"]||r["ชื่อ"]||r["ชื่อเล่น"]||"").trim();
    const phone=(r["phone"]||r["เบอร์โทร"]||r["tel"]||r["mobile"]||"").trim();
    if(!nickname){ results.errors.push(`Row ${i+2}: No name`); results.skipped++; return; }
    // Check duplicate
    const dup=existingCustomers.find(c=>c.nickname.toLowerCase()===nickname.toLowerCase()&&(!phone||c.phone===phone));
    if(dup){ results.skipped++; return; }
    // Parse cats — Cat1 Name, Cat1 Breed ... Cat3
    const cats=[];
    for(let ci=1;ci<=5;ci++){
      const catName=(r[`cat${ci} name`]||r[`cat${ci}name`]||r[`cat${ci}_name`]||r[`cat ${ci} name`]||"").trim();
      const catBreed=(r[`cat${ci} breed`]||r[`cat${ci}breed`]||r[`cat${ci}_breed`]||r[`cat ${ci} breed`]||"").trim();
      const catNotes=(r[`cat${ci} notes`]||r[`cat${ci}notes`]||"").trim();
      if(catName) cats.push({id:uid(),name:catName,breed:catBreed,notes:catNotes,photo:"",vaccinePassport:""});
    }
    // Also handle single "cat name" column
    if(cats.length===0){
      const singleCat=(r["cat name"]||r["cat"]||r["ชื่อแมว"]||"").trim();
      const singleBreed=(r["breed"]||r["สายพันธุ์"]||"").trim();
      if(singleCat) cats.push({id:uid(),name:singleCat,breed:singleBreed,notes:"",photo:"",vaccinePassport:""});
    }
    newCustomers.push({
      id:uid(),
      nickname,
      phone,
      line:(r["line id"]||r["line"]||r["line_id"]||"").trim(),
      address:(r["address"]||r["ที่อยู่"]||"").trim(),
      notes:(r["notes"]||r["หมายเหตุ"]||"").trim(),
      cats:cats.length>0?cats:[{id:uid(),name:"",breed:"",notes:"",photo:"",vaccinePassport:""}],
      idCard:"",
      createdAt:new Date().toISOString(),
    });
    results.imported++;
  });
  return{newCustomers,results};
}

function importBookingsFromCSV(rows, customers){
  const results={imported:0,skipped:0,errors:[]};
  const newBookings=[];
  rows.forEach((r,i)=>{
    const nick=(r["customer nickname"]||r["nickname"]||r["customer"]||"").trim();
    const checkin=(r["check-in (yyyy-mm-dd)"]||r["check-in"]||r["checkin"]||r["check in"]||"").trim();
    const checkout=(r["check-out (yyyy-mm-dd)"]||r["check-out"]||r["checkout"]||r["check out"]||"").trim();
    const roomId=(r["room id"]||r["room"]||r["roomid"]||"").trim().toUpperCase();
    if(!nick||!checkin||!checkout){ results.errors.push(`Row ${i+2}: Missing nickname/dates`); results.skipped++; return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(checkin)||!/^\d{4}-\d{2}-\d{2}$/.test(checkout)){ results.errors.push(`Row ${i+2}: Date format must be YYYY-MM-DD`); results.skipped++; return; }
    const cust=customers.find(c=>c.nickname.toLowerCase()===nick.toLowerCase());
    if(!cust){ results.errors.push(`Row ${i+2}: Customer "${nick}" not found — add them first`); results.skipped++; return; }
    const size=(r["room size (s/m)"]||r["size"]||r["room size"]||"S").trim().toUpperCase()==="M"?"M":"S";
    const validRoom=ROOMS.find(rm=>rm.id===roomId);
    const discount=parseFloat(r["discount %"]||r["discount"]||"0")||0;
    const depositAmt=parseFloat(r["deposit"]||"0")||0;
    const payMethod=r["payment method"]||r["payment"]||"Cash";
    const paid=(r["paid (yes/no)"]||r["paid"]||"").toLowerCase()==="yes";
    const litter=(r["cat litter (yes/no)"]||r["cat litter"]||r["litter"]||"").toLowerCase()==="yes";
    const notes=(r["notes"]||r["หมายเหตุ"]||"").trim();
    const n=nights(checkin,checkout);
    const selectedCatIds=(cust.cats||[]).filter(c=>c.name).map(c=>c.id);
    // Parse specific cat names if provided
    const catNamesStr=(r["cat names (comma separated)"]||r["cat names"]||"").trim();
    let selCatIds=selectedCatIds;
    if(catNamesStr){
      const catNames=catNamesStr.split(",").map(x=>x.trim().toLowerCase());
      const matched=(cust.cats||[]).filter(c=>catNames.includes(c.name.toLowerCase())).map(c=>c.id);
      if(matched.length>0) selCatIds=matched;
    }
    const numCats=selCatIds.length||1;
    const{base,discAmt,net,litterAmt,litterWeeks}=calcPrice(n,size,numCats,discount,litter);
    const remaining=Math.max(0,net-depositAmt);
    newBookings.push({
      id:uid(), customerId:cust.id, selectedCatIds:selCatIds,
      checkin, checkout, size, roomId:validRoom?roomId:"",
      discount:String(discount), payMethod, paid, litter, notes,
      base, discAmt, net, litterAmt, litterWeeks,
      depositAmt, remaining,
      numCats, createdAt:new Date().toISOString(),
    });
    results.imported++;
  });
  return{newBookings,results};
}

// ── Import Sheet Modal ────────────────────────────────────────────
function ImportSheet({mode, customers, onImportCustomers, onImportBookings, onClose}){
  const [step,setStep]=useState("upload"); // upload | preview | done
  const [rows,setRows]=useState([]);
  const [preview,setPreview]=useState(null); // {newItems, results}
  const [error,setError]=useState("");
  const fileRef=useRef();

  const handleFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=parseCSV(ev.target.result);
        if(!parsed.length){setError("ไม่พบข้อมูลในไฟล์ หรือ format ไม่ถูกต้อง"); return;}
        setRows(parsed); setError("");
        if(mode==="customers"){
          const{newCustomers,results}=importCustomersFromCSV(parsed,customers);
          setPreview({items:newCustomers,results});
        } else {
          const{newBookings,results}=importBookingsFromCSV(parsed,customers);
          setPreview({items:newBookings,results});
        }
        setStep("preview");
      }catch(err){setError("ไม่สามารถอ่านไฟล์ได้: "+err.message);}
    };
    reader.readAsText(f,"UTF-8");
  };

  const handleConfirm=async()=>{
    if(!preview) return;
    if(mode==="customers") await onImportCustomers(preview.items);
    else await onImportBookings(preview.items);
    setStep("done");
  };

  const isCustomer=mode==="customers";

  return(<div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={S.sheet}>
      <div style={S.sheetHandle}/>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div style={S.sheetTitle}>📥 Import {isCustomer?"Customers":"Bookings"}</div>
        <button style={S.btnG} onClick={onClose}>✕</button>
      </div>

      <div style={{padding:"0 20px 20px"}}>
        {/* Step indicator */}
        <div style={{display:"flex",gap:4,alignItems:"center",margin:"12px 0 20px"}}>
          {["upload","preview","done"].map((s,i)=>{
            const steps=["upload","preview","done"];
            const curIdx=steps.indexOf(step);
            return(
              <div key={s} style={{display:"flex",flex:i<2?"1 1 auto":"0 0 auto",alignItems:"center",gap:4}}>
                <div style={{width:24,height:24,borderRadius:"50%",background:step===s?C.accent:curIdx>i?C.green:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:curIdx>=i?"#fff":C.text3,flexShrink:0}}>
                  {curIdx>i?"✓":i+1}
                </div>
                {i<2&&<div style={{flex:1,height:2,background:curIdx>i?C.green:C.borderLight,minWidth:16}}/>}
              </div>
            );
          })}
        </div>

        {/* STEP 1: Upload */}
        {step==="upload"&&(<>
          {/* Download template */}
          <div style={{background:C.blueBg,borderRadius:12,padding:"14px 16px",marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,color:C.blue,marginBottom:8}}>
              📄 ขั้นตอนที่ 1 — ดาวน์โหลด Template
            </div>
            <div style={{fontSize:12,color:C.text2,marginBottom:12,lineHeight:1.7}}>
              {isCustomer?(
                <div>{"Download template CSV → เปิดใน Numbers/Excel → กรอกข้อมูล → Export เป็น CSV → Import กลับมา"}
                  <div style={{marginTop:4,fontWeight:600,color:C.blue}}>คอลัมน์: Name, Phone, Line ID, Address, Notes, Cat1 Name, Cat1 Breed, Cat1 Notes, Cat2 Name...</div>
                </div>

                  <div style={{marginTop:4,color:C.orange,fontWeight:600}}>⚠️ ต้องมีชื่อลูกค้าในระบบก่อน (Nickname ต้องตรง)</div>

            <div style={{fontWeight:700,marginBottom:6,color:C.text}}>💡 วิธีใช้ใน Numbers (Mac)</div>
            <div>{"1. เปิดไฟล์ template ใน Numbers"}</div>
            <div>{"2. กรอกข้อมูลลูกค้า"}{ isCustomer?" แมวหลายตัวใส่ Cat2, Cat3":""}{" ให้ครบ"}</div>
            <div>{"3. File → Export To → CSV..."}</div>
            <div>{"4. กลับมากด Upload CSV ด้านล่าง"}</div>
          </div>

          {/* Upload area */}
          <div style={{border:`2px dashed ${C.border}`,borderRadius:14,padding:"24px 20px",textAlign:"center",cursor:"pointer",background:C.bg}} onClick={()=>fileRef.current.click()}>
            <div style={{fontSize:32,marginBottom:8}}>📂</div>
            <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>Tap to select CSV file</div>

        </>)}

        {/* STEP 2: Preview */}
        {step==="preview"&&preview&&(<>
          {/* Summary */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            <div style={{...S.statCard,textAlign:"center"}}>
              <div style={{...S.statVal,fontSize:28,color:C.green}}>{preview.results.imported}</div>
              <div style={S.statLbl}>✅ พร้อม Import</div>
            </div>
            <div style={{...S.statCard,textAlign:"center"}}>
              <div style={{...S.statVal,fontSize:28,color:preview.results.skipped>0?C.orange:C.text3}}>{preview.results.skipped}</div>
              <div style={S.statLbl}>⏭ ข้าม (ซ้ำ/ผิด)</div>
            </div>
          </div>

          {/* Errors */}
          {preview.results.errors.length>0&&(
            <div style={{background:"#fff5f5",borderRadius:10,padding:"10px 14px",marginBottom:14,border:"1px solid #ff3b3030"}}>
              <div style={{fontSize:12,fontWeight:700,color:C.red,marginBottom:6}}>⚠️ ข้อผิดพลาด</div>
              {preview.results.errors.map((e,i)=><div key={i} style={{fontSize:11,color:C.red,marginBottom:2}}>• {e}</div>)}
            </div>
          )}

          {/* Preview items */}
          {preview.items.length>0?(
            <>
              <div style={S.slabel}>ตัวอย่างข้อมูลที่จะ Import</div>
              <div style={{maxHeight:280,overflowY:"auto",marginBottom:16}}>
                {preview.items.slice(0,20).map((item,i)=>(
                  <div key={i} style={{...S.card,padding:"11px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:28,height:28,borderRadius:8,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>
                      {isCustomer?"🐱":"📋"}
                    </div>
                    {isCustomer?(
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700}}>{item.nickname}</div>
                        <div style={{fontSize:11,color:C.text2}}>{item.phone||"—"} · {(item.cats||[]).map(c=>c.name).filter(Boolean).join(", ")||"No cat"}</div>
                      </div>
                    ):(
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700}}>{customers.find(c=>c.id===item.customerId)?.nickname||"?"} → {item.roomId||item.size}</div>
                        <div style={{fontSize:11,color:C.text2}}>{item.checkin} → {item.checkout} · ฿{(item.net||0).toLocaleString()}</div>
                      </div>
                    )}
                    <span style={S.chip(C.green)}>New</span>
                  </div>
                ))}
                {preview.items.length>20&&<div style={{textAlign:"center",fontSize:12,color:C.text3,padding:"8px"}}>...และอีก {preview.items.length-20} รายการ</div>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button style={{...S.btnG,flex:1}} onClick={()=>setStep("upload")}>← กลับ</button>
                <button style={{...S.btnP,flex:2}} onClick={handleConfirm}>
                  ✅ Import {preview.items.length} รายการ
                </button>
              </div>
            </>
          ):(
            <div style={{textAlign:"center",padding:"20px",color:C.text3}}>
              <div style={{fontSize:28,marginBottom:8}}>😕</div>
              <div style={{fontSize:13}}>ไม่มีข้อมูลใหม่ที่จะ import</div>
              <button style={{...S.btnG,marginTop:12}} onClick={()=>setStep("upload")}>← ลองใหม่</button>
            </div>
          )}
        </>)}

        {/* STEP 3: Done */}
        {step==="done"&&(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:52,marginBottom:12}}>🎉</div>
            <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Import สำเร็จ!</div>
            <div style={{fontSize:14,color:C.text2,marginBottom:20}}>
              เพิ่ม {preview?.items.length||0} {isCustomer?"ลูกค้า":"booking"} เข้าระบบแล้ว
            </div>
            <button style={{...S.btnP,width:"100%"}} onClick={onClose}>เสร็จสิ้น ✓</button>
          </div>
        )}
      </div>
    </div>
  </div>);
}

function CustomersPage({customers,bookings,onSaveCustomer,onDeleteCustomer,onSaveBooking,onImportCustomers,setToast}){

  const [editCust,setEditCust]=useState(null);
  const [detailCust,setDetailCust]=useState(null);

  const toggleSelect=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={toggleSelectAll}>
                {selected.length===filtered.length?"✕ Clear All":"✓ All"}
              </button>
              {selected.length>0&&<button style={{...S.btnD,padding:"8px 12px",fontSize:12}} onClick={bulkDelete}>🗑 Delete {selected.length}</button>}
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={exitSelect}>Cancel</button>
            </>
          )}
        </div>
      </div>
      <input style={{...S.inp,marginTop:12}} placeholder="🔍  Search name, cat name, phone..." value={search} onChange={e=>{setSearch(e.target.value);exitSelect();}}/>
    </div>
    <div style={{...S.sec,marginTop:0}}><div style={{marginTop:16}}>

            <div style={{padding:"13px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:cats.length>1?8:0}}>
                {selectMode&&(
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${isSel?C.accent:C.border}`,background:isSel?C.accent:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {isSel&&<span style={{color:"#fff",fontSize:13,fontWeight:800}}>✓</span>}
                  </div>

                <div style={{display:"flex",position:"relative",flexShrink:0}}>
                  {cats.slice(0,3).map((cat,i)=>(
                    <div key={cat.id} style={{width:40,height:40,borderRadius:10,marginLeft:i>0?-12:0,border:`2px solid ${C.white}`,zIndex:cats.length-i,overflow:"hidden",flexShrink:0,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                      {cat.photo?<img src={cat.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                    </div>
                  ))}
                </div>
                <div style={{flex:1,minWidth:0}}>

              </div>
              {cats.length>1&&<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{cats.map((cat,i)=><span key={cat.id} style={S.chip(i===0?C.text2:C.orange)}>{cat.name}{i>0?" +฿50":""}</span>)}</div>}

    </div></div>

  </div>);
}

// BOOKINGS PAGE
// ════════════════════════════════════════════════════════════════
function BookingsPage({bookings,customers,onSaveBooking,onDeleteBooking,onImportBookings}){
  const [showForm,setShowForm]=useState(false);
  const [editBook,setEditBook]=useState(null);
  const [filter,setFilter]=useState("upcoming");
  const [search,setSearch]=useState("");
  const [selectMode,setSelectMode]=useState(false);
  const [selected,setSelected]=useState([]);
  const now=today();

  const byFilter=bookings.filter(b=>filter==="upcoming"?b.checkout>=now:filter==="past"?b.checkout<now:true);
  const filtered=byFilter.filter(b=>{
    if(!search.trim()) return true;
    const s=search.toLowerCase().trim();
    const cust=customers.find(c=>c.id===b.customerId);
    const cats=(cust?.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
    const catNames=cats.map(c=>c.name).join(" ").toLowerCase();
    const nickname=(cust?.nickname||"").toLowerCase();
    const phone=(cust?.phone||"").toLowerCase();
    const room=(b.roomIds||[b.roomId]).filter(Boolean).join(" ").toLowerCase();
    // Date search — support multiple formats
    const checkinFmt=b.checkin?fmt(b.checkin).toLowerCase():""; // "1 Mar 2026"
    const checkoutFmt=b.checkout?fmt(b.checkout).toLowerCase():"";
    const checkinRaw=b.checkin||""; // "2026-03-01"
    const checkoutRaw=b.checkout||"";
    // Month name search (mar, april, etc.)
    const MONTH_MAP={jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12",january:"01",february:"02",march:"03",april:"04",june:"06",july:"07",august:"08",september:"09",october:"10",november:"11",december:"12"};
    let matchDate=checkinFmt.includes(s)||checkoutFmt.includes(s)||checkinRaw.includes(s)||checkoutRaw.includes(s);
    // Try month name matching
    for(const [mname,mnum] of Object.entries(MONTH_MAP)){
      if(s.includes(mname)){
        if(checkinRaw.includes("-"+mnum+"-")||checkoutRaw.includes("-"+mnum+"-")) matchDate=true;
      }
    }
    return nickname.includes(s)||catNames.includes(s)||room.includes(s)||phone.includes(s)||matchDate;
  }).sort((a,b)=>a.checkin.localeCompare(b.checkin));

  const toggleSelect=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const toggleSelectAll=()=>setSelected(s=>s.length===filtered.length?[]:filtered.map(b=>b.id));
  const exitSelect=()=>{setSelectMode(false);setSelected([]);};
  const bulkDelete=async()=>{
    if(!window.confirm(`ลบ ${selected.length} booking ที่เลือก?`)) return;
    for(const id of selected) await onDeleteBooking(id);
    exitSelect();
  };

  return(<div>
    <div style={S.header}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={S.htitle}>Bookings</div><div style={S.hSub}>{bookings.length} total · {bookings.filter(b=>b.checkin<=now&&b.checkout>=now).length} active now</div></div>
        <div style={{display:"flex",gap:6}}>
          {!selectMode?(
            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={()=>setSelectMode(true)}>☑ Select</button>
              <button style={S.btnP} onClick={()=>setShowForm(true)}>+ Book</button>
            </>
          ):(
            <>
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={toggleSelectAll}>
                {selected.length===filtered.length?"✕ Clear All":"✓ All"}
              </button>
              {selected.length>0&&<button style={{...S.btnD,padding:"8px 12px",fontSize:12}} onClick={bulkDelete}>🗑 Delete {selected.length}</button>}
              <button style={{...S.btnG,fontSize:12,padding:"8px 10px"}} onClick={exitSelect}>Cancel</button>
            </>
          )}
        </div>
      </div>
      <div style={{...S.tabs,marginTop:12}}>{[["upcoming","Upcoming"],["past","Past"],["all","All"]].map(([v,l])=><button key={v} style={S.tab(filter===v)} onClick={()=>{setFilter(v);exitSelect();setSearch("");}}>{l}</button>)}</div>
      <input style={{...S.inp,marginTop:10}} placeholder="🔍  Search by name, cat, room, date (e.g. Mar, Apr 2026)..." value={search} onChange={e=>{setSearch(e.target.value);exitSelect();}}/>
    </div>
    <div style={{...S.sec,marginTop:0}}><div style={{marginTop:16}}>
      {filtered.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:C.text3}}><div style={{fontSize:32,marginBottom:8}}>📋</div>No bookings</div>
        :filtered.map(b=>{
          const cust=customers.find(c=>c.id===b.customerId);
          const cats=(cust?.cats||[]).filter(c=>(b.selectedCatIds||[]).includes(c.id));
          const n=nights(b.checkin,b.checkout); const isActive=b.checkin<=now&&b.checkout>=now;
          const room=ROOMS.find(r=>r.id===b.roomId);
          const isSel=selected.includes(b.id);
          return(<div key={b.id} style={{...S.card,marginBottom:10,borderLeft:isActive?`3px solid ${C.accent}`:"",outline:isSel?`2px solid ${C.accent}`:"none",background:isSel?C.accentBg:C.white}} onClick={selectMode?()=>toggleSelect(b.id):undefined}>
            <div style={{padding:"14px 16px"}}>
              <div style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
                {selectMode&&(
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${isSel?C.accent:C.border}`,background:isSel?C.accent:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>
                    {isSel&&<span style={{color:"#fff",fontSize:13,fontWeight:800}}>✓</span>}
                  </div>
                )}
                <div style={{display:"flex",flexShrink:0}}>
                  {cats.slice(0,2).map((cat,i)=>(
                    <div key={cat.id} style={{width:38,height:38,borderRadius:9,overflow:"hidden",flexShrink:0,marginLeft:i>0?-10:0,border:`2px solid ${C.white}`,background:C.accentBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>
                      {cat.photo?<img src={cat.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={cat.name}/>:"🐱"}
                    </div>
                  ))}
                  {cats.length===0&&<div style={{...S.av(""),width:38,height:38,borderRadius:9,fontSize:17}}>🐱</div>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700}}>{cust?.nickname||"?"} <span style={{fontWeight:600,color:C.text2}}>({cats.length>0?cats.map(c=>c.name).join(", "):(b.catName||"Cat")})</span></div>
                  <div style={{fontSize:12,color:C.text2}}>{fmt(b.checkin)} → {fmt(b.checkout)} · {n} night{n>1?"s":""}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:16,fontWeight:800,color:C.accent}}>฿{(b.net||0).toLocaleString()}</div>{b.discount>0&&<div style={{fontSize:11,color:C.red}}>-{b.discount}%</div>}</div>
              </div>
              {/* Booking notes + Customer notes */}
              {b.notes&&!selectMode&&(
                <div style={{background:"#f0f6ff",borderRadius:8,padding:"6px 10px",marginBottom:6,border:"1px solid #0071e320",display:"flex",gap:6,alignItems:"flex-start"}}>
                  <span style={{fontSize:11,flexShrink:0}}>📋</span>
                  <NotesText text={b.notes} style={{fontSize:12,color:C.text2,lineHeight:1.5}}/>
                </div>
              )}
              {cust?.notes&&!selectMode&&(
                <div style={{background:"#fffbf0",borderRadius:8,padding:"6px 10px",marginBottom:8,border:"1px solid #ffd70040",display:"flex",gap:6,alignItems:"flex-start"}}>
                  <span style={{fontSize:11,flexShrink:0}}>📝</span>
                  <NotesText text={cust.notes} style={{fontSize:12,color:C.text2,lineHeight:1.5}}/>
                </div>
              )}
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:selectMode?0:10}}>
                {isActive&&<span style={S.chip(C.accent)}>🐾 Active</span>}
                {(b.roomIds&&b.roomIds.length>0?b.roomIds:[b.roomId]).filter(Boolean).map(rid=>{
                  const rr=ROOMS.find(x=>x.id===rid);
                  return rid?<span key={rid} style={S.chip(getRoomColor(rid))}>{rid}</span>:null;
                })}
                <span style={S.chip(b.paid?C.green:C.orange)}>{b.paid?"✓ Paid Full":"Unpaid"}</span>
                {!b.paid&&b.depositAmt>0&&<span style={S.chip(C.orange)}>💰 มัดจำ ฿{b.depositAmt.toLocaleString()}</span>}
                {!b.paid&&b.remaining>0&&<span style={S.chip(C.red)}>คงเหลือ ฿{b.remaining.toLocaleString()}</span>}
                <span style={S.chip(C.blue)}>{b.payMethod}</span>
                {(b.selectedCatIds?.length||0)>1&&<span style={S.chip(C.purple)}>{b.selectedCatIds.length} cats</span>}
                {b.litter&&<span style={S.chip(C.blue)}>🪣 ทราย</span>}
              </div>
              {!selectMode&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button style={{...S.btnG,fontSize:12,padding:"7px 12px"}} onClick={()=>setEditBook(b)}>Edit</button>
                <button style={S.btnD} onClick={()=>{if(window.confirm("Delete this booking?"))onDeleteBooking(b.id);}}>Delete</button>
                <button style={{padding:"7px 10px",background:"#f0f6ff",color:C.blue,border:`1px solid ${C.blue}25`,borderRadius:9,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>exportICS(b,customers)}>📅 iCal</button>
                {!b.paid&&<button style={{padding:"7px 12px",background:C.greenBg,color:C.green,border:`1px solid ${C.green}30`,borderRadius:9,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",marginLeft:"auto"}} onClick={()=>onSaveBooking({...b,paid:true})}>Mark Paid ✓</button>}
              </div>}
            </div>
          </div>);
        })
      }
    </div></div>
    {(showForm||editBook)&&<BookingSheet booking={editBook} customers={customers} bookings={bookings} onSave={async d=>{await onSaveBooking(d);setShowForm(false);setEditBook(null);}} onClose={()=>{setShowForm(false);setEditBook(null);}}/>}
  </div>);
}

// DASHBOARD PAGE — Revenue + MoM + YoY

// Color palette for multi-year lines
const YEAR_COLORS=["#ff6b9d","#0071e3","#34c759","#ff9500","#af52de"];

function getMonthRevenue(bookings, year, month){
  // month: 0-11
  const s=new Date(year,month,1);
  const e=new Date(year,month+1,0);
  const ds=d=>d.toISOString().split("T")[0];
  return bookings.filter(b=>b.checkin>=ds(s)&&b.checkin<=ds(e)).reduce((a,b)=>a+(b.net||0),0);
}
function getMonthBookings(bookings, year, month){
  const s=new Date(year,month,1);
  const e=new Date(year,month+1,0);
  const ds=d=>d.toISOString().split("T")[0];
  return bookings.filter(b=>b.checkin>=ds(s)&&b.checkin<=ds(e)).length;
}
function pct(a,b){ if(!b) return null; return Math.round((a-b)/b*100); }
function PctBadge({val}){
  if(val===null) return <span style={{fontSize:11,color:"#bbb"}}>—</span>;
  const up=val>=0;
  return <span style={{fontSize:11,fontWeight:700,color:up?C.green:C.red,background:up?"#f0fdf4":"#fff5f5",padding:"2px 7px",borderRadius:100,border:`1px solid ${up?C.green+"40":C.red+"40"}`}}>{up?"+":""}{val}%</span>;
}
