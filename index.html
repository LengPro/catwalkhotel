function importCombinedCSV(rows, existingCustomers, existingBookings){
  const newCustomers=[];
  const newBookings=[];
  const errors=[];
  const custMap={}; // nickname.lower -> customer obj

  // Pre-load existing customers into map
  existingCustomers.forEach(c=>{ custMap[c.nickname.toLowerCase()]=c; });

  rows.forEach((r,i)=>{
    const rowNum=i+2;
    // ── Read fields (flexible column names) ──
    const name=(r["name"]||r["nickname"]||r["ชื่อ"]||r["ชื่อเล่น"]||r["owner"]||r["owner name"]||"").trim();
    const phone=(r["phone"]||r["tel"]||r["mobile"]||r["เบอร์โทร"]||"").trim();
    const lineId=(r["line"]||r["line id"]||r["line_id"]||"").trim();
    const address=(r["address"]||r["ที่อยู่"]||"").trim();
    const ownerNotes=(r["owner notes"]||r["customer notes"]||"").trim();
    const catName=(r["cat name"]||r["cat"]||r["ชื่อแมว"]||r["cat1 name"]||r["cat 1"]||"").trim();
    const catBreed=(r["breed"]||r["cat breed"]||r["สายพันธุ์"]||r["cat1 breed"]||"").trim();
    const cat2Name=(r["cat2 name"]||r["cat 2"]||"").trim();
    const cat2Breed=(r["cat2 breed"]||"").trim();
    const cat3Name=(r["cat3 name"]||r["cat 3"]||"").trim();
    const cat3Breed=(r["cat3 breed"]||"").trim();
    const roomId=(r["room"]||r["room id"]||r["ห้อง"]||r["roomid"]||"").trim().toUpperCase();
    const checkin=(r["check-in (yyyy-mm-dd)"]||r["check-in"]||r["checkin"]||r["check in"]||r["วันเข้า"]||r["เช็คอิน"]||"").trim();
    const checkout=(r["check-out (yyyy-mm-dd)"]||r["check-out"]||r["checkout"]||r["check out"]||r["วันออก"]||r["เช็คเอาท์"]||"").trim();
    const size=(r["size"]||r["room size"]||r["type"]||"S").trim().toUpperCase()||"S";
    const discount=parseFloat(r["discount"]||r["discount %"]||r["ส่วนลด"]||"0")||0;
    const deposit=parseFloat(r["deposit"]||r["มัดจำ"]||"0")||0;
    const payMethod=(r["payment"]||r["payment method"]||r["การชำระ"]||r["pay method"]||"Cash").trim()||"Cash";
    const paid=(r["paid"]||r["ชำระแล้ว"]||"").toLowerCase()==="yes";
    const litter=(r["litter"]||r["cat litter"]||r["ทราย"]||"").toLowerCase()==="yes";
    const notes=(r["notes"]||r["หมายเหตุ"]||"").trim();

    if(!name){ errors.push(`Row ${rowNum}: ไม่มีชื่อลูกค้า`); return; }

    // ── Create or find customer ──
    const nameKey=name.toLowerCase();
    if(!custMap[nameKey]){
      const cats=[];
      if(catName) cats.push({id:uid(),name:catName,breed:catBreed,notes:"",photo:"",vaccinePassport:""});
      if(cat2Name) cats.push({id:uid(),name:cat2Name,breed:cat2Breed,notes:"",photo:"",vaccinePassport:""});
      if(cat3Name) cats.push({id:uid(),name:cat3Name,breed:cat3Breed,notes:"",photo:"",vaccinePassport:""});
      const newCust={
        id:uid(),nickname:name,phone,line:lineId,address,notes:ownerNotes,idCard:"",
        cats:cats.length>0?cats:[{id:uid(),name:catName||"",breed:catBreed,notes:"",photo:"",vaccinePassport:""}],
        createdAt:new Date().toISOString(),
      };
      newCustomers.push(newCust);
      custMap[nameKey]=newCust;
    }

    // ── Create booking if dates present ──
    if(checkin&&checkout){
      // Validate date format YYYY-MM-DD
      if(!/^\d{4}-\d{2}-\d{2}$/.test(checkin)||!/^\d{4}-\d{2}-\d{2}$/.test(checkout)){
        errors.push(`Row ${rowNum}: วันที่ format ผิด (ต้องเป็น YYYY-MM-DD) → "${checkin}" / "${checkout}"`);
        return;
      }
      const cust=custMap[nameKey];
      const cats=cust.cats||[];
      const selectedCatIds=cats.filter(c=>c.name).map(c=>c.id);
      const numCats=Math.max(selectedCatIds.length,1);
      const roomSize=roomId?(ROOMS.find(r=>r.id===roomId)?.type||size):size;
      const n=nights(checkin,checkout);
      const {base,discAmt,net,litterAmt,litterWeeks}=n>0?calcPrice(n,roomSize,numCats,discount,litter):{base:0,discAmt:0,net:0,litterAmt:0,litterWeeks:0};
      const remaining=Math.max(0,net-deposit);

      // Check duplicate booking
      const dupBook=existingBookings.find(b=>b.customerId===cust.id&&b.checkin===checkin&&b.checkout===checkout);
      if(dupBook){ errors.push(`Row ${rowNum}: booking ซ้ำ (${name} ${checkin})`); return; }

      newBookings.push({
        id:uid(),customerId:cust.id,
        roomId:roomId||"",roomIds:roomId?[roomId]:[],
        size:roomSize,checkin,checkout,
        selectedCatIds,numCats,
        discount,base,discAmt,net,
        litter,litterAmt,litterWeeks,
        depositAmt:deposit,remaining,paid,
        payMethod,notes,
        createdAt:new Date().toISOString(),
      });
    }
  });

  return{newCustomers,newBookings,errors,totalRows:rows.length};
}

function SettingsPage({customers,bookings,onImportCustomers,onImportBookings,setToast}){
  const [step,setStep]=useState("idle");
  const [preview,setPreview]=useState(null);
  const [dragOver,setDragOver]=useState(false);
  const fileRef=useRef();

  const processFile=async(file)=>{
    if(!file) return;
    setStep("importing");
    const text=await file.text();
    const rows=parseCSV(text);
    if(rows.length===0){setStep("idle");setToast("❌ ไม่พบข้อมูลในไฟล์");return;}

    const headers=Object.keys(rows[0]).map(h=>h.toLowerCase());
    const hasBookingCols=headers.some(h=>h.includes("check")||h.includes("room"));
    const hasCustomerCols=headers.some(h=>h.includes("name")||h.includes("nickname"));

    if(hasCustomerCols&&hasBookingCols){
      // Combined format
      const result=importCombinedCSV(rows,customers,bookings);
      setPreview({type:"combined",...result});
    } else if(hasBookingCols){
      const{newBookings,results}=importBookingsFromCSV(rows,customers);
      setPreview({type:"bookings",newBookings,results,totalRows:rows.length});
    } else if(hasCustomerCols){
      const{newCustomers,results}=importCustomersFromCSV(rows,customers);
      setPreview({type:"customers",newCustomers,results,totalRows:rows.length});
    } else {
      setToast("❌ ไม่รู้จัก format ของไฟล์นี้");
      setStep("idle");
      return;
    }
    setStep("preview");
  };

  const handleConfirm=async()=>{
    if(!preview) return;
    if(preview.type==="combined"){
      if(preview.newCustomers.length>0) await onImportCustomers(preview.newCustomers);
      if(preview.newBookings.length>0) await onImportBookings(preview.newBookings);
      setToast(`✅ Import ${preview.newCustomers.length} ลูกค้า + ${preview.newBookings.length} booking สำเร็จ!`);
    } else if(preview.type==="customers"){
      await onImportCustomers(preview.newCustomers);
      setToast(`✅ Import ${preview.newCustomers.length} ลูกค้าสำเร็จ!`);
    } else {
      await onImportBookings(preview.newBookings);
      setToast(`✅ Import ${preview.newBookings.length} booking สำเร็จ!`);
    }
    setStep("done");
    setTimeout(()=>{setStep("idle");setPreview(null);},3000);
  };

  return(<div>
    <div style={S.header}>
      <div style={S.htitle}>⚙️ Settings</div>
      <div style={S.hSub}>Import & manage data</div>
    </div>
    <div style={{padding:"16px 16px 40px"}}>

      {/* ── Combined Import ── */}
      <div style={S.slabel}>📥 Import จาก CSV (รองรับทุก format)</div>
      <div style={{...S.cardPad,marginBottom:16}}>

        {/* format guide */}
        <div style={{background:C.blueBg,borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,color:C.blue,lineHeight:1.7}}>
          <div style={{fontWeight:800,marginBottom:4}}>✅ รองรับ 3 format:</div>
          <div>1. <b>Combined</b> — 1 ไฟล์รวม ลูกค้า+แมว+booking ทีเดียว</div>
          <div>2. <b>Customers only</b> — ข้อมูลลูกค้าและแมว</div>
          <div>3. <b>Bookings only</b> — ข้อมูลการจองอย่างเดียว</div>
        </div>

        {step==="idle"&&(
          <div
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files[0];if(f)processFile(f);}}
            onClick={()=>fileRef.current.click()}
            style={{border:`2px dashed ${dragOver?C.accent:C.border}`,borderRadius:14,padding:"32px 20px",textAlign:"center",cursor:"pointer",background:dragOver?C.accentBg:C.bg,transition:"all 0.2s"}}
          >
            <div style={{fontSize:40,marginBottom:8}}>📂</div>
            <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:4}}>แตะเพื่อเลือกไฟล์ CSV</div>
            <div style={{fontSize:12,color:C.text3}}>หรือ Drag & Drop ที่นี่</div>
            <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}} onChange={e=>{if(e.target.files[0])processFile(e.target.files[0]);}}/>
          </div>
        )}

        {step==="importing"&&(
          <div style={{textAlign:"center",padding:"32px 20px"}}>
            <div style={{fontSize:36,marginBottom:8}}>⏳</div>
            <div style={{fontSize:14,fontWeight:600}}>กำลังอ่านและวิเคราะห์ไฟล์...</div>
          </div>
        )}

        {step==="preview"&&preview&&(
          <div>
            {/* Summary */}
            <div style={{background:preview.errors?.length>0?C.accentBg:C.greenBg,borderRadius:10,padding:"12px 14px",marginBottom:12}}>

                    <div style={{...S.statCard,textAlign:"center"}}>
                      <div style={{fontSize:20,fontWeight:800,color:C.accent}}>{preview.newCustomers.length}</div>
                      <div style={{fontSize:10,color:C.text3}}>ลูกค้าใหม่</div>
                    </div>
                    <div style={{...S.statCard,textAlign:"center"}}>
                      <div style={{fontSize:20,fontWeight:800,color:C.blue}}>{preview.newBookings.length}</div>
                      <div style={{fontSize:10,color:C.text3}}>Booking</div>
                    </div>

                      <div style={{fontSize:10,color:C.text3}}>ข้ามแถว</div>
                    </div>
                  </div>

              )}
              {preview.type!=="combined"&&(

              </div>
            )}

            <div style={{display:"flex",gap:8}}>
              <button style={{...S.btnP,flex:1}} onClick={handleConfirm}>
                ✅ Confirm Import
              </button>
              <button style={S.btnG} onClick={()=>{setStep("idle");setPreview(null);}}>ยกเลิก</button>
            </div>

        )}

        {step==="done"&&(
          <div style={{textAlign:"center",padding:"24px 20px"}}>
            <div style={{fontSize:40,marginBottom:8}}>🎉</div>
            <div style={{fontSize:15,fontWeight:700,color:C.green}}>Import สำเร็จ!</div>

      {/* ── Download Combined Template ── */}
      <div style={S.slabel}>📄 Download Template</div>
      <div style={{...S.cardPad,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Combined Template (แนะนำ)</div>
        <div style={{fontSize:11,color:C.text3,marginBottom:12,lineHeight:1.6}}>
          1 ไฟล์ รวมทั้งลูกค้า+แมว+booking — แต่ละแถว = 1 booking
        </div>
        <div style={{fontSize:11,color:C.text3,marginBottom:12}}>
          คอลัมน์: Name, Phone, Cat Name, Breed, Room, Check-in, Check-out, Size, Discount%, Deposit, Payment, Paid
        </div>
        <button style={{...S.btnP,width:"100%"}} onClick={()=>{
          const h=["Name","Phone","Line ID","Cat Name","Breed","Cat2 Name","Cat2 Breed","Room","Check-in (YYYY-MM-DD)","Check-out (YYYY-MM-DD)","Size (S/M)","Discount %","Deposit","Payment Method","Paid (Yes/No)","Cat Litter (Yes/No)","Notes"];
          const ex=[
            ["K.Nong","0812345678","@nong","Mochi","Scottish Fold","Luna","Persian","A-S2","2026-04-01","2026-04-07","S","0","500","Cash","No","No",""],
            ["K.Nong","0812345678","@nong","Mochi","Scottish Fold","Luna","Persian","A-S2","2026-05-10","2026-05-15","S","10","0","Transfer","Yes","No",""],
            ["K.Joy","0898765432","","Taro","Maine Coon","","","B-S6","2026-04-05","2026-04-10","S","0","0","Cash","Yes","Yes",""],
          ];
          dlCSV([h,...ex],"catwalk-combined-template.csv");
          setToast("✅ Downloaded template!");
        }}>
          ⬇ Download Combined Template
        </button>
        <div style={{marginTop:10,display:"flex",gap:8}}>
          <button style={{...S.btnG,flex:1,fontSize:12}} onClick={()=>{const h=["Name","Phone","Line ID","Address","Notes","Cat1 Name","Cat1 Breed","Cat2 Name","Cat2 Breed","Cat3 Name","Cat3 Breed"];const ex=[["K.Nong","0812345678","@nong","Bangkok","","Mochi","Scottish Fold","Luna","Persian","",""]];dlCSV([h,...ex],"template-customers.csv");}}>
            ⬇ Customers only
          </button>
          <button style={{...S.btnG,flex:1,fontSize:12}} onClick={()=>{const h=["Customer Nickname","Cat Names","Room ID","Check-in (YYYY-MM-DD)","Check-out (YYYY-MM-DD)","Size (S/M)","Discount %","Deposit","Payment Method","Paid (Yes/No)","Cat Litter (Yes/No)","Notes"];const ex=[["K.Nong","Mochi","A-S1","2026-04-01","2026-04-07","S","0","500","Cash","No","No",""]];dlCSV([h,...ex],"template-bookings.csv");}}>
            ⬇ Bookings only
          </button>
        </div>
      </div>

      {/* ── Export ── */}
      <div style={S.slabel}>📤 Export Data</div>
      <div style={{...S.card,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.borderLight}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><div style={{fontSize:13,fontWeight:700}}>Export Bookings</div><div style={{fontSize:11,color:C.text3}}>{bookings.length} bookings</div></div>
          <button style={{...S.btnG,fontSize:12}} onClick={()=>exportBookingsCSV(bookings,customers)}>⬇ CSV</button>
        </div>
        <div style={{padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><div style={{fontSize:13,fontWeight:700}}>Export Customers</div><div style={{fontSize:11,color:C.text3}}>{customers.length} customers</div></div>
          <button style={{...S.btnG,fontSize:12}} onClick={()=>exportCustomersCSV(customers,bookings)}>⬇ CSV</button>
        </div>
      </div>

      {/* ── About ── */}
      <div style={S.slabel}>ℹ️ About</div>
      <div style={{...S.cardPad,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:800,color:C.accent,marginBottom:4}}>🐱 CATWALK Cat Hotel</div>
        <div style={{fontSize:12,color:C.text3}}>v 23 Mar 2026 · 13:45</div>
        <div style={{fontSize:12,color:C.text3,marginTop:4}}>16 rooms · Firebase Realtime Sync</div>
      </div>
    </div>
  </div>);
}

// ════════════════════════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("rooms");
  const [customers,setCustomers]=useState([]);
  const [bookings,setBookings]=useState([]);
  const [loading,setLoading]=useState(true);
  const [dbError,setDbError]=useState(null);
  const [toast,setToast]=useState("");
  const [sync,setSync]=useState("");

  // Load + realtime listeners
  useEffect(()=>{
    let loadTimeout=setTimeout(()=>{
      setLoading(false);
      setDbError("connection_timeout");
    },10000); // 10s timeout

    const unsubC=db.collection("customers").orderBy("createdAt","asc").onSnapshot(
      snap=>{
        clearTimeout(loadTimeout);
        setCustomers(snap.docs.map(d=>({id:d.id,...d.data()})));
        setLoading(false);
        setDbError(null);
      },
      err=>{
        clearTimeout(loadTimeout);
        console.error("Firestore customers error:",err);
        setLoading(false);
        setDbError(err.code||"unknown");
      }
    );
    const unsubB=db.collection("bookings").orderBy("createdAt","asc").onSnapshot(
      snap=>{ setBookings(snap.docs.map(d=>({id:d.id,...d.data()}))); },
      err=>{ console.error("Firestore bookings error:",err); }
    );
    return()=>{ clearTimeout(loadTimeout); unsubC(); unsubB(); };
  },[]);

  const saving=async fn=>{setSync("saving");try{await fn();setSync("saved");setTimeout(()=>setSync(""),2000);}catch(e){setSync("error");setToast("❌ Save failed");setTimeout(()=>setSync(""),3000);}};

  const onImportCustomers=useCallback(async(newItems)=>{
    saving(async()=>{
      const batch=db.batch();
      newItems.forEach(item=>{ const{id,...rest}=item; batch.set(db.collection("customers").doc(id),rest); });
      await batch.commit();
      // ไม่ต้อง setCustomers เอง — onSnapshot จะอัพเดทให้อัตโนมัติ
      setToast(`✅ Import ${newItems.length} ลูกค้าสำเร็จ!`);
    });
  },[]);

  const onImportBookings=useCallback(async(newItems)=>{
    saving(async()=>{
      const batch=db.batch();
      newItems.forEach(item=>{ const{id,...rest}=item; batch.set(db.collection("bookings").doc(id),rest); });
      await batch.commit();
      // ไม่ต้อง setBookings เอง — onSnapshot จะอัพเดทให้อัตโนมัติ
      setToast(`✅ Import ${newItems.length} booking สำเร็จ!`);
    });
  },[]);
  const onSaveCustomer=useCallback(async d=>saving(async()=>{await fbSave("customers",d.id,d);setToast("Saved ☁️");}),[]);
  const onDeleteCustomer=useCallback(async id=>saving(async()=>{await fbDelete("customers",id);setToast("Deleted ✓");}),[]);
  const onSaveBooking=useCallback(async d=>saving(async()=>{await fbSave("bookings",d.id,d);setToast("Saved ☁️");}),[]);
  const onDeleteBooking=useCallback(async id=>saving(async()=>{await fbDelete("bookings",id);setToast("Deleted ✓");}),[]);

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"'Plus Jakarta Sans',sans-serif",color:C.text3}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>🐱</div>
        <div style={{fontSize:14,fontWeight:600,marginBottom:4,color:C.text}}>กำลังโหลดข้อมูล...</div>
        <div style={{fontSize:12}}>Connecting to Firebase</div>
      </div>
    </div>
  );

  if(dbError)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",fontFamily:"'Plus Jakarta Sans',sans-serif",padding:24,background:C.bg}}>
      <div style={{textAlign:"center",maxWidth:340,width:"100%"}}>
        <div style={{fontSize:48,marginBottom:16}}>🔒</div>
        <div style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:8}}>ไม่สามารถเชื่อมต่อ Database</div>
        <div style={{fontSize:13,color:C.text2,lineHeight:1.8,marginBottom:20}}>
          <div>Firebase rules อาจหมดอายุ (30 วัน test mode)</div>
          <div>ต้องอัพเดท Firestore Rules ก่อนครับ</div>
        </div>
        <div style={{background:C.blueBg,borderRadius:14,padding:"16px 18px",textAlign:"left",marginBottom:16,border:`1px solid ${C.blue}20`}}>
          <div style={{fontSize:13,fontWeight:800,color:C.blue,marginBottom:10}}>🔧 วิธีแก้ (2 นาที)</div>
          {[
            ["1","ไปที่ console.firebase.google.com"],
            ["2","เลือก project CATWALK CMS"],
            ["3","เมนูซ้าย → Firestore Database"],
            ["4",'คลิก tab "Rules" แถวบนสุด'],
            ["5","แทนที่ rules ด้วย code ด้านล่าง"],
            ["6","กด Publish สีน้ำเงิน → กลับมากดปุ่ม Reload"],
          ].map(([n,t])=>(
            <div key={n} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>
              <div style={{width:22,height:22,borderRadius:"50%",background:C.blue,color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{n}</div>
              <div style={{fontSize:12,color:C.text,lineHeight:1.6}}>{t}</div>
            </div>
          ))}
        </div>
        <div style={{background:"#1c1c1e",borderRadius:12,padding:"14px 16px",textAlign:"left",marginBottom:16}}>
          <div style={{fontSize:10,color:"#888",marginBottom:8,letterSpacing:"0.06em",fontFamily:"monospace"}}>FIRESTORE RULES — copy ทั้งหมด</div>
          <pre style={{fontSize:11,color:"#4fffb0",margin:0,lineHeight:1.8,fontFamily:"monospace",whiteSpace:"pre-wrap"}}>{"rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}"}</pre>
        </div>
        <button style={{...S.btnB,width:"100%",marginBottom:10,padding:"14px"}} onClick={()=>window.open("https://console.firebase.google.com","_blank")}>
          🔗 เปิด Firebase Console
        </button>
        <button style={{...S.btnG,width:"100%",padding:"13px",fontSize:13}} onClick={()=>window.location.reload()}>
          🔄 Reload หลังแก้ Rules แล้ว
        </button>
        <div style={{marginTop:12,fontSize:11,color:C.text3}}>Error: {dbError}</div>
      </div>
    </div>
  );

  const todayActive=bookings.filter(b=>b.checkin<=today()&&b.checkout>=today()).length;
  const freeToday=ROOMS.length-todayActive;

  return(<div style={S.app}>
    {sync&&<div style={{position:"fixed",top:0,left:0,right:0,height:3,zIndex:999,background:sync==="saving"?C.orange:sync==="saved"?C.green:C.red,transition:"background 0.3s"}}/>}

    {/* ── Main Content ── */}
    {page==="rooms"    &&<RoomsPage     bookings={bookings} customers={customers} setToast={setToast} onSaveBooking={onSaveBooking} onDeleteBooking={onDeleteBooking}/>}
    {page==="bookings" &&<BookingsPage  bookings={bookings} customers={customers} onSaveBooking={onSaveBooking} onDeleteBooking={onDeleteBooking} onImportBookings={onImportBookings}/>}
    {page==="customers"&&<CustomersPage customers={customers} bookings={bookings} onSaveCustomer={onSaveCustomer} onDeleteCustomer={onDeleteCustomer} onSaveBooking={onSaveBooking} onImportCustomers={onImportCustomers} setToast={setToast}/>}
    {page==="dashboard"&&<DashboardPage bookings={bookings} customers={customers} onExportBookings={()=>{exportBookingsCSV(bookings,customers);setToast("CSV downloaded!");}}/>}
    {page==="settings" &&<SettingsPage  customers={customers} bookings={bookings} onImportCustomers={onImportCustomers} onImportBookings={onImportBookings} setToast={setToast}/>}

    {/* ── Bottom Nav ── */}
    <div style={S.nav}>
      {[
        {id:"rooms",    icon:"🏠", label:"Rooms",    badge:todayActive, badgeColor:C.accent},
        {id:"bookings", icon:"📋", label:"Bookings", badge:todayActive, badgeColor:C.accent},
        {id:"customers",icon:"😺", label:"Customers",badge:0},
        {id:"dashboard",icon:"📊", label:"Dashboard",badge:0},
        {id:"settings", icon:"⚙️", label:"Settings", badge:0},
      ].map(n=>(
        <button key={n.id} style={S.navBtn(page===n.id)} onClick={()=>setPage(n.id)}>
          {page===n.id&&<div style={{position:"absolute",bottom:0,left:"20%",right:"20%",height:3,background:C.accent,borderRadius:"4px 4px 0 0"}}/>}
          <div style={{position:"relative",lineHeight:1}}>
            <span style={{fontSize:24}}>{n.icon}</span>
            {n.badge>0&&<span style={{position:"absolute",top:-4,right:-8,background:n.badgeColor||C.accent,color:"#fff",fontSize:9,fontWeight:800,width:17,height:17,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center"}}>{n.badge}</span>}
          </div>
          <div style={{fontSize:10,fontWeight:page===n.id?800:600,letterSpacing:"0.01em"}}>{n.label}</div>
        </button>
      ))}
    </div>

    <Toast msg={toast} onHide={()=>setToast("")}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
